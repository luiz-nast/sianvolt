<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sianvolt</title>
<link rel="icon" href="icone.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --fundo: #14171A; --area: #0E1012; --painel: #1C2024; --borda: #2A3036; --borda2: #3A424A; --ativo: #2E353C;
  --texto: #E8EAED; --sec: #9AA3AD; --placa: #1F6F4A; --cobre: #E0A458; --ok: #6FD39B; --erro: #FF8A80; --destaque: #8EC5FF;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--fundo); color: var(--texto); font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; background: transparent; border: 0; cursor: pointer; }
a, .link { color: var(--cobre); }
.mono { font-family: var(--mono); }
.sub { font-family: var(--mono); font-size: 12px; color: var(--sec); }

/* topo */
header { position: relative; display: flex; align-items: center; gap: 12px; padding: 0 20px; min-height: 56px; border-bottom: 1px solid var(--borda); }
header .voltar { width: 36px; height: 36px; flex: none; display: flex; align-items: center; justify-content: center; margin-left: -8px; border-radius: 8px; color: var(--sec); text-decoration: none; font-size: 18px; }
header .voltar:hover { background: #262C32; color: var(--texto); }
header .nome { flex: 1 1 200px; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header nav { display: flex; gap: 4px; align-self: stretch; }
header nav button { min-height: 56px; padding: 0 16px; color: var(--sec); border-bottom: 2px solid transparent; font-size: 14px; font-weight: 500; }
header nav button[aria-pressed="true"] { color: #F4F4F2; border-bottom-color: #F4F4F2; }
header .direita { flex: 1 1 200px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.pilula { min-height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid var(--borda); border-radius: 999px; font-family: var(--mono); font-size: 12px; color: #C8CDD2; }
.versoes { position: absolute; right: 20px; top: 60px; z-index: 20; width: 300px; max-height: 70vh; overflow: auto; display: flex; flex-direction: column; gap: 4px; background: var(--painel); border: 1px solid var(--borda2); border-radius: 10px; padding: 6px; }
.versoes button { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 8px; text-align: left; }
.versoes button[aria-pressed="true"] { background: var(--ativo); }
.versoes .v { font-family: var(--mono); font-size: 12px; color: var(--sec); }
.versoes .frase { font-size: 13px; line-height: 1.4; }
.versoes label { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px; margin-top: 4px; border-top: 1px solid var(--borda); font-size: 13px; color: #C8CDD2; cursor: pointer; }
.versoes input { width: 16px; height: 16px; accent-color: var(--ok); }
/* tela estreita (celular): as abas descem pra uma linha só delas, e nada da barra de cima empurra a página pro lado */
@media (max-width: 720px) {
  header { flex-wrap: wrap; gap: 0 8px; padding: 6px 12px 0; }
  header .nome { flex: 1 1 0; min-width: 0; }
  header .direita { flex: 0 1 auto; min-width: 0; }
  header nav { order: 3; flex: 1 1 100%; min-width: 0; overflow-x: auto; }
  header nav button { min-height: 44px; padding: 0 12px; flex: none; }
  .versoes { top: calc(100% + 4px); right: 12px; max-width: calc(100vw - 24px); }
  /* aba Projeto: o painel do ▶ Ligar (e o inspetor) desce pra baixo da placa, em vez de espremer ela de lado */
  main[data-aba="projeto"] { flex-direction: column; }
  main[data-aba="projeto"] > .area { flex: 1 1 auto; min-height: 240px; }
  main[data-aba="projeto"] > aside.inspetor { flex: 0 1 auto; max-height: 55%; border-left: 0; border-top: 1px solid var(--borda); padding: 16px; }
}

main { flex: 1; min-height: 0; display: flex; }
.vazio { margin: auto; color: var(--sec); font-size: 14px; text-align: center; line-height: 1.6; }

/* projeto */
.area { flex: 1; min-width: 0; position: relative; overflow: hidden; background: var(--area); user-select: none; }
.area .desenho { position: absolute; inset: 0; width: 100%; height: 100%; }
.area.mao { cursor: grab; } .area.arrastando { cursor: grabbing; }
.ferramentas { position: absolute; left: 16px; top: 16px; z-index: 5; display: flex; flex-direction: column; gap: 4px; background: var(--painel); border: 1px solid var(--borda); border-radius: 10px; padding: 4px; }
.ferramentas button { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #C8CDD2; }
.ferramentas button[aria-pressed="true"] { background: var(--ativo); color: #F4F4F2; }
.ferramentas button:hover { background: #262C32; }
.ferramentas .zoom { height: 32px; font-family: var(--mono); font-size: 11px; color: var(--sec); }
.ferramentas hr { width: 32px; border: 0; border-top: 1px solid var(--borda); margin: 4px auto; }
.aviso-versao { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); z-index: 5; padding: 6px 12px; border-radius: 999px; background: var(--painel); border: 1px solid var(--borda2); font-size: 12px; color: #C8CDD2; }
.hud { position: absolute; z-index: 6; pointer-events: none; display: flex; flex-direction: column; gap: 2px; background: rgba(14,16,18,0.92); border: 1px solid var(--borda2); border-radius: 8px; padding: 6px 10px; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.hud .xy { color: var(--sec); }
.tamanho { position: absolute; right: 16px; bottom: 12px; z-index: 5; pointer-events: none; font-family: var(--mono); font-size: 11px; color: var(--sec); }
.ferramentas button[data-ligar][aria-pressed="true"] { background: var(--ok); color: #0E2A1A; }
.ferramentas button[data-ligar][aria-pressed="true"]:hover { background: #8FE0B3; }
.ferramentas button:disabled { opacity: 0.35; cursor: not-allowed; }

/* circuito ligado */
.fluxo { stroke: #FFF3DC; stroke-dasharray: 0.9 0.9; stroke-linecap: round; fill: none; pointer-events: none; opacity: 0.9; animation: fluxo var(--dur, 1s) linear infinite; }
@keyframes fluxo { to { stroke-dashoffset: -1.8; } }
.brilho { fill: #FF8A80; pointer-events: none; }
.corpo.apertado { fill: rgba(224, 164, 88, 0.35); }
.painel .dica { margin: 0; font-size: 13px; color: var(--sec); line-height: 1.5; }
.controle { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.controle > span { display: flex; justify-content: space-between; gap: 8px; }
.controle b { font-family: var(--mono); font-weight: 500; }
.controle input[type="range"] { width: 100%; accent-color: var(--cobre); margin: 0; }
.controle .faixa { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--sec); }
.chaves { display: flex; flex-wrap: wrap; gap: 8px; }
.chaves .pilula[aria-pressed="true"] { background: var(--ativo); color: var(--texto); border-color: var(--borda2); }
.leitura { display: flex; flex-direction: column; gap: 6px; font-size: 13px; padding-top: 12px; border-top: 1px solid var(--borda); }
.leitura > span { display: flex; justify-content: space-between; gap: 8px; }
.leitura b { font-family: var(--mono); font-weight: 500; }
.leitura b.aceso, .leitura b.ok { color: var(--ok); } .leitura b.forte { color: var(--cobre); } .leitura b.queima { color: var(--erro); font-weight: 600; }
.barra { position: relative; height: 8px; margin: 6px 0 2px; border-radius: 4px; background: #22272C; }
.barra i { position: absolute; display: block; }
.barra .faixa-b { top: 0; bottom: 0; background: rgba(111, 211, 155, 0.35); border-radius: 4px; }
.barra .marca { top: -3px; width: 2px; height: 14px; background: var(--texto); }
.barra .teste { top: 1px; width: 1px; height: 6px; background: var(--sec); }
.barra .limite { top: -2px; width: 2px; height: 12px; background: var(--erro); }
.leitura .legenda { font-family: var(--mono); font-size: 11px; color: var(--sec); line-height: 1.5; }
.agora { font-family: var(--mono); font-size: 13px; padding: 8px 10px; border-radius: 8px; background: #173A26; color: var(--ok); }
.agora.queima { background: #3A1A1A; color: var(--erro); }
.formula { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--sec); line-height: 1.6; }
.formula .linha { display: block; }
/* ▶ Ligar com o cérebro: um bloco por GPIO usado, com a chave 0/1 (ou o botão, ou a luz do LDR) e o que o pino lê */
.gpios { display: flex; flex-direction: column; gap: 12px; }
.gpio { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.gpio .quem { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.gpio .quem b { font-family: inherit; font-weight: 600; } .gpio .quem .mono { font-size: 12px; color: var(--sec); }
.gpio .controles { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.gpio .controles .pilula[aria-pressed="true"] { background: var(--ativo); color: var(--texto); border-color: var(--borda2); }
.escolhas.mini button { min-height: 32px; padding: 0 12px; font-size: 13px; }
.gpio .le { font-family: var(--mono); font-size: 12px; color: #C8CDD2; line-height: 1.5; }
.gpio .le.queima { color: var(--erro); } .gpio .le.fora { color: var(--cobre); } .gpio .le.ok { color: var(--ok); }
.painel .pendentes { display: flex; flex-direction: column; gap: 4px; }
.painel .pendentes .a-conferir { font-size: 12px; }

aside.inspetor { flex: 0 0 340px; overflow: auto; padding: 20px; border-left: 1px solid var(--borda); display: flex; flex-direction: column; gap: 16px; font-size: 14px; }
.inspetor .cab { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.inspetor .tipo { font-size: 12px; color: var(--sec); }
.inspetor .titulo { font-family: var(--mono); font-size: 22px; font-weight: 500; word-break: break-all; }
.inspetor .fechar { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--sec); border-radius: 8px; }
.inspetor dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; }
.inspetor dt { color: var(--sec); }
.inspetor dd { margin: 0; font-family: var(--mono); font-size: 13px; word-break: break-word; }
.inspetor dd.alerta { color: var(--cobre); }
.inspetor .origem { display: flex; flex-direction: column; gap: 6px; }
.inspetor .origem span { font-size: 12px; color: var(--sec); }
.inspetor code { font-family: var(--mono); font-size: 13px; background: var(--painel); padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; }
.explica { display: flex; flex-direction: column; gap: 6px; background: #1A2230; border: 1px solid #2C3A52; border-radius: 10px; padding: 12px 14px; }
.explica b { font-size: 12px; font-weight: 600; color: var(--destaque); }
.explica p { margin: 0; line-height: 1.55; }

/* inicio: os projetos */
.inicio { flex: 1; overflow: auto; background: var(--area); padding: 40px 24px 48px; }
.inicio .miolo { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.inicio h1 { margin: 0; font-size: 22px; font-weight: 600; }
.cartoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.cartao { display: flex; flex-direction: column; gap: 12px; padding: 14px; background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; color: var(--texto); text-decoration: none; }
.cartao:hover { border-color: var(--borda2); background: #20252A; }
.cartao .sem-placa { aspect-ratio: 3 / 2; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--area); color: var(--sec); font-size: 13px; }
.cartao .titulo-cartao { font-size: 15px; font-weight: 600; }
.selos { display: flex; flex-wrap: wrap; gap: 6px; }
.selo { font-family: var(--mono); font-size: 11.5px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--borda); color: var(--sec); }
.selo.ok { color: var(--ok); } .selo.falha { color: var(--erro); } .selo.rodando { color: var(--cobre); }
svg.mini { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--area); }

/* processo: a historia do projeto em 4 passos */
.processo { flex: 1; overflow: auto; background: var(--area); padding: 32px 24px 48px; }
.passos { max-width: 760px; margin: 0 auto; padding: 0; list-style: none; display: flex; flex-direction: column; }
.passo { position: relative; display: flex; gap: 18px; padding-bottom: 28px; }
.passo:not(:last-child)::before { content: ''; position: absolute; left: 15px; top: 34px; bottom: 4px; width: 2px; background: var(--borda2); }
.passo .marca { width: 32px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 600; font-size: 14px; background: #22272C; color: #8A939C; border: 1px solid var(--borda2); }
.passo.ok .marca { background: #173A26; color: var(--ok); border-color: #24583A; }
.passo.falha .marca { background: #3A2E17; color: var(--cobre); border-color: #5A4527; }
.passo.rodando .marca { background: #3A2E17; color: var(--cobre); border-color: #5A4527; }
.passo .conteudo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; background: var(--painel); border: 1px solid var(--borda); border-radius: 12px; padding: 16px 18px; }
.passo h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sec); }
.passo p { margin: 0; line-height: 1.55; font-size: 14px; }
.passo .destaque { font-size: 17px; font-weight: 600; }
.passo ul, .passo ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.reqs li.ok { color: var(--ok); } .reqs li.falha { color: var(--cobre); }
.versoes-lista li { color: #C8CDD2; line-height: 1.45; }
.placa-resumo { display: grid; grid-template-columns: minmax(0, 260px) 1fr; gap: 16px; align-items: start; }
.caminho { max-width: 760px; margin: 0 auto 20px; font-size: 13px; color: var(--sec); line-height: 1.6; text-align: center; }
.compras li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; color: #C8CDD2; }
.compras .mono { color: var(--sec); min-width: 32px; }
.cotacao { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--borda); padding-top: 12px; }
.cotacao dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 13px; }
.cotacao dt { color: var(--sec); } .cotacao dd { margin: 0; }
.cotacao img { width: 100%; border-radius: 8px; border: 1px solid var(--borda); display: block; }
.link { min-height: 32px; padding: 0; color: var(--cobre); font-size: 13px; text-decoration: none; align-self: flex-start; display: inline-flex; align-items: center; }
@media (max-width: 640px) { .placa-resumo { grid-template-columns: 1fr; } }
.pergunta { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
.pergunta-txt { font-size: 15px; font-weight: 600; }
.escolhas { display: flex; flex-wrap: wrap; gap: 2px; align-self: flex-start; background: var(--area); border: 1px solid var(--borda); border-radius: 999px; padding: 3px; }
.escolhas button { min-height: 36px; padding: 0 18px; border-radius: 999px; font-size: 14px; color: #C8CDD2; }
.escolhas button[aria-pressed="true"] { background: var(--cobre); color: #2A1A05; font-weight: 600; }
.escolhas button:disabled { opacity: 0.5; cursor: wait; }
.cadeia { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.bloco { flex: 1 1 130px; display: flex; flex-direction: column; gap: 4px; padding: 12px; background: var(--area); border: 1px solid var(--borda); border-radius: 10px; }
.bloco .icone { height: 26px; color: var(--cobre); }
.bloco .icone svg { height: 26px; width: auto; display: block; }
.bloco .funcao { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sec); }
.bloco b { font-size: 15px; }
.bloco .por-que { font-size: 12.5px; color: #C8CDD2; line-height: 1.45; }
.cadeia .seta { align-self: center; color: var(--sec); font-size: 18px; }
.carrinho { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.item { display: grid; grid-template-columns: 72px 1fr; gap: 6px 14px; padding: 12px; background: var(--area); border: 1px solid var(--borda); border-radius: 10px; }
.item .foto, .opcao img { width: 72px; height: 72px; object-fit: contain; background: #F4F4F2; border-radius: 8px; display: block; }
.item .sem-foto { width: 72px; height: 72px; border-radius: 8px; background: #22272C; }
.item .info { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item .info b { font-size: 15px; }
.item .opcoes { grid-column: 1 / -1; }
.aviso { font-size: 13px; color: var(--cobre); line-height: 1.45; }
.conta { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: 8px; background: #1A2230; border: 1px solid #2C3A52; font-size: 13px; line-height: 1.5; }
.conta .mono { font-size: 12px; color: #C8CDD2; }
.conta .bate { color: var(--ok); font-weight: 600; } .conta .nao-bate { color: var(--cobre); font-weight: 600; }
.opcoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding-top: 8px; border-top: 1px solid var(--borda); margin-top: 6px; }
.opcoes > .sub, .opcoes > .vazio-op { grid-column: 1 / -1; }
.opcao { display: flex; flex-direction: column; gap: 3px; padding: 10px; border: 1px solid var(--borda); border-radius: 10px; background: var(--painel); font-size: 12.5px; }
.opcao.escolhida { border-color: #24583A; }
.opcao b { font-size: 12.5px; word-break: break-all; }
.opcao button { margin-top: 4px; min-height: 32px; border-radius: 8px; background: var(--ativo); font-size: 13px; }
.opcao button:hover { background: #39424A; }
.total { font-size: 14px; } .total b { font-family: var(--mono); }
.opcao.ruim { opacity: 0.6; }
.opcao .selo { align-self: flex-start; }
.opcoes .acoes-op { grid-column: 1 / -1; }
.opcoes .acoes-op button, .catalogo .links button { color: var(--cobre); font-size: 13px; min-height: 36px; }
.opcoes.grande { border-top: 0; padding-top: 0; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
/* processo com o cérebro (ESP32): a estrela dos blocos, as contas do pino, o que vai junto, os pendentes e o Montar */
.estrela { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 150px) minmax(0, 1fr); column-gap: 40px; grid-auto-rows: 1fr; }
.estrela .raios { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.estrela .raios line { stroke: var(--borda2); stroke-width: 2; vector-effect: non-scaling-stroke; }
.estrela .bloco { position: relative; margin: 5px 0; }
.estrela .centro { grid-column: 2; grid-row: 1 / -1; align-self: center; align-items: center; text-align: center; border-color: #5A4527; }
.estrela .caminho-ramo { font-family: var(--mono); font-size: 11.5px; color: #C8CDD2; line-height: 1.5; overflow-wrap: anywhere; }
.estrela .caminho-ramo.falta { color: var(--cobre); }
@media (max-width: 640px) {
  .estrela { grid-template-columns: 1fr; grid-auto-rows: auto; }
  .estrela .raios { display: none; }
  .estrela > .bloco { grid-column: 1 !important; grid-row: auto !important; }
}
.por-led li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; color: #C8CDD2; line-height: 1.45; }
.por-led .mono { color: var(--sec); min-width: 34px; }
.por-led .nao-bate { color: var(--cobre); font-weight: 600; } .por-led .bate { color: var(--ok); }
.bolinha { width: 10px; height: 10px; flex: none; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,0.3); }
.faixa-ma { font-family: var(--mono); font-weight: 600; } .faixa-ma.ok { color: var(--ok); } .faixa-ma.passa { color: var(--erro); }
.a-conferir { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: 13px; color: #C8CDD2; line-height: 1.45; }
.selo.pend { color: var(--cobre); border-color: #5A4527; }
.fontes summary { cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--sec); min-height: 24px; }
.fontes ul { margin-top: 6px !important; } .fontes li { font-family: var(--mono); font-size: 11.5px; color: var(--sec); line-height: 1.5; overflow-wrap: anywhere; }
.rolo { max-width: 100%; overflow-x: auto; align-self: flex-start; }   /* a tabelinha do LDR, na tela estreita, rola sozinha */
table.lux { border-collapse: collapse; font-family: var(--mono); font-size: 12px; margin: 4px 0; }

<body>

    <button type="button" class="pilula" id="status" data-aba="testes"></button>
    <button type="button" class="pilula" id="relogio" aria-expanded="false">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span id="versao-label">v?</span>
    </button>
  </div>

<main id="main"></main>

<script>
// a bancada so le os arquivos que os scripts escrevem e desenha; nada aqui decide nada
// sem ?placa= abre a tela de projetos; com ela, a bancada daquela placa
const PLACA = new URLSearchParams(location.search).get('placa');
const PECAS = !PLACA && ['pecas', 'catalogo'].some(k => new URLSearchParams(location.search).has(k));
const BASE = `../placas/${encodeURIComponent(PLACA)}/`;

const S = {
  aba: 'processo', detalhado: false,
  ligado: false,         // circuito ligado no papel (aba Projeto)
  ajustes: novosAjustes(),   // o que o painel mudou
  api: false,            // true quando a pagina vem do app.py (da pra rodar os testes daqui)
  cotacao: null,         // fabrica.json: o que aconteceu no site da fabrica
  projeto: null,         // /api/projeto: objetivo, perguntas, blocos e carrinho (passos 1 a 3)
  opcoes: {},            // ref -> {carregando, erro, itens, busca}: o "Trocar" do carrinho
  mexendo: false,        // um pedido de escolher/responder em andamento
  recado: '',            // o que acabou de acontecer (ou deu errado) no carrinho
  modelo: null, testes: null, versoes: [],
  brutos: {},            // ultimo texto lido de cada arquivo, pra saber se mudou
  modelosVersao: {},     // v -> modelo daquela versao (versoes/vN.json)
  ver: null,             // versao escolhida no relogio; null = atual
  destacar: false,
  sel: null,             // {k:'peca'|'pino'|'trilha'|'furo', ...}
  modo: 'seta', zoom: 1, cx: null, cy: null, arrastando: null,
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mm = (v, casas = 2) => Number(v).toFixed(casas).replace('.', ',');
const $ = sel => document.querySelector(sel);

// ---------- leitura dos arquivos (polling de 1 s) ----------
// o fabrica.json so existe depois da cotacao: sem ele, pergunta de novo a cada 20 s (cada 404 vira erro no console)
const FALTA_ATE = {}, DEVAGAR = { 'fabrica.json': 20000 };
async function ler(caminho) {
  const url = BASE + caminho;
  if (FALTA_ATE[url] > Date.now()) return null;
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (r.status === 404 && DEVAGAR[caminho]) FALTA_ATE[url] = Date.now() + DEVAGAR[caminho];
    return r.ok ? await r.text() : null;
  } catch { return null; }
}

async function lerJson(caminho, chave) {
  const txt = await ler(caminho);
  if (txt === null || txt === S.brutos[chave]) return false;
  try {
    const dado = JSON.parse(txt);
    S.brutos[chave] = txt;
    return dado;
  } catch { return false; }   // arquivo pela metade: tenta no proximo ciclo
}

async function lerProjeto() {
  if (!S.api) return false;
  try {
    const r = await fetch(`/api/projeto?placa=${encodeURIComponent(PLACA)}`, { cache: 'no-store' });
    const txt = r.ok ? await r.text() : 'null';
    if (txt === S.brutos.projeto) return false;
    S.brutos.projeto = txt;
    return JSON.parse(txt);
  } catch { return false; }
}

async function atualizar() {
  const [modelo, testes, versoes, cotacao, projeto] = await Promise.all([
    lerJson('saida/modelo.json', 'modelo'), lerJson('testes.json', 'testes'), lerJson('versoes/versoes.json', 'versoes'),
    lerJson('fabrica.json', 'cotacao'), lerProjeto(),
  ]);
  if (projeto !== false) S.projeto = projeto;
  if (modelo) S.modelo = modelo;
  if (testes) {
    // os requisitos so sao gravados no fim da rodada; enquanto roda, fica o objetivo da rodada anterior
    if (testes.rodando && !testes.objetivo && S.testes?.objetivo) testes.objetivo = S.testes.objetivo;
    S.testes = testes;
  }
  if (versoes) S.versoes = versoes;
  if (cotacao) S.cotacao = cotacao;
  if (modelo || testes || versoes || cotacao || projeto !== false) desenhar();
}

async function modeloDaVersao(v) {
  if (!S.modelosVersao[v]) {
    const txt = await ler(`versoes/v${v}.json`);
    if (txt) S.modelosVersao[v] = JSON.parse(txt);
  }
  return S.modelosVersao[v];
}

function versaoAtual() { return S.modelo?.versao ?? S.versoes.at(-1)?.v ?? null; }

function modeloVisto() {
  if (S.ver && S.ver !== versaoAtual()) return S.modelosVersao[S.ver] || null;
  return S.modelo;
}

// ---------- consultas no modelo ----------
function pinoDe(m, nome) {
  const [ref, n] = nome.split('.');
  return m.pecas.find(p => p.ref === ref)?.pinos.find(p => p.n === n);
}

function pinosDaNet(m, net) {
  const lista = [];
  for (const p of m.pecas) for (const pino of p.pinos) if (net && pino.net === net) lista.push(`${p.ref}.${pino.n}`);
  return lista;
}

// "D1.1" vira "D1 +", "SW1.3" vira "SW1 B"; sem nome na biblioteca, fica o numero
function nomePino(m, nome) {
  const pino = pinoDe(m, nome);
  return pino?.nome ? `${nome.split('.')[0]} ${pino.nome}` : nome;
}

// troca todo REF.N de um texto pelo nome de gente
function traduz(m, texto) {
  if (!m) return texto;
  return String(texto).replace(/\b([A-Za-z_]\w*)\.(\w+)\b/g, (s, ref, n) => nomePino(m, `${ref}.${n}`));
}

// ---------- liga o circuito no papel (o mesmo modelo de ferramenta/circuito.py; mudou la, muda aqui) ----------
const GMIN = 1e-9, R_CHAVE = 1e-3, R_PILHA = 1e-3;   // R_PILHA so quando a pilha nao tem r_interna (conta fecha com duas em paralelo)
const E24 = [10, 11, 12, 13, 15, 16, 18, 20, 22, 24, 27, 30, 33, 36, 39, 43, 47, 51, 56, 62, 68, 75, 82, 91];
const OHMS = [1, 10, 100, 1000].flatMap(d => E24.map(v => v * d));   // 10 Ω a 91 kΩ
const joelho = e => e.vf - e.r_s * e.i_teste;   // onde o LED comeca a conduzir
const polos = e => [e.mais ?? '1', e.menos ?? '2'];   // + e − do LED (peca da loja diz; senao 1 e 2)
const rPilha = e => e.r_interna || R_PILHA;
const positivo = x => typeof x === 'number' && x > 0;
const mostra = x => (typeof x === 'string' ? `'${x}'` : String(x));   // o valor na frase de erro, como o repr do Python
// o nome de gente de cada numero da eletrica, pras frases de pendente (mesmo texto do circuito.py)
const NOME_DO_CAMPO = { vdd: 'a tensão do 3V3', r_3v3: 'a resistência do 3V3', r_pino: 'a resistência do pino',
  r_pull: 'o pull-up de dentro', r_escuro: 'a resistência no escuro',
  r10_min: 'a resistência mínima em 10 lux', r10_max: 'a resistência máxima em 10 lux',
  gama: 'quanto a resistência cai com a luz (gama)' };
function daEletrica(e, campo, quem) {   // numero da eletrica que a conta precisa; pendente (sem numero) recusa, em vez de inventar um
  if (!positivo(e[campo])) throw new Error(`${quem}: falta conferir ${NOME_DO_CAMPO[campo]} no datasheet`);
  return e[campo];
}

// LDR: R(lux) = r10 · (lux / 10)^(−gama), limitado no r_escuro (mesma conta do circuito.py: ohms_do_ldr)
const LUX_PADRAO = 10;   // sem ajuste, o LDR fica em 10 lux, o ponto da tabela do datasheet (r10)
// canto ou lux que nao existem recusam sempre, ate no escuro (lux de um <input> e texto: converta antes)
function ohmsDoLdr(e, lux, canto = 'meio', quem = 'LDR') {
  if (!['meio', 'min', 'max'].includes(canto)) throw new Error(`canto ${mostra(canto)} não existe ('meio', 'min' ou 'max')`);
  if (lux != null && !(typeof lux === 'number' && lux >= 0))
    throw new Error(`${quem}: ${mostra(lux)} lux não existe (a luz é um número de 0 pra cima; 0 é o escuro)`);
  const escuro = daEletrica(e, 'r_escuro', quem);
  if (!lux) return escuro;
  const g = daEletrica(e, 'gama', quem), tol = e.gama_tol || 0;
  const r10Min = daEletrica(e, 'r10_min', quem), r10Max = daEletrica(e, 'r10_max', quem);
  let r;
  if (canto === 'meio') r = (r10Min * r10Max) ** 0.5 * (lux / 10) ** -g;
  else if (canto === 'min') r = Math.min(r10Min * (lux / 10) ** -(g - tol), r10Min * (lux / 10) ** -(g + tol));
  else r = Math.max(r10Max * (lux / 10) ** -(g - tol), r10Max * (lux / 10) ** -(g + tol));
  return Math.min(r, escuro);
}
// volts no pino do divisor vdd → r_fixo → pino → LDR → GND (no escuro, a tensao sobe)
function divisorDoLdr(e, rFixo, vdd, lux, canto = 'meio', quem = 'LDR') {
  const r = ohmsDoLdr(e, lux, canto, quem);
  return vdd * r / (rFixo + r);
}

// o ESP32 vira pilhas de mentira (mesma conta do circuito.py: com_pinos): ~terra, ~3V3 e um ~GPIOn por pino
// estado: { GPIO32: 1 | 0 | 'pullup' | null }, so GPIOn (true e false valem 1 e 0); vdd null = o da eletrica; o VIN nao entra;
// numero pendente recusa com frase de gente (vdd; r_3v3 com o 3V3 ligado; r_pino e r_pull quando o estado pede); sem mcu, devolve m
const fonteDePino = (ref, mais, menos, v, r) => ({ ref, eletrica: { modelo: 'pilha', mais: '1', menos: '2', v, r_interna: r },
  pinos: [{ n: '1', net: mais }, { n: '2', net: menos }] });
function comPinos(m, estado, vdd = null) {
  const mcu = m.pecas.find(p => p.eletrica?.modelo === 'mcu');
  if (!mcu) return m;
  const e = mcu.eletrica, ref = mcu.ref, net = {};
  vdd = vdd ?? daEletrica(e, 'vdd', ref);
  if (!positivo(vdd)) throw new Error(`${ref}: ${mostra(vdd)} não serve como tensão do 3V3 (é um número em volts)`);
  for (const q of mcu.pinos) if (q.net && q.nome) net[q.nome] = q.net;
  const gnd = mcu.pinos.filter(q => q.net && q.nome === 'GND').map(q => q.net).sort()[0] ?? 'GND';
  const virt = [fonteDePino('~terra', gnd, gnd, 0, 1e9)];
  if (Object.hasOwn(net, '3V3')) virt.push(fonteDePino('~3V3', net['3V3'], gnd, vdd, daEletrica(e, 'r_3v3', ref)));
  for (const [nome, nivel] of Object.entries(estado)) {
    if (!/^GPIO[0-9]+$/.test(nome)) throw new Error(`${nome}: só pino GPIO entra no estado (o 3V3 e o GND entram sozinhos; o VIN não é modelado)`);
    let volts, ohms;
    if (nivel === 'pullup') [volts, ohms] = [vdd, daEletrica(e, 'r_pull', ref)];
    else if ([0, 1, true, false].includes(nivel)) [volts, ohms] = [vdd * nivel, daEletrica(e, 'r_pino', ref)];
    else if (nivel == null) continue;
    else throw new Error(`${nome}: o estado ${mostra(nivel)} não existe (o pino fica em 1, 0, 'pullup' ou solto)`);
    if (Object.hasOwn(net, nome)) virt.push(fonteDePino('~' + nome, net[nome], gnd, volts, ohms));
  }
  return { ...m, pecas: [...virt, ...m.pecas] };
}

// parte do brilho do anuncio que essa corrente da, pela curva do datasheet (mesma conta de blocos.py)
function brilhoDaCorrente(e, i) {
  const pts = e?.brilho;
  if (!pts?.length) return null;
  if (i <= pts[0][0]) return 0;
  for (let k = 1; k < pts.length; k++) {
    const [i0, b0] = pts[k - 1], [i1, b1] = pts[k];
    if (i <= i1) return b0 + (b1 - b0) * (i - i0) / (i1 - i0);
  }
  return pts.at(-1)[1];
}

function resolverLinear(A, b) {
  const n = b.length, M = A.map((l, i) => [...l, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let i = c + 1; i < n; i++) if (Math.abs(M[i][c]) > Math.abs(M[p][c])) p = i;
    [M[c], M[p]] = [M[p], M[c]];
    if (Math.abs(M[c][c]) < 1e-18) return null;
    for (let i = 0; i < n; i++) {
      if (i === c || !M[i][c]) continue;
      const f = M[i][c] / M[c][c];
      for (let j = 0; j <= n; j++) M[i][j] -= f * M[c][j];   // a linha inteira, como o Python: o mesmo número até o último bit
    }
  }
  return M.map((l, i) => l[n] / l[i]);
}

// por que nao da pra ligar esta placa no papel (null = da). Placa com ESP32 (mcu) tambem da, crua ou ja com comPinos:
// aqui so confere que o comPinos aceita a eletrica do chip. Quem liga e o simular(comPinos(m, estado), aj)
function motivoSemSimulacao(m) {
  const s = m.simulacao;
  if (!s) return 'placa antiga, gere de novo';
  const pend = new Set(m.pecas.filter(p => p.pendente?.length).map(p => p.ref));
  const partes = [...(s.falta_modelo || []).map(r => pend.has(r) ? `falta conferir o datasheet de ${r}` : `${r} sem modelo elétrico`), ...(s.sem_valor || []).map(r => `${r} sem valor em ohms`),
    ...(s.soltos || []).map(r => `${r} ainda não está ligado`)];
  if (partes.length) return partes.join(', ');
  if (m.pecas.some(p => p.eletrica?.modelo === 'pilha')) return null;
  const mcu = m.pecas.find(p => p.eletrica?.modelo === 'mcu');
  if (!mcu) return 'sem pilha nem ESP32 na placa, nada pra ligar';
  const gpios = mcu.pinos.filter(q => q.net && /^GPIO[0-9]+$/.test(q.nome ?? '')).map(q => q.nome);
  try {   // os numeros que o painel vai pedir: o 3V3, cada GPIO ligado em 1 (r_pino) e com o pull-up (r_pull)
    for (const nivel of [1, 'pullup']) comPinos(m, Object.fromEntries(gpios.map(g => [g, nivel])));
  } catch (err) { return err.message; }
  return null;
}

function simular(m, aj) {   // com ESP32: simular(comPinos(m, estado), aj)
  aj = { pilha: {}, resistor: {}, chave: {}, ldr: {}, piezo: {}, ...aj };
  const pecas = m.pecas.filter(p => p.eletrica);
  const netDe = {};
  for (const p of m.pecas) for (const q of p.pinos) netDe[`${p.ref}.${q.n}`] = q.net;
  const net = (ref, n) => netDe[`${ref}.${n}`];
  const pilhas = pecas.filter(p => p.eletrica.modelo === 'pilha');
  if (!pilhas.length) return null;
  const terra = net(pilhas[0].ref, pilhas[0].eletrica.menos);
  const nets = [...new Set(Object.values(netDe).filter(n => n && n !== terra))].sort();
  const idx = Object.fromEntries(nets.map((n, i) => [n, i]));
  const tensao = (v, a, b) => (a == null || b == null ? null : v[a] - v[b]);
  const ohms = p => {   // resistor ou LDR
    if (p.eletrica.modelo === 'resistor') return aj.resistor[p.ref] ?? p.valor;
    const o = aj.ldr[p.ref];
    if (o == null) return ohmsDoLdr(p.eletrica, LUX_PADRAO, 'meio', p.ref);
    if (!positivo(o)) throw new Error(`${p.ref}: LDR com ${mostra(o)} Ω não existe (o ajuste do LDR é em ohms, maior que 0)`);
    return o;
  };
  const acesos = Object.fromEntries(pecas.filter(p => p.eletrica.modelo === 'led').map(p => [p.ref, true]));
  let v = {};
  for (let volta = 0; volta < 30; volta++) {
    const N = nets.length;
    const A = Array.from({ length: N }, () => new Array(N).fill(0)), b = new Array(N).fill(0);
    for (let i = 0; i < N; i++) A[i][i] += GMIN;
    const cond = (na, nb, g) => {
      if (na == null || nb == null) return;   // pino sem net: aberto
      for (const [x, outro] of [[na, nb], [nb, na]]) {
        if (x === terra) continue;
        A[idx[x]][idx[x]] += g;
        if (outro !== terra) A[idx[x]][idx[outro]] -= g;
      }
    };
    const fonte = (na, nb, volts, r) => {   // fonte de tensao com r em serie, + em na: Norton
      if (na == null || nb == null) return;
      const g = 1 / r;
      cond(na, nb, g);
      if (na !== terra) b[idx[na]] += g * volts;
      if (nb !== terra) b[idx[nb]] -= g * volts;
    };
    for (const p of pecas) {
      const e = p.eletrica;
      if (e.modelo === 'resistor' || e.modelo === 'ldr') cond(net(p.ref, '1'), net(p.ref, '2'), 1 / ohms(p));
      else if (e.modelo === 'chave' && aj.chave[p.ref]) cond(net(p.ref, e.lados[0][0]), net(p.ref, e.lados[1][0]), 1 / R_CHAVE);
      else if (e.modelo === 'piezo' && aj.piezo[p.ref]) cond(net(p.ref, '1'), net(p.ref, '2'), 1 / R_CHAVE);
      else if (e.modelo === 'pilha') fonte(net(p.ref, e.mais), net(p.ref, e.menos), aj.pilha[p.ref] ?? e.v, rPilha(e));
      else if (e.modelo === 'led' && acesos[p.ref]) fonte(net(p.ref, polos(e)[0]), net(p.ref, polos(e)[1]), joelho(e), e.r_s);
    }
    const x = resolverLinear(A, b);
    if (!x) return null;
    v = Object.fromEntries(nets.map(n => [n, x[idx[n]]]));
    v[terra] = 0;
    let mudou = false;   // LED aceso puxando pra tras apaga; apagado com tensao acima do joelho acende
    for (const p of pecas) {
      if (p.eletrica.modelo !== 'led') continue;
      const vab = tensao(v, net(p.ref, polos(p.eletrica)[0]), net(p.ref, polos(p.eletrica)[1])), j = joelho(p.eletrica);
      if (vab === null) acesos[p.ref] = false;
      else if (acesos[p.ref] && vab < j - 1e-9) { acesos[p.ref] = false; mudou = true; }
      else if (!acesos[p.ref] && vab > j + 1e-9) { acesos[p.ref] = true; mudou = true; }
    }
    if (!mudou) break;
  }
  const saida = {}, entra = {};   // entra: corrente que entra na peca por cada pino
  for (const p of pecas) {
    const e = p.eletrica, ref = p.ref;
    if (e.modelo === 'resistor' || e.modelo === 'ldr') {
      const r = ohms(p), vab = tensao(v, net(ref, '1'), net(ref, '2')), i = vab === null ? 0 : vab / r;
      saida[ref] = { i, p: i * i * r, ohms: r }; entra[`${ref}.1`] = i; entra[`${ref}.2`] = -i;
    } else if (e.modelo === 'led') {
      const [mais, menos] = polos(e), vab = tensao(v, net(ref, mais), net(ref, menos));
      const i = acesos[ref] && vab !== null ? Math.max((vab - joelho(e)) / e.r_s, 0) : 0;
      saida[ref] = { i, v: i > 0 ? joelho(e) + e.r_s * i : (vab ?? 0), acende: i >= 0.001, forte: i > (e.i_teste + e.i_max) / 2, queima: i > e.i_max };
      entra[`${ref}.${mais}`] = i; entra[`${ref}.${menos}`] = -i;
    } else if (e.modelo === 'pilha') {
      const volts = aj.pilha[ref] ?? e.v, vab = tensao(v, net(ref, e.mais), net(ref, e.menos));
      const i = vab === null ? 0 : (volts - vab) / rPilha(e);   // corrente que sai do +
      saida[ref] = { i, v: volts }; entra[`${ref}.${e.mais}`] = -i; entra[`${ref}.${e.menos}`] = i;
    } else if (e.modelo === 'chave') {
      const ap = !!aj.chave[ref], vab = tensao(v, net(ref, e.lados[0][0]), net(ref, e.lados[1][0]));
      const i = ap && vab !== null ? vab / R_CHAVE : 0;
      saida[ref] = { i, apertada: ap };
      for (const n of e.lados[0]) entra[`${ref}.${n}`] = i;
      for (const n of e.lados[1]) entra[`${ref}.${n}`] = -i;
    } else if (e.modelo === 'piezo') {   // aberto; ajustado como fio, e a borda do apito
      const fio = !!aj.piezo[ref], vab = tensao(v, net(ref, '1'), net(ref, '2'));
      const i = fio && vab !== null ? vab / R_CHAVE : 0;
      saida[ref] = { i, fio }; entra[`${ref}.1`] = i; entra[`${ref}.2`] = -i;
    } else if (e.modelo === 'capacitor') {   // aberto em corrente continua
      saida[ref] = { i: 0 }; entra[`${ref}.1`] = 0; entra[`${ref}.2`] = 0;
    }
  }
  return { nets: v, pecas: saida, entra };
}

const mA = a => (Math.abs(a) >= 0.0095 ? (a * 1000).toFixed(0) : (a * 1000).toFixed(1).replace('.', ','));
const mW = w => (w * 1000).toFixed(0);
const volts = v => v.toFixed(1).replace('.', ',');
const ohmsTxt = o => (o >= 1000 ? `${(o / 1000).toString().replace('.', ',')} kΩ` : `${o} Ω`);

function estadoLed(r) { return r.queima ? 'queima' : r.forte ? 'forte' : r.acende ? 'aceso' : 'apagado'; }
const TEXTO_LED = { queima: 'QUEIMA', forte: 'aceso forte', aceso: 'aceso', apagado: 'apagado' };

// o que mudou da versao anterior pra esta (pra "destacar o que mudou")
function novidades(m, ant) {
  const novos = new Set();
  if (!ant) return novos;
  for (const p of m.pecas) {
    const a = ant.pecas.find(q => q.ref === p.ref);
    if (!a || a.tipo !== p.tipo || a.x !== p.x || a.y !== p.y) novos.add('peca:' + p.ref);
  }
  m.trilhas.forEach((t, i) => {
    if (!ant.trilhas.some(a => a.de === t.de && a.ate === t.ate)) novos.add('trilha:' + i);
  });
  return novos;
}

// ---------- desenho da placa em SVG ----------
// o: {sel, novos:Set, erros:{ref:texto}, avisos:{ref:texto} (etiqueta amarela), interativo, sim (circuito ligado), ajustes}
function placaSVG(m, o = {}) {
  const W = m.placa.w, H = m.placa.h, Y = y => H - y;   // origem do txt e embaixo; a do SVG, em cima
  const fonte = Math.max(1.2, Math.min(2.2, Math.min(W, H) / 22));
  const alvo = a => o.interativo ? ` data-alvo="${esc(a)}"` : '';

  // foco: ao escolher pino/trilha/peca, apaga o que nao e da mesma net
  let nets = null, refs = null;
  if (o.sel?.k === 'pino') { nets = new Set([pinoDe(m, o.sel.nome)?.net || o.sel.nome]); refs = new Set(); }
  if (o.sel?.k === 'trilha') { nets = new Set([m.trilhas[o.sel.i]?.net]); refs = new Set(); }
  if (o.sel?.k === 'peca') {
    const p = m.pecas.find(q => q.ref === o.sel.ref);
    nets = new Set(p?.pinos.map(x => x.net).filter(Boolean)); refs = new Set([o.sel.ref]);
  }
  const apaga = (net, ref) => nets && !(refs.has(ref) || (net && nets.has(net))) ? ' apagado' : '';
  const pinoApagado = (p, pino) => {
    if (!nets) return '';
    if (o.sel.k === 'pino') return o.sel.nome === `${p.ref}.${pino.n}` || (pino.net && nets.has(pino.net)) ? '' : ' apagado';
    return apaga(pino.net, p.ref);
  };

  let s = `<rect class="placa-fundo${nets ? ' apagado' : ''}" x="0" y="0" width="${W}" height="${H}" rx="0.6"${alvo('placa')}/>`;
  m.furos.forEach((f, i) => {
    s += `<circle class="furo${nets ? ' apagado' : ''}" cx="${f.x}" cy="${Y(f.y)}" r="${f.d / 2}"${alvo('furo:' + i)}/>`;
  });
  if (o.sim) {   // brilho dos LEDs acesos, por baixo de tudo
    s += '<defs><filter id="borrao" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.9"/></filter></defs>';
    for (const p of m.pecas) {
      const r = o.sim.pecas[p.ref];
      if (!r || p.eletrica?.modelo !== 'led' || !r.acende) continue;
      const forca = Math.min(1, r.i / p.eletrica.i_teste), cor = COR_DE_TELA[p.eletrica.cor];   // a cor do LED, da eletrica dele
      s += `<circle class="brilho" cx="${p.x}" cy="${Y(p.y)}" r="${p.corpo.w / 2 + 1.5 + forca * 1.5}" opacity="${(0.25 + 0.5 * forca).toFixed(2)}"${cor ? ` style="fill:${cor}"` : ''} filter="url(#borrao)"/>`;
    }
  }
  for (const p of m.pecas) {
    const c = p.corpo, x = p.x - c.w / 2, y = Y(p.y) - c.h / 2;
    const raio = c.redondo ? Math.min(c.w, c.h) / 2 : 0.4;
    const apertado = o.sim && p.eletrica?.modelo === 'chave' && o.ajustes?.chave[p.ref] ? ' apertado' : '';
    const loja = p.desenho?.length ? ' da-loja' : '';   // peca da loja: o retangulo so pega o clique; o desenho e o oficial
    s += `<rect class="corpo${p.pinos.length > 8 ? ' modulo' : ''}${loja}${apaga(null, p.ref)}${apertado}" x="${x}" y="${y}" width="${c.w}" height="${c.h}" rx="${raio}"${alvo('peca:' + p.ref)}/>`;
    for (const traco of p.desenho || []) {
      s += `<polyline class="silk${apaga(null, p.ref)}" points="${traco.map(([dx, dy]) => `${(p.x + dx).toFixed(3)},${Y(p.y + dy).toFixed(3)}`).join(' ')}"/>`;
    }
  }
  const ordem = m.trilhas.map((t, i) => [t, i]).sort((a, b) => (a[0].lado === 'baixo' ? 0 : 1) - (b[0].lado === 'baixo' ? 0 : 1));   // as de baixo primeiro
  ordem.forEach(([t, i]) => {
    s += `<line class="trilha${t.lado === 'baixo' ? ' baixo' : ''}${apaga(t.net, null)}" x1="${t.x1}" y1="${Y(t.y1)}" x2="${t.x2}" y2="${Y(t.y2)}" stroke-width="${t.largura}"${alvo('trilha:' + i)}/>`;
    const i_t = o.sim ? correnteNaTrilha(m, o.sim, t) : 0;
    if (Math.abs(i_t) > 1e-6) {   // bolinhas andando no sentido da corrente, mais rapido com mais corrente
      const dur = Math.min(3, Math.max(0.2, 15 / (Math.abs(i_t) * 1000)));
      s += `<line class="fluxo" x1="${t.x1}" y1="${Y(t.y1)}" x2="${t.x2}" y2="${Y(t.y2)}" stroke-width="${t.largura * 0.55}" style="--dur:${dur.toFixed(2)}s;animation-direction:${i_t > 0 ? 'normal' : 'reverse'}"/>`;
    }
  });
  for (const v of m.vias || []) {
    s += `<circle class="via${apaga(v.net, null)}" cx="${v.x}" cy="${Y(v.y)}" r="${v.d / 2}"/><circle class="broca${apaga(v.net, null)}" cx="${v.x}" cy="${Y(v.y)}" r="${v.furo / 2}"/>`;
  }
  for (const p of m.pecas) {
    for (const pino of p.pinos) {
      const a = alvo(`pino:${p.ref}.${pino.n}`), cl = `pad${pinoApagado(p, pino)}`;
      if (pino.pad.forma === 'C') s += `<circle class="${cl}" cx="${pino.x}" cy="${Y(pino.y)}" r="${pino.pad.d / 2}"${a}/>`;
      else s += `<rect class="${cl}" x="${pino.x - pino.pad.w / 2}" y="${Y(pino.y) - pino.pad.h / 2}" width="${pino.pad.w}" height="${pino.pad.h}" rx="0.15"${a}/>`;
      if (pino.furo) s += `<circle class="broca${pinoApagado(p, pino)}" cx="${pino.x}" cy="${Y(pino.y)}" r="${pino.furo / 2}"/>`;
    }
  }
  for (const p of m.pecas) {
    s += `<text class="ref${apaga(null, p.ref)}" x="${p.x}" y="${Y(p.y) - p.corpo.h / 2 - fonte * 0.45}" font-size="${fonte}" text-anchor="middle">${esc(p.ref)}</text>`;
  }

  // camadas por cima: selecao, novidades, erros
  const contorno = (ref, classe, folga) => {
    const p = m.pecas.find(q => q.ref === ref);
    if (!p) return '';
    const c = p.corpo, f = folga;
    const raio = c.redondo ? Math.min(c.w, c.h) / 2 + f : 0.8;
    return `<rect class="${classe}" x="${p.x - c.w / 2 - f}" y="${Y(p.y) - c.h / 2 - f}" width="${c.w + 2 * f}" height="${c.h + 2 * f}" rx="${raio}"/>`;
  };
  if (o.sel?.k === 'peca') s += contorno(o.sel.ref, 'sel', 0.6);
  if (o.sel?.k === 'pino') {
    const pino = pinoDe(m, o.sel.nome);
    if (pino) s += `<circle class="sel-pino" cx="${pino.x}" cy="${Y(pino.y)}" r="${(pino.pad.d ?? Math.max(pino.pad.w, pino.pad.h)) / 2 + 0.45}"/>`;
  }
  if (o.sim) {
    for (const p of m.pecas) {
      if (o.sim.pecas[p.ref]?.queima) { s += contorno(p.ref, 'erro', 1.2) + etiquetaAoLado(p, Y, W, 'queima!', fonte * 0.8, 'var(--erro)', '#2A0B08'); }
    }
  }
  // os erros (vermelho) e os avisos (amarelo) da aba Testes: contorno em cada peça e a etiqueta onde o rótulo veio ('' = só
  // o contorno); os erros escolhem o lugar primeiro, cada etiqueta num canto livre, e os erros ficam por cima
  const ocupado = [];
  const camada = (lista, classe, fundo, cor, pula = {}) => Object.entries(lista || {}).map(([ref, rotulo]) => {
    const p = m.pecas.find(q => q.ref === ref);
    if (!p || ref in pula) return '';
    return contorno(ref, classe, 1.2) + (rotulo ? etiquetaLivre(m, p, Y, rotulo, fonte * 0.8, fundo, cor, ocupado, fonte) : '');
  }).join('');
  const erros = camada(o.erros, 'erro', 'var(--erro)', '#2A0B08');
  s += camada(o.avisos, 'aviso-peca', 'var(--cobre)', '#2A1A05', o.erros || {}) + erros;
  for (const k of o.novos || []) {
    const [tipo, id] = k.split(':');
    if (tipo === 'peca') {
      s += contorno(id, 'novo', 1.0);
      const p = m.pecas.find(q => q.ref === id);
      s += etiquetaAoLado(p, Y, W, '+ novo', fonte * 0.8, 'var(--ok)', '#0E2A1A');
    } else {
      const t = m.trilhas[+id];
      s += `<line class="novo" x1="${t.x1}" y1="${Y(t.y1)}" x2="${t.x2}" y2="${Y(t.y2)}" stroke-width="${t.largura + 0.9}" stroke-opacity="0.8"/>`;
    }
  }
  return s;
}

// corrente andando pela trilha, de (x1,y1) pra (x2,y2), em A (positivo = do 'de' pro 'ate'); null = não dá pra saber.
// Cada ligação do placa.txt (os pedaços com o mesmo de, ate e linha) é um galho da net, e cada ponta é uma peça com a
// corrente que sai da net e entra nela por aquele pino (sim.entra). Cortando o galho, o que as peças do lado de lá puxam
// passa por ele (lei dos nós): assim o GND repartido (LED, LDR, botão) leva a soma certa em cada pedaço. O cérebro não
// tem 'entra' (as pilhas de mentira dele não são pinos da placa): ele fecha a conta do lado dele. Cérebro dos dois
// lados ou galho num laço (a corrente se divide) dão null
const correntesJaFeitas = new WeakMap();   // sim -> {m, porLiga}: o desenho pergunta trilha por trilha
const chaveDaLiga = t => `${t.de}|${t.ate}|${t.linha}`;
function correnteNaTrilha(m, sim, t) {
  let feito = correntesJaFeitas.get(sim);
  if (feito?.m !== m) correntesJaFeitas.set(sim, feito = { m, porLiga: correntesNasLigas(m, sim) });
  return feito.porLiga.get(chaveDaLiga(t)) ?? null;
}

function correntesNasLigas(m, sim) {
  // ponta = a peça naquela net (os pinos de um mesmo lado do botão e os GND do DevKit são uma ponta só)
  const ponta = nome => { const p = pinoDe(m, nome); return p?.net ? `${nome.split('.')[0]}@${p.net}` : `?${nome}`; };
  const puxa = {};   // ponta -> corrente que sai da net por ela (null = não se sabe: o cérebro)
  for (const p of m.pecas) {
    const lados = p.eletrica?.modelo === 'chave' ? p.eletrica.lados.map(l => l[0]) : p.pinos.map(q => q.n);   // o 'entra' do botão repete em cada pino do lado
    const sabe = lados.some(n => `${p.ref}.${n}` in sim.entra);
    for (const q of p.pinos) if (q.net) puxa[`${p.ref}@${q.net}`] = sabe ? 0 : null;
    if (sabe) for (const n of lados) { const net = p.pinos.find(q => q.n === n)?.net; if (net) puxa[`${p.ref}@${net}`] += sim.entra[`${p.ref}.${n}`] ?? 0; }
  }
  const ligas = new Map();   // chave -> [ponta de, ponta ate]
  for (const t of m.trilhas) ligas.set(chaveDaLiga(t), [ponta(t.de), ponta(t.ate)]);
  const lado = (de, sem) => {   // as pontas que o 'de' alcança sem passar pelo galho 'sem'
    const visto = new Set([de]), fila = [de];
    for (const x of fila) for (const [k, [a, b]] of ligas) {
      const outra = a === x ? b : b === x ? a : null;
      if (k !== sem && outra && !visto.has(outra)) { visto.add(outra); fila.push(outra); }
    }
    return visto;
  };
  const soma = pontas => [...pontas].reduce((s, x) => (s === null || puxa[x] == null ? null : s + puxa[x]), 0);
  const porLiga = new Map();
  for (const [k, [a, b]] of ligas) {
    const daqui = lado(a, k);
    if (a === b || daqui.has(b)) { porLiga.set(k, null); continue; }   // num laço a corrente se divide: sem número
    const sai = soma(daqui), chega = sai === null ? soma(lado(b, k)) : null;
    porLiga.set(k, sai !== null ? -sai : chega);
  }
  return porLiga;
}

function larguraEtiqueta(texto, fonte) { return texto.length * fonte * 0.62 + fonte * 1.2; }

// etiqueta no canto de cima da peca; vai pro lado esquerdo se nao couber na placa
function etiquetaAoLado(p, Y, W, texto, fonte, fundo, cor) {
  const w = larguraEtiqueta(texto, fonte), dir = p.x + p.corpo.w / 2 + 1.4;
  const x = dir + w <= W ? dir : p.x - p.corpo.w / 2 - 1.4 - w;
  return etiqueta(x, Y(p.y) - p.corpo.h / 2 - 0.4, texto, fonte, fundo, cor);
}

// a caixa de uma peça no desenho (o corpo e os pads), em coordenadas do SVG: [x0, y0, x1, y1]
function caixaDaPeca(p, Y) {
  const xs = [p.x - p.corpo.w / 2, p.x + p.corpo.w / 2], ys = [Y(p.y) - p.corpo.h / 2, Y(p.y) + p.corpo.h / 2];
  for (const q of p.pinos) {
    const [mw, mh] = q.pad.forma === 'C' ? [q.pad.d / 2, q.pad.d / 2] : [q.pad.w / 2, q.pad.h / 2];
    xs.push(q.x - mw, q.x + mw); ys.push(Y(q.y) - mh, Y(q.y) + mh);
  }
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
}

// a etiqueta perto da peça, no primeiro lugar que não cobre outra peça, o nome dela (R4, SW1) nem outra etiqueta (à
// direita, à esquerda, em cima ou embaixo); se nenhum está livre, o que cobre menos. ocupado ganha a caixa da posta.
// fonteRef: o tamanho do nome das peças no desenho
function etiquetaLivre(m, p, Y, texto, fonte, fundo, cor, ocupado, fonteRef) {
  const w = larguraEtiqueta(texto, fonte), h = fonte * 1.6, [x0, y0, x1, y1] = caixaDaPeca(p, Y), topo = Y(p.y) - p.corpo.h / 2 - 0.4;
  const nome = q => { const yb = Y(q.y) - q.corpo.h / 2 - fonteRef * 0.45, l = q.ref.length * fonteRef * 0.62; return [q.x - l / 2, yb - fonteRef, q.x + l / 2, yb + fonteRef * 0.2]; };
  const lugares = [[x1 + 1.4, topo], [x0 - 1.4 - w, topo], [p.x - w / 2, Math.min(y0, nome(p)[1]) - 0.4 - h / 2], [p.x - w / 2, y1 + 0.8 + h / 2]];
  const outras = [...m.pecas.filter(q => q !== p).flatMap(q => [caixaDaPeca(q, Y), nome(q)]), nome(p), ...ocupado];
  const cobre = ([x, y]) => outras.reduce((soma, [a, b, c, d]) => soma + Math.max(0, Math.min(x + w, c) - Math.max(x, a)) * Math.max(0, Math.min(y + h / 2, d) - Math.max(y - h / 2, b)), 0)
    + (x < -3 || x + w > m.placa.w + 3 || y - h / 2 < -3 || y + h / 2 > m.placa.h + 3 ? 1e6 : 0);   // fora do desenho: só se não tiver jeito
  const [x, y] = lugares.reduce((melhor, l) => (cobre(l) < cobre(melhor) ? l : melhor));
  ocupado.push([x, y - h / 2, x + w, y + h / 2]);
  return etiqueta(x, y, texto, fonte, fundo, cor);
}

function etiqueta(x, y, texto, fonte, fundo, cor) {
  const w = larguraEtiqueta(texto, fonte), h = fonte * 1.6;
  return `<g class="etiqueta"><rect x="${x}" y="${y - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${fundo}"/>` +
    `<text x="${x + w / 2}" y="${y + fonte * 0.35}" font-size="${fonte}" text-anchor="middle" fill="${cor}">${esc(texto)}</text></g>`;
}
