async function acaoCatalogo(caminho, corpo, durante) {
  C.ocupado = true; C.recado = durante; desenharCatalogo();
  const d = await postar(caminho, corpo);
  C.recado = d.erro ? d.erro : caminho.endsWith('checar')
    ? `Conferi ${d.conferidas} na loja agora${d.mudaram.length ? `: ${d.mudaram.length} mudaram de preço, estoque ou situação` : ', nada mudou'}.${d.ficaram ? ` ${d.ficaram} de lojas brasileiras ficaram pra depois (elas pedem 10 s entre páginas).` : ''}`
    : `A loja achou ${d.achadas} que servem; ${d.novas} eram novas e entraram no catálogo.`;
  await carregarCatalogo();
  C.ocupado = false; desenharCatalogo();
}

// as ligações (as linhas 'liga' do placa.txt) e os pedaços de trilha que o desenho fez pra elas: a etapa 3 conta os
// pedaços, então o número dela é o segundo
function ligacoesTxt(m) {
  const ligas = new Set(m.trilhas.map(t => `${t.de}>${t.ate}`)).size, pedacos = m.trilhas.length;
  return `${ligas} ${ligas === 1 ? 'ligação' : 'ligações'}${pedacos !== ligas ? ` (${pedacos} pedaços de trilha)` : ''}`;
}

// ---------- aba Processo: a historia do projeto, na ordem em que a gente pensa ----------
// objetivo (o que quer) -> blocos (o tipo de cada peca) -> carrinho (pecas de verdade) -> placa -> testes -> fabrica -> montar
function passo(n, estado, titulo, corpo) {
  return `<li class="passo ${estado}"><span class="marca" aria-hidden="true">${estado === 'ok' ? '✓' : n}</span>
    <div class="conteudo"><h3>${n}. ${titulo}</h3>${corpo}</div></li>`;
}

// simbolo de cada bloco, desenhado como no esquema eletrico
const ICONES = {
  pilha: '<path d="M2 12h12M14 4v16M20 8v8M20 12h18"/><path d="M6 6h4M8 4v4" stroke-width="1.4"/>',
  botao: '<path d="M2 17h9M29 17h9M11 9h18M20 9V3"/><circle cx="12" cy="17" r="1.6"/><circle cx="28" cy="17" r="1.6"/>',
  resistor: '<path d="M2 12h8M30 12h8"/><rect x="10" y="7" width="20" height="10" rx="1"/>',
  led: '<path d="M2 13h10M26 13h12M12 6l14 7-14 7z M26 6v14"/><path d="M24 4l5-4M28 6l5-4" stroke-width="1.4"/>',
  cerebro: '<rect x="12" y="3" width="16" height="18" rx="2"/><path d="M2 8h10M2 16h10M28 8h10M28 16h10"/><circle cx="16.5" cy="7.5" r="1" fill="currentColor"/>',   // o chip, com as pernas
  ldr: '<path d="M2 16h8M30 16h8"/><rect x="10" y="11" width="20" height="10" rx="1"/><path d="M11 1l5 6M18 1l5 6M16 7l-2.6-.3M16 7l-.3-2.6M23 7l-2.6-.3M23 7l-.3-2.6" stroke-width="1.4"/>',   // resistor com a luz entrando
  buzzer: '<path d="M2 12h11M27 12h11M13 5v14M27 5v14"/><rect x="16" y="7" width="8" height="10" rx="1"/>',   // o piezo: o cristal entre duas placas
  capacitor: '<path d="M2 12h16M22 12h16M18 4v16M22 4v16"/>',
};
const icone = b => `<svg viewBox="0 0 40 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONES[b] || ''}</svg>`;
const dolar = v => v == null ? '?' : `US$ ${v < 0.1 ? v.toFixed(4) : v.toFixed(2)}`.replace('.', ',');
const milhar = n => Number(n || 0).toLocaleString('pt-BR');
const FRACAO = { fraca: '¼ do', media: 'metade do', forte: 'o' };
const NOME_DO_BRILHO = { fraca: 'fraca', media: 'média', forte: 'forte' };

// ---- projeto com o cérebro (ESP32): o pino do DevKit faz o papel da pilha ----
const MICROPYTHON = '1.29';   // a versão que o gêmeo roda e a da página oficial (v1.29.0, 2026-08-24, micropython.org/download/ESP32_GENERIC)
// a solda da barra fêmea que vai junto com o DevKit, do desenho do fabricante (o mesmo número está no catálogo, em conferido.mecanica);
// só vale enquanto o /api/projeto não traz a 'mecanica' de cada barra
const SOLDA_DA_BARRA = {
  C41417327: { c: 260, s: 5, marca: 'hanxia', fonte: 'desenho hanxia HX PM2.54-1x15P ZC, p. 1' },
  C22373901: { c: 255, s: 5, marca: 'Hong Cheng', fonte: 'desenho Hong Cheng HC-PM254-8.5H-1x15PZ, p. 1' },
};
// a cor de cada LED na tela (o nome em português vem da 'cor' da eletrica e da pergunta 'cor')
const COR_DE_TELA = { vermelho: '#FF5A4E', 'laranja-avermelhado': '#FF6F3C', laranja: '#FF9A3C', amarelo: '#FFD34E', 'verde-amarelado': '#B8E04A',
  verde: '#46D17A', azul: '#5AA8FF', branco: '#F4F4F2', 'branco quente': '#FFE2B0' };
// o nome de gente de cada número do cérebro que as contas citam (as fontes vêm do /api/projeto)
const NOME_DA_FONTE = { vdd: '3V3', vdd_min: '3V3 mínimo', vdd_max: '3V3 máximo', r_pino: 'resistência do pino', i_pino: 'força padrão do pino',
  r_pull: 'pull-up de dentro', vil: 'tensão em que o pino lê 0 (VIL)', adc_min: 'começo da faixa boa do ADC', adc_max: 'fim da faixa boa do ADC',
  ponto_1lux: 'LDR em 1 lux, no gráfico', r_3v3: 'resistência do 3V3', i_soma_max: 'soma das correntes dos pinos',
  orcamento_3v3: 'o que sobra do 3V3 pras peças' };
const MOEDA = { BRL: 'R$', USD: 'US$' };
const quemDecidiu = q => q === 'Luiz' ? 'você escolheu' : q || 'ninguém decidiu ainda';
const porCento = x => `${Math.round(x * 100)}%`;
const comMaiuscula = t => t ? t[0].toUpperCase() + t.slice(1) : '';   // o aviso do /api/projeto começa em minúscula
const ohmsCurto = o => o >= 1e6 ? `${mm(o / 1e6, o % 1e6 ? 1 : 0)} MΩ` : ohmsTxt(o >= 1000 ? Math.round(o / 100) * 100 : Math.round(o));
const bolinha = cor => COR_DE_TELA[cor] ? `<span class="bolinha" style="background:${COR_DE_TELA[cor]}" aria-hidden="true"></span>` : '';
const comApelido = (b, ref) => b ? `${b.ref}${b.apelido ? ` (${b.apelido})` : ''}` : ref;
// o pino do cérebro de um bloco, como está escrito no DevKit: "GPIO32 (D32)"
const pinoDoBloco = b => !b?.pino ? 'o pino' : `${b.pino}${b.no_cerebro?.serigrafia && b.no_cerebro.serigrafia !== b.pino ? ` (${b.no_cerebro.serigrafia})` : ''}`;

// o que falta conferir: sempre à vista, com o assunto na frente e o detalhe em letra pequena
// (o assunto pode vir com nome de máquina, como 'r_3v3': vira o nome de gente)
function pendenteHTML(texto) {
  const i = texto.indexOf(': ');
  const [assunto, detalhe] = i > 0 ? [texto.slice(0, i), texto.slice(i + 2)] : [texto, ''];
  return `<span class="a-conferir"><span class="selo pend">pendente</span><span>${esc(NOME_DA_FONTE[assunto] || assunto)}</span>${detalhe ? `<span class="sub">${esc(detalhe)}</span>` : ''}</span>`;
}

// de onde vem cada número da conta (datasheet e página), fechado em letra pequena
function fontesHTML(fontes) {
  const linhas = Object.entries(fontes || {}).flatMap(([campo, lista]) => (Array.isArray(lista) ? lista : [lista])
    .map(f => `<li><b>${esc(NOME_DA_FONTE[campo] || campo)}</b>: ${esc(f)}</li>`));
  return linhas.length ? `<details class="fontes"><summary>De onde vêm os números</summary><ul>${linhas.join('')}</ul></details>` : '';
}

// o rodapé de toda conta com o cérebro: a faixa do 3V3, os pendentes e as fontes
const rodapeDaConta = c => `${c.condicao_3v3 ? `<span class="sub">3V3 de verdade: ${esc(c.condicao_3v3)}.</span>` : ''}
    ${(c.pendentes || []).map(pendenteHTML).join('')}${fontesHTML(c.fontes)}`;

// a linha do resistor do carrinho contra o da conta (igual à da lanterninha)
function bateHTML(c, peca, sugerido = c.padrao) {
  if (!peca || c.bate == null || !sugerido) return '';
  return c.bate ? '<span class="bate">✓ o resistor do carrinho é esse</span>'
    : `<span class="nao-bate">✗ o do carrinho é ${ohmsTxt(peca.valor)}: troque pelo de ${ohmsTxt(sugerido)}</span>`;
}
// o LED que passa da força do pino: o resistor desta conta reprova, então a linha nunca manda comprar ele
function reprovadoHTML(c, peca) {
  if (!peca || c.bate == null || !c.padrao) return '';
  return c.bate ? `<span class="nao-bate">✗ O do carrinho é ${ohmsTxt(peca.valor)}, o desta conta: troque depois de pedir menos luz.</span>`
    : `<span class="sub">O do carrinho é ${ohmsTxt(peca.valor)}. Não compre o de ${ohmsTxt(c.padrao)} desta conta: ele passa da força padrão do pino.</span>`;
}

// o LED no pino do cérebro: a conta do freio com o pino no lugar da pilha, a faixa de mA e a força padrão do pino
function contaDoLedHTML(c, peca, alvo) {
  const pedido = `Você pediu luz <b>${NOME_DO_BRILHO[c.resposta] || esc(c.resposta)}</b> pro ${esc(comApelido(alvo, c.led))}${c.resposta_do_led ? ', só pra ele' : ''}: ${FRACAO[c.resposta] || ''} brilho que o fabricante anuncia`;
  if (c.impossivel) return `<div class="conta"><span>${pedido}.</span><span class="nao-bate">✗ ${esc(comMaiuscula(c.aviso || 'impossível neste LED'))}.</span>${rodapeDaConta(c)}</div>`;
  const resto = c.r_s + c.r_pino, f = c.faixa || {};
  const ma = f.de != null && f.ate != null ? `de ${mA(f.de)} a ${mA(f.ate)} mA` : f.ate != null ? `até ${mA(f.ate)} mA` : f.de != null ? `a partir de ${mA(f.de)} mA` : `≈ ${mA(c.i_padrao)} mA`;
  const luz = f.brilho_de != null && f.brilho_ate != null ? `≈ ${porCento(f.brilho_de)} a ${porCento(f.brilho_ate)}` : `≈ ${porCento(c.brilho)}`;
  return `<div class="conta">
    <span>${pedido}. Pela curva do LED, isso é ≈ ${mA(c.i)} mA.</span>
    <span class="mono">(pino − LED) ÷ corrente = (${volts(c.v)} − ${mm(c.joelho)}) ÷ ${mA(c.i)} mA ≈ ${Math.round(c.ohms + resto)} Ω</span>
    <span>O LED e o pino já freiam ${mm(resto, 1)} Ω sozinhos (o pino do cérebro é como uma pilha de ${volts(c.v)} V com ${mm(c.r_pino, 0)} Ω por dentro), então o resistor fica com ≈ ${Math.round(c.ohms)} Ω. O valor de loja mais perto é <b>${ohmsTxt(c.padrao)}</b>:</span>
    <span><span class="faixa-ma ${c.passa_do_pino ? 'passa' : 'ok'}">pino ${volts(c.v)} V → ${ohmsTxt(c.padrao)} → ${ma}</span>, ${luz} do brilho do anúncio. Cada LED sai um pouco diferente: o datasheet dá uma faixa pra tensão dele aceso.</span>
    ${c.passa_do_pino ? `<span class="nao-bate">✗ ${esc(comMaiuscula(c.aviso || `passa da força padrão do pino (~${mA(c.i_pino)} mA)`))}.</span>`
      : c.pior ? `<span class="bate">✓ No pior caso (3V3 em ${mm(c.pior.v, 3)} V e o LED que acende com menos tensão) são ${mA(c.pior.i)} mA: abaixo da força padrão do pino (~${mA(c.i_pino)} mA).</span>` : ''}
    ${c.duty_max != null ? `<span>Luz média: o programa deixa ele aceso no máximo ${porCento(c.duty_max)} do tempo${c.duty_origem ? ` (${esc(c.duty_origem)})` : ''}${c.luz_media != null ? `, então em média ele dá ≈ ${porCento(c.luz_media)} do brilho do anúncio` : ''}.</span>` : ''}
    ${c.passa_do_pino ? reprovadoHTML(c, peca) : bateHTML(c, peca)}
    ${rodapeDaConta(c)}
  </div>`;
}

// o olho de luz: 3V3 → resistor fixo → pino ← LDR → GND, e a tabelinha de luz → volts nos cantos do LDR
function contaDoDivisorHTML(c, peca, alvo) {
  const cantos = [['min', 'LDR de menos Ω'], ['meio', 'do meio'], ['max', 'de mais Ω']];
  const linhas = (c.linhas || []).map(l => `<tr><th scope="row">${l.lux ? `${l.lux} lux` : 'escuro'}</th>${cantos.map(([k]) => {
    const x = l.cantos[k];
    // o número com o 3V3 do meio e, embaixo, a faixa com o 3V3 de verdade (à vista, também no celular)
    return `<td class="${x.na_faixa ? 'ok' : 'fora'}" title="${esc(`LDR com ${ohmsCurto(x.ohms)}`)}">${mm(x.v, 2)} V<span class="de-ate">${mm(x.v_de, 2)} a ${mm(x.v_ate, 2)}</span></td>`;
  }).join('')}</tr>`).join('');
  const um = (c.linhas || []).find(l => l.lux === 1), p1 = c.ponto_1lux;
  return `<div class="conta">
    <span>3V3 → <b>${ohmsTxt(c.r_fixo)}</b> → ${esc(pinoDoBloco(alvo))} ← ${esc(comApelido(alvo, c.para))} → GND: o pino lê a tensão do meio. No escuro o olho de luz tem muitos ohms e a tensão sobe; no claro, ela cai.</span>
    <div class="rolo"><table class="lux"><thead><tr><th scope="col">luz</th>${cantos.map(([, t]) => `<th scope="col">${t}</th>`).join('')}</tr></thead><tbody>${linhas}</tbody></table></div>
    <span class="sub">Verde: dentro da faixa boa do ADC (${mm(c.adc_min, 2)} a ${mm(c.adc_max, 2)} V); laranja: fora, onde o número que o ADC lê sai torto (menos exato). Cada LDR sai um pouco diferente (o datasheet dá uma faixa), por isso as três colunas. O número grande é com o 3V3 do meio (${volts(c.vdd)} V); o pequeno embaixo, com o 3V3 de verdade, de ${mm(c.vdd_de, 3)} a ${mm(c.vdd_ate, 3)} V.</span>
    ${c.faixa ? `<span>Pra esse olho de luz servem de ${ohmsTxt(c.faixa.de)} a ${ohmsTxt(c.faixa.ate)} (o LDR do meio na faixa boa de 1 a 100 lux e, em 10 lux, os dois cantos também)${c.padrao ? `: <b>${ohmsTxt(c.padrao)}</b>` : ''}.</span>` : ''}
    ${c.origem && c.padrao ? `<span class="sub">Por que ${ohmsTxt(c.padrao)}: ${esc(c.origem)}.</span>` : ''}
    ${um && p1 ? `<span class="sub">Em 1 lux a conta dá o LDR de ${ohmsCurto(um.cantos.min.ohms)} a ${ohmsCurto(um.cantos.max.ohms)}; o gráfico do datasheet dá de ${ohmsCurto(p1.r_min)} a ${ohmsCurto(p1.r_max)} (a página está em "De onde vêm os números").</span>` : ''}
    ${c.aviso ? `<span class="aviso">${esc(comMaiuscula(c.aviso))}.</span>` : ''}
    ${bateHTML(c, peca)}
    ${rodapeDaConta({ ...c, fontes: { ...c.fontes, ...(p1?.fonte ? { ponto_1lux: [p1.fonte] } : {}) } })}
  </div>`;
}

// o som: pino → resistor → piezo → GND; o pico é a borda do apito, quando o piezo vira um fio por um instante
function contaDoPiezoHTML(c, peca, alvo) {
  return `<div class="conta">
    <span>${esc(pinoDoBloco(alvo))} → <b>${ohmsTxt(c.ohms)}</b> → ${esc(comApelido(alvo, c.para))} → GND. Parado, o piezo não deixa passar corrente; no instante em que o apito vira, ele é um fio e só o resistor e o pino seguram: pico de <span class="faixa-ma ${c.passa_do_pino ? 'passa' : 'ok'}">${mA(c.pico)} mA</span>.</span>
    <span class="${c.passa_do_pino ? 'nao-bate' : 'bate'}">${c.passa_do_pino ? '✗' : '✓'} No pior caso (3V3 em ${mm(c.pior.v, 3)} V) são ${mA(c.pior.i)} mA: ${c.passa_do_pino ? 'passa da' : 'abaixo da'} força padrão do pino (~${mA(c.i_pino)} mA).</span>
    <span>O fabricante pede de ${ohmsTxt(c.r_serie[0])} a ${ohmsTxt(c.r_serie[1])} em série com o pino: <b>${ohmsTxt(c.padrao)}</b>.</span>
    ${c.origem && c.origem !== c.nota ? `<span class="sub">Por que ${ohmsTxt(c.padrao)}: ${esc(c.origem)}.</span>` : c.nota ? `<span class="sub">${esc(comMaiuscula(c.nota))}.</span>` : ''}
    ${bateHTML(c, peca)}
    ${rodapeDaConta(c)}
  </div>`;
}

// o botão: GPIO (com o pull-up de dentro) → resistor → botão → GND
function contaDoBotaoHTML(c, peca, alvo) {
  return `<div class="conta">
    <span>${esc(pinoDoBloco(alvo))} → <b>${ohmsTxt(c.ohms)}</b> → ${esc(comApelido(alvo, c.para))} → GND. Solto, o pull-up de dentro do cérebro (${ohmsTxt(c.r_pull)}) segura o pino em 1; apertado, o botão puxa pro GND.</span>
    <span class="${c.le_zero ? 'bate' : 'nao-bate'}">${c.le_zero ? '✓' : '✗'} Apertado, o pino fica em ${mm(c.v_apertado, 2)} V: ${c.le_zero ? 'lê 0' : 'não chega a ler 0'} (até ${mm(c.vil, 2)} V o pino lê 0).</span>
    <span class="${c.passa_do_pino ? 'nao-bate' : 'bate'}">${c.passa_do_pino ? '✗' : '✓'} Se o pino virar saída em 1 com o botão apertado (um erro no programa ou uma ponte de solda), passam <span class="faixa-ma ${c.passa_do_pino ? 'passa' : 'ok'}">${mA(c.curto.i)} mA</span>: ${c.passa_do_pino ? 'passa da' : 'abaixo da'} força padrão do pino (~${mA(c.i_pino)} mA).</span>
    ${c.origem ? `<span>Por que <b>${ohmsTxt(c.padrao)}</b>: ${esc(c.origem)}.</span>`   // a origem já diz a faixa
      : `<span>Serve de ${ohmsTxt(Math.round(c.faixa.de))} a ${ohmsTxt(Math.round(c.faixa.ate))}: <b>${ohmsTxt(c.padrao)}</b>.</span>`}
    ${bateHTML(c, peca)}
    ${rodapeDaConta(c)}
  </div>`;
}

function fotoDa(peca) {
  if (/^https:\/\//.test(peca?.foto || '')) return `<img class="foto" src="${esc(peca.foto)}" alt="" loading="lazy">`;   // loja do Brasil: a foto da página dela
  if (peca?.foto) return `<img class="foto" src="${BASE}pecas/${encodeURIComponent(peca.foto)}" alt="" loading="lazy">`;
  return peca ? `<img class="foto" src="/api/foto?codigo=${encodeURIComponent(peca.codigo)}" alt="" loading="lazy">` : '<span class="sem-foto"></span>';
}

// a conta de cada resistor: o freio do LED (na pilha ou no pino do cérebro), o olho de luz, o som e o botão.
// alvo = o bloco que o resistor atende (o 'led' ou o 'para' dele)
function contaHTML(c, peca, alvo) {
  if (!c) return '';
  if (c.falta) return `<div class="conta"><span>Pra fazer a conta do resistor falta: ${esc(c.falta.join(', '))}.</span></div>`;
  if (c.fonte === 'pino') return contaDoLedHTML(c, peca, alvo);
  if (c.tipo === 'divisor') return contaDoDivisorHTML(c, peca, alvo);
  if (c.tipo === 'piezo') return contaDoPiezoHTML(c, peca, alvo);
  if (c.tipo === 'botao') return contaDoBotaoHTML(c, peca, alvo);
  if (c.impossivel) return `<div class="conta"><span class="nao-bate">Essa pilha não tem força pra esse brilho, nem sem resistor.</span></div>`;
  const resto = c.r_s + c.r_interna;
  const horas = c.mah && c.i_padrao > 0 ? c.mah / (c.i_padrao * 1000) : null;
  return `<div class="conta">
    <span>Você pediu luz <b>${esc(c.resposta === 'media' ? 'média' : c.resposta)}</b>: ${FRACAO[c.resposta]} brilho que o fabricante anuncia. Pela curva do LED, isso é ≈ ${mA(c.i)} mA.</span>
    <span class="mono">(pilha − LED) ÷ corrente = (${volts(c.v)} − ${mm(c.joelho)}) ÷ ${mA(c.i)} mA ≈ ${Math.round(c.ohms + resto)} Ω</span>
    <span>O LED e a pilha já freiam ${mm(resto, 1)} Ω sozinhos, então o resistor fica com ≈ ${Math.round(c.ohms)} Ω. O valor de loja mais perto é <b>${ohmsTxt(c.padrao)}</b>: dá ${mA(c.i_padrao)} mA, ≈ ${Math.round(c.brilho * 100)}% do brilho do anúncio${horas ? `, e a pilha dura no máximo ≈ ${horas.toFixed(0)} h com o botão apertado` : ''}.</span>
    ${c.i_testada && c.i_padrao > c.i_testada ? `<span class="aviso">Acima dos ${mA(c.i_testada)} mA que o fabricante da pilha testou: funciona, mas ela rende menos que isso.</span>` : ''}
    ${peca ? (c.bate ? `<span class="bate">✓ o resistor do carrinho é esse</span>` : `<span class="nao-bate">✗ o do carrinho é ${ohmsTxt(peca.valor)}: troque pelo de ${ohmsTxt(c.padrao)}</span>`) : ''}
  </div>`;
}

function opcoesHTML(ref) {
  const o = S.opcoes[ref];
  if (!o) return '';
  if (o.carregando) return `<div class="opcoes"><span class="sub">${esc(o.carregando)}</span></div>`;
  if (o.erro) return `<div class="opcoes"><span class="aviso">${esc(o.erro)}</span></div>`;
  const cards = o.itens.map(i => cartaoPeca(i, { destaques: o.destaques, escolhida: i.escolhida, conferida: i.conferida,
    acao: i.escolhida ? '<span class="selo ok">no carrinho</span>'
      : `<button type="button" data-escolher="${esc(ref)}" data-codigo="${esc(i.codigo)}" ${S.mexendo || i.situacao !== 'ok' ? 'disabled' : ''}>Escolher</button>` })).join('');
  const filtro = [o.alvo ? `só ${ohmsTxt(o.alvo)}` : '', o.cor ? `só ${o.cor}` : ''].filter(Boolean).join(', ');
  return `<div class="opcoes"><span class="sub">${o.itens.length} opções no catálogo${filtro ? ` (${esc(filtro)}, pela escolha de agora)` : ''}${o.novas ? ` · ${o.novas} novas acabaram de entrar, vindas da loja` : ''}</span>
    ${cards || '<span class="vazio-op sub">O catálogo não tem nenhuma peça pra isso.</span>'}
    <div class="links acoes-op"><button type="button" data-online="${esc(ref)}" ${S.mexendo ? 'disabled' : ''}>Procurar mais na loja ↻</button>
      <button type="button" data-checar-op="${esc(ref)}" ${S.mexendo || !o.itens.length ? 'disabled' : ''}>Conferir o estoque destas agora</button>
      <a href="./?pecas">Ver todas as peças →</a></div></div>`;
}

// ---- passo 2 com o cérebro: a estrela. O cérebro no meio e um ramo por bloco ligado num pino dele;
// o resistor (e o capacitor) entra no ramo do bloco que ele atende ('led' ou 'para')
const minusculo = n => n === n.toUpperCase() ? n : n[0].toLowerCase() + n.slice(1);   // 'Botão' → 'botão'; 'LED' fica
function ramosDa(pj) {
  const atende = b => b.bloco !== 'cerebro' && pj.blocos.some(x => x.ref === (b.led || b.para)) ? (b.led || b.para) : null;
  return pj.blocos.filter(b => b.bloco !== 'cerebro' && !atende(b)).map(b => ({ b, ajudantes: pj.blocos.filter(x => atende(x) === b.ref) }));
}
function caminhoDoRamo(b, ajudantes) {   // "GPIO32 (D32) → 130 Ω → LED → GND"
  if (b.bloco === 'resistor') return { txt: `falta dizer pra que serve o ${b.ref} ('led' ou 'para' no projeto.json)`, falta: true };
  if (!b.pino) return { txt: 'sem pino ainda: falta dizer em qual GPIO do cérebro ele liga', falta: true };
  const freio = ajudantes.filter(x => x.bloco === 'resistor')
    .map(x => x.peca?.valor ? ohmsTxt(x.peca.valor) : x.conta?.padrao ? ohmsTxt(x.conta.padrao) : `${x.ref} ${x.conta?.impossivel ? 'impossível' : 'sem conta'}`)
    .join(' + ') || 'sem resistor';
  const outros = ajudantes.filter(x => x.bloco !== 'resistor').map(x => `${minusculo(x.nome)} ${x.ref} colado no pino`);
  const ramo = b.bloco === 'ldr' ? `3V3 → ${freio} → ${pinoDoBloco(b)} → ${minusculo(b.nome)} → GND` : `${pinoDoBloco(b)} → ${freio} → ${minusculo(b.nome)} → GND`;
  return { txt: ramo + (outros.length ? ` · ${outros.join(', ')}` : '') };
}
function estrelaHTML(pj, corDe) {
  const cerebro = pj.blocos.find(b => b.bloco === 'cerebro'), ramos = ramosDa(pj);
  const nE = Math.max(Math.ceil(ramos.length / 2), 1), nD = ramos.length - Math.ceil(ramos.length / 2);
  const meias = 2 * nE, desce = nE - nD;   // em meias linhas; com número ímpar de ramos, os da direita descem meia linha
  const raios = [], cards = ramos.map(({ b, ajudantes }, i) => {
    const esq = i < nE, linha = 2 * (esq ? i : i - nE) + (esq ? 0 : desce) + 1;
    raios.push(`<line x1="50" y1="50" x2="${esq ? 15 : 85}" y2="${(100 * linha / meias).toFixed(2)}"/>`);
    const cam = caminhoDoRamo(b, ajudantes), cor = COR_DE_TELA[corDe(b.ref)];
    return `<div class="bloco ramo" style="grid-column:${esq ? 1 : 3};grid-row:${linha} / span 2">
      <span class="icone"${cor ? ` style="color:${cor}"` : ''}>${icone(b.bloco)}</span><span class="funcao">${esc(b.funcao)} · ${esc(b.ref)}</span>
      <b>${esc(b.apelido || b.nome)}</b><span class="caminho-ramo${cam.falta ? ' falta' : ''}">${esc(cam.txt)}</span></div>`;
  });
  return `<div class="estrela" style="grid-template-rows:repeat(${meias}, 1fr)">
      <svg class="raios" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${raios.join('')}</svg>
      <div class="bloco centro"><span class="icone">${icone('cerebro')}</span><span class="funcao">${esc(cerebro.funcao)} · ${esc(cerebro.ref)}</span>
        <b>${esc(cerebro.apelido || cerebro.nome)}</b><span class="por-que">${esc(cerebro.peca?.nome || 'falta escolher o DevKit')}</span></div>
      ${cards.join('')}</div>`;
}

// a lista embaixo da estrela: um item por papel (o tipo de peça e o porquê dele), com as peças que fazem esse papel. O
// porquê do resistor muda com quem ele atende (o LED, o botão, o som, o olho de luz): cada um vira um item
function tiposDeBlocoHTML(pj) {
  const grupos = new Map();
  for (const b of pj.blocos) {
    const k = `${b.bloco}|${b.por_que}`;
    grupos.set(k, [...(grupos.get(k) || []), b]);
  }
  return [...grupos.values()].map(bs => {
    const b = bs[0], alvos = bs.map(x => pj.blocos.find(y => y.ref === (x.led || x.para))).filter(Boolean);
    const nomes = [...new Set(alvos.map(x => minusculo(x.nome)))];
    const onde = alvos.length !== bs.length || nomes.length !== 1 ? ''
      : bs.length > 1 ? `, um em cada ${nomes[0]} (${listaDeRefs(alvos.map(x => x.ref))})` : `, no ${nomes[0]} ${alvos[0].ref}`;
    return `<li><b>${esc(b.nome)}</b> (${esc(minusculo(b.funcao))}) · <span class="mono">${esc(listaDeRefs(bs.map(x => x.ref)))}</span>${esc(onde)}: ${esc(b.por_que)}</li>`;
  }).join('');
}

// ---- passo 1 com o cérebro: a resposta de cada LED (o brilho geral pode ter ajuste por LED; a cor é sempre de um LED)
function brilhoPorLedHTML(q, pj, corDe) {
  const nome = id => q.opcoes.find(o => o.id === id)?.nome || id;
  const conta = ref => pj.blocos.find(b => b.bloco === 'resistor' && b.led === ref)?.conta || {};
  return `<ul class="por-led">${q.por_led.map(x => `<li><span class="mono">${esc(x.ref)}</span>${bolinha(corDe(x.ref))}<span>${esc(x.apelido || 'LED')}</span>
      ${x.resposta ? `<b>${esc(nome(x.resposta))}</b>` : '<span class="aviso">falta responder</span>'}<span class="sub">${x.do_led ? 'só dele' : 'a resposta geral'} · ${esc(quemDecidiu(x.quem))}</span>
      ${x.impossivel ? '<span class="nao-bate">impossível neste LED</span>' : conta(x.ref).passa_do_pino ? '<span class="nao-bate">passa da força padrão do pino</span>' : ''}</li>`).join('')}</ul>
    <span class="sub">Os botões mudam a resposta geral; o ajuste de um LED só (o "só dele") fica, e quem grava é o Claude: é só pedir.${tetoDoPinoTxt(pj)}</span>`;
}
// no pino do ESP32 a luz tem teto: o pino só dá a força padrão dele. A escolha que passar fica gravada, mas a conta dá ✗
// e o resistor do carrinho não muda (a conta de cada LED usa o pior caso: o 3V3 alto e o LED de vf baixo)
function tetoDoPinoTxt(pj) {
  const iPino = (pj?.blocos || []).map(b => b.bloco === 'resistor' && b.led && b.conta?.i_pino).find(positivo);
  return iPino ? ` No pino do cérebro a corrente tem teto, a força padrão do pino (~${mA(iPino)} mA): a luz que passar dele fica com ✗ no passo 3 e o resistor do carrinho não muda.` : '';
}
function corPorLedHTML(q) {
  const conferidas = (q.opcoes || []).filter(o => o.conferidos?.length).map(o => o.id);
  return `<div class="pergunta"><span class="pergunta-txt">${esc(q.texto)}</span>
    <ul class="por-led">${(q.por_led || []).map(x => `<li><span class="mono">${esc(x.ref)}</span>${bolinha(x.resposta || x.da_peca)}<span>${esc(x.apelido || 'LED')}</span>
      ${x.resposta ? `<b>${esc(x.resposta)}</b><span class="sub">${esc(quemDecidiu(x.quem))}</span>` : '<span class="aviso">falta responder</span>'}
      ${x.bate === false ? `<span class="nao-bate">✗ a peça do carrinho é ${esc(x.da_peca)}: troque o LED ou a cor</span>`
        : x.bate ? `<span class="bate">✓ a peça do carrinho é ${esc(x.da_peca)}</span>`
        : x.da_peca ? `<span class="sub">a peça do carrinho é ${esc(x.da_peca)}</span>` : '<span class="sub">ainda sem peça</span>'}</li>`).join('')}</ul>
    <span class="sub">${conferidas.length ? `Cores com LED de datasheet conferido no catálogo: ${esc(conferidas.join(', '))}. ` : ''}A cor de cada LED, quem grava é o Claude: é só pedir.</span></div>`;
}

// ---- passo 3 com o cérebro: onde o bloco liga, o que vai junto com o DevKit e o total em R$ + US$
function noPinoTxt(b) {
  const p = b.no_cerebro;
  return p ? `no pino ${p.pino} do DevKit, onde está escrito ${p.serigrafia || b.pino} (${b.pino})${p.cuidado ? ` · ${p.cuidado}` : ''}` : `no ${b.pino} do cérebro`;
}
function acompanhaHTML(lista) {
  const link = (url, txt) => /^https:\/\//.test(url || '') ? `<a href="${esc(url)}" target="_blank" rel="noopener">${txt}</a>` : '';
  const naLoja = url => /lcsc\.com/.test(url || '') ? 'na LCSC' : 'na loja';   // pra não confundir com o "Na loja" do DevKit
  const links = (...l) => l.join('') ? `<div class="links">${l.join('')}</div>` : '';
  return `<div class="acompanha"><span class="sub">Vai junto (o DevKit encaixa nelas; não entram no placa.txt):</span>
    ${lista.map(a => {
      const alt = a.alternativa_peca;
      return `<span>${a.qtd || 1} × <b>${esc(a.nome || a.codigo)}</b></span>
      <span class="sub">${esc(a.codigo)} · ${a.preco != null ? `${preco(a.preco, a.moeda)} cada${a.minimo > 1 ? ` (mínimo ${a.minimo})` : ''} = ${preco(a.subtotal, a.moeda)}` : 'sem preço no catálogo'}${a.estoque != null ? ` · ${milhar(a.estoque)} em estoque` : ''}${a.conferido ? ' · ✓ desenho conferido' : ''}</span>
      ${a.situacao && a.situacao !== 'ok' ? `<span class="aviso">${esc(a.situacao)}</span>` : ''}
      ${a.no_catalogo === false ? pendenteHTML(`${a.codigo}: não está no catálogo, sem preço nem desenho conferido`) : a.conferido === false ? pendenteHTML(`${a.codigo}: o desenho da barra ainda não foi conferido`) : ''}
      ${links(link(a.link, `A barra ${naLoja(a.link)} ↗`), link(a.datasheet, 'Desenho da barra ↗'))}
      ${alt ? `<span class="sub">Se faltar: ${esc(alt.codigo)}${alt.nome ? ` (${esc(alt.nome)})` : ''}, ${alt.preco != null ? `${preco(alt.preco, alt.moeda)} cada` : 'sem preço'}${alt.situacao && alt.situacao !== 'ok' ? ` · ${esc(alt.situacao)}` : ''}</span>
      ${links(link(alt.link, `A outra barra ${naLoja(alt.link)} ↗`), link(alt.datasheet, 'Desenho da outra barra ↗'))}` : ''}`;
    }).join('')}</div>`;
}
function totalHTML(pj, extras) {
  const t = pj.totais || {};
  if (!(t.BRL > 0))   // tudo na LCSC (a lanterninha): igual a antes
    return `<span class="total">Peças: <b>${dolar(pj.total)}</b> (uma de cada, na LCSC, a loja irmã da JLCPCB)${extras.length ? ` + ${esc(extras.join(', '))}` : ''}. A fábrica entrega só a placa nua: as peças você solda em casa.</span>`;
  const partes = Object.entries(t).filter(([, v]) => v > 0).sort(([a], [b]) => (b === 'BRL') - (a === 'BRL'))
    .map(([moeda, v]) => `${MOEDA[moeda] || moeda} ${mm(v, 2)}`);
  const lojas = [...new Set(pj.blocos.filter(b => b.peca?.moeda === 'BRL').map(b => b.peca.loja || 'loja do Brasil'))];
  const cerebro = pj.blocos.some(b => b.bloco === 'cerebro');
  return `<span class="total">Peças: <b>${partes.join(' + ')}</b> (o R$ na ${esc(lojas.join(' e na '))}; o US$ na LCSC, a loja irmã da JLCPCB, uma de cada${cerebro ? ' e as barras que vão junto com o DevKit' : ''})${extras.length ? ` + ${esc(extras.join(', '))}` : ''}. São compras separadas, uma em cada loja. A fábrica entrega só a placa nua: as peças você solda em casa${cerebro ? ', e o DevKit só encaixa' : ''}.</span>`;
}

// ---- passos 6 e 7 com o DevKit: o que conferir antes de pedir e como soldar as barras sem estragar
// antes de pedir, só o que se confere sem solda (a régua, a folha em 1:1); o que fala de solda é da montagem
const antesDePedir = t => !/\bsold/i.test(t);
function confiraHTML(p, titulo, filtro = () => true) {
  return `<div class="confira"><b>${esc(titulo)}</b><ol>${p.confira.filter(filtro).map(t => `<li>${esc(t)}</li>`).join('')}</ol>
    <div class="links"><a href="${BASE}saida/imprimir_1x1.svg" target="_blank" rel="noopener">Folha pra imprimir em 1:1, com a régua de 50 mm ↗</a></div></div>`;
}
const LIGA_SEMPRE = ['GND', '3V3', 'VIN'];   // os pinos de energia contam como ligados, mesmo sem trilha (uma ponte neles é curto)
function fileirasDe(p) {   // os pinos de cada fileira do DevKit, da esquerda pra direita
  const por = {};
  for (const q of p.pinos) (por[Math.round(q.y * 10)] ||= []).push(q);
  return Object.values(por).map(f => f.sort((a, b) => a.x - b.x));
}
function montarComDevkitHTML(p, pj, m, ordem) {
  const ser = q => p.serigrafia?.[q.n] || q.nome || q.n;
  const naoSolda = q => /não soldar/i.test(p.cuidados?.[q.n] || '');
  const lado = q => q.net || (LIGA_SEMPRE.includes(q.nome) ? q.nome : null);
  const fileiras = fileirasDe(p), achados = [];
  for (const f of fileiras) for (let i = 1; i < f.length; i++) {
    const [a, b] = [f[i - 1], f[i]].sort((x, y) => +x.n - +y.n);
    if (lado(a) && lado(b) && lado(a) !== lado(b))
      achados.push({ energia: [a, b].some(q => LIGA_SEMPRE.includes(q.nome)), n: +a.n, txt: `${a.n}–${b.n} (${ser(a)} e ${ser(b)})` });
  }
  const pares = achados.sort((x, y) => y.energia - x.energia || x.n - y.n).map(x => x.txt);   // os de energia primeiro
  const pontas = fileiras.map(f => f.filter(q => !naoSolda(q))).filter(f => f.length > 1)
    .map(f => [f[0].n, f.at(-1).n].sort((x, y) => x - y).join(' e ')).join('; ');
  const semSolda = p.pinos.filter(naoSolda), ligados = semSolda.filter(q => q.net);
  const barras = pj?.blocos.find(b => b.bloco === 'cerebro')?.acompanha || p.acompanha || [];
  const calor = barras.flatMap(a => [a, a.alternativa_peca || (a.alternativa ? { codigo: a.alternativa } : null)]).filter(Boolean).map(a => {
    const conhecida = SOLDA_DA_BARRA[a.codigo];   // o número do /api/projeto vale primeiro; senão, o do desenho anotado aqui
    const s = a.mecanica?.solda_max_c ? { c: a.mecanica.solda_max_c, s: a.mecanica.solda_max_s, marca: conhecida?.marca, fonte: a.mecanica.fonte }
      : conhecida;
    if (!s) return null;
    const fonte = esc(s.fonte || 'o desenho do fabricante');
    return `${esc(`${s.marca ? `${s.marca} ` : ''}${a.codigo}`)}, ${s.c}&nbsp;°C por ${s.s}&nbsp;s (${/^https:\/\//.test(a.datasheet || '')
      ? `<a href="${esc(a.datasheet)}" target="_blank" rel="noopener">${fonte} ↗</a>` : fonte})`;
  }).filter(Boolean);
  const temLdr = pj?.blocos.some(b => b.bloco === 'ldr') || m.pecas.some(x => x.eletrica?.modelo === 'ldr');
  const pasta = `placas/${PLACA}/codigo/`;
  // tem programa? A etapa "Roda o programa" só existe com o codigo/main.py; sem os testes, não dá pra saber (null)
  const programa = S.testes?.etapas ? S.testes.etapas.some(e => /programa/i.test(e.nome)) : null;
  const copiar = 'dentro dessa pasta: <code>mpremote cp main.py pinos.py :</code> (o <code>pinos.py</code> é gerado pelo Sianvolt: não edite)';
  return `<p>Quando a placa e as peças chegarem:</p>
    <ol class="montar">
      <li>Solde as peças pequenas primeiro, da menor pra maior (${esc(ordem.join(', '))}), e as barras do DevKit por último.</li>
      <li><b>O lado da barra:</b> as barras fêmea entram por cima, no lado do desenho do DevKit (a serigrafia), e a solda fica embaixo.</li>
      <li><b>Solde com o DevKit encaixado:</b> ponha as duas barras nos furos e encaixe o DevKit nelas antes de soldar, assim elas ficam retas e na distância certa. Solde primeiro as pontas de cada barra (pinos ${esc(pontas)}), confira que ficou reto e só então o resto, pulando de um pino pra outro longe dele.</li>
      <li><b>Pouco calor:</b> encoste o ferro só o tempo de a solda escorrer pelo pino, uns 2 a 3 s, e passe pro próximo. ${calor.length ? `O máximo que o desenho da barra aguenta: ${calor.join('; ')}.` : ''}
        ${pendenteHTML('2 a 3 s por pino: é costume de quem solda, sugerido na revisão do plano; falta uma fonte (datasheet ou norma) pra esse tempo. O limite com fonte é o do desenho da barra')}</li>
      ${calor.length ? '' : `<li>${pendenteHTML('temperatura da barra: falta conferir no desenho dela quanto calor ela aguenta')}</li>`}
      ${semSolda.length ? `<li><b>${esc(semSolda.map(q => `${ser(q)} (pino ${q.n})`).join(', '))}: não soldar.</b> ${ligados.length
        ? `<span class="nao-bate">✗ Mas a placa liga ${esc(ligados.map(ser).join(', '))}: peça pro Claude tirar essa ligação.</span>`
        : `Nenhuma peça desta placa usa ${semSolda.length > 1 ? 'esses pinos' : 'esse pino'}, e um pino a menos soldado é uma ponte de solda a menos.`}</li>` : ''}
      <li><b>Procure ponte de solda</b>, com o DevKit fora: a lupa do celular em cada fileira e o multímetro na continuidade (o bip) entre ${esc(pares.join(', ') || 'cada par de pinos vizinhos')}. Nenhum desses pares pode bipar.</li>
      <li><b>Nunca encaixe nem tire o DevKit com o USB ligado.</b></li>
      <li><b>Cabo de dados:</b> o cabo micro-USB que só carrega não faz a porta do DevKit aparecer no computador.</li>
      <li><b>Grupo dialout (quem faz é você):</b> no Linux, a porta do DevKit (<code>/dev/ttyUSB0</code>) só abre pra quem está no grupo dialout. É configuração do sistema: <code>sudo usermod -aG dialout $USER</code>, e depois saia e entre de novo na sessão.</li>
      <li><b>Grave o MicroPython ${MICROPYTHON}</b> no DevKit com o esptool, como diz a <a href="https://micropython.org/download/ESP32_GENERIC/" target="_blank" rel="noopener">página oficial ↗</a>: primeiro apaga (<code>esptool.py erase_flash</code>), depois grava o .bin baixado (<code>esptool.py --baud 460800 write_flash 0x1000 &lt;o .bin&gt;</code>).</li>
      <li><b>Copie o programa:</b> ${programa === false
        ? `esta placa ainda não tem programa (falta o <code>main.py</code> em <code>${esc(pasta)}</code>). Quando tiver, o Sianvolt gera o <code>pinos.py</code> do lado dele e é só copiar os dois, ${copiar}.`
        : `o <code>main.py</code> e o <code>pinos.py</code> ficam em <code>${esc(pasta)}</code>${programa ? '' : ' (quando a placa tiver programa)'}. ${comMaiuscula(copiar)}.`}</li>
      ${temLdr ? '<li><b>Se a luz não acender no escuro,</b> cubra o LED vermelho do DevKit com fita isolante preta: o olho de luz pode estar vendo ele.</li>' : ''}
    </ol>
    ${p.confira?.length ? confiraHTML(p, 'Confira') : ''}
    <p>Antes disso, dá pra ensaiar no ▶ da aba Projeto.</p>`;
}

function desenharProcesso(main) {
  const m = S.modelo, t = S.testes, obj = t?.objetivo, c = S.cotacao, pj = S.projeto;
  const reqs = obj?.itens || [];
  const falha = t && !t.rodando && t.etapas.find(e => e.estado === 'falhou');
  const ocupado = S.mexendo || t?.rodando;

  // 1. objetivo: o que a placa faz e o que a gente quer dela
  const listaReqs = reqs.length ? `<ul class="reqs">${reqs.map(i => `<li class="${i.status === 'ok' ? 'ok' : 'falha'}">${{ ok: '✓', '?': '?' }[i.status] || '✗'} ${esc(i.id)} ${esc(i.titulo)}${i.status === 'ok' ? '' : ` · ${esc(i.motivo)}`}</li>`).join('')}</ul>` : '';
  // a cor de cada LED (a da peça do carrinho, que é a que acende; sem peça, a pedida), pras bolinhas e pros ícones
  const porLedDaCor = Object.fromEntries(((pj?.perguntas || []).find(q => q.id === 'cor')?.por_led || []).map(x => [x.ref, x]));
  const corDe = ref => porLedDaCor[ref]?.da_peca || porLedDaCor[ref]?.resposta;
  const perguntas = (pj?.perguntas || []).map(q => {
    if (q.id === 'cor') return corPorLedHTML(q);   // a cor é sempre de um LED: sem botão geral
    const escolhida = q.opcoes.find(o => o.id === q.resposta);
    const quem = q.por_led ? ` · a resposta geral: ${esc(quemDecidiu(q.quem))}${q.quem && q.quem !== 'Luiz' ? ', clique pra mudar' : ''}`
      : q.quem && q.quem !== 'Luiz' ? ` · ${esc(q.quem)}, clique pra mudar` : '';
    return `<div class="pergunta"><span class="pergunta-txt">${esc(q.texto)}</span>
      <div class="escolhas" role="group" aria-label="${esc(q.texto)}">${q.opcoes.map(o => `<button type="button" data-responder="${esc(q.id)}" data-resposta="${esc(o.id)}" aria-pressed="${q.resposta === o.id}" ${ocupado ? 'disabled' : ''}>${esc(o.nome)}</button>`).join('')}</div>
      <span class="sub">${escolhida ? esc(escolhida.explica) : 'Escolha uma: é daqui que sai o resistor.'}${quem}</span>${q.por_led ? brilhoPorLedHTML(q, pj, corDe) : ''}</div>`;
  }).join('');
  const lendo = !pj && (!S.apiSabido || (S.api && !S.projetoLido));   // o /api/projeto ainda não respondeu
  const titulo = pj?.objetivo || obj?.titulo || (lendo ? 'lendo o projeto…' : PLACA), frase = pj?.frase || obj?.texto;
  const p1 = passo(1, reqs.length && reqs.every(i => i.status === 'ok') && (pj?.perguntas || []).every(q => q.respondida ?? q.resposta) ? 'ok' : 'falha', 'Objetivo', `
      <p class="destaque">${esc(titulo)}</p>${frase ? `<p>${esc(frase)}</p>` : ''}
      ${perguntas}
      ${S.recado && S.recadoOnde === 'responder' ? `<p class="aviso" role="status">${esc(recadoAgora())}</p>` : ''}
      ${obj?.erro ? `<p class="erro-req">${esc(obj.erro)}</p>` : ''}
      ${listaReqs}${reqs.length ? '<button type="button" class="link" data-aba="thinking">Ver os requisitos →</button>' : ''}`);

  // 2. blocos: o tipo de cada peca, sem numero ainda
  let p2, p3;
  if (pj) {
    const classica = pj.blocos.map(b => b.bloco).join() === 'pilha,botao,resistor,led';
    const comCerebro = pj.blocos.some(b => b.bloco === 'cerebro');
    p2 = comCerebro ? passo(2, 'ok', 'Blocos', `
      <p>Antes de qualquer número: que tipo de peça faz cada parte do trabalho. O cérebro fica no meio: cada ramo sai de um pino dele, passa pelo freio e volta pro GND${pj.blocos.some(b => b.bloco === 'ldr') ? ' (o olho de luz pega a força no 3V3 do cérebro)' : ''}.</p>
      ${estrelaHTML(pj, corDe)}
      <ul class="tipos-de-bloco">${tiposDeBlocoHTML(pj)}</ul>`)
      : passo(2, 'ok', 'Blocos', `
      <p>Antes de qualquer número: que tipo de peça faz cada parte do trabalho.${classica ? ' A corrente sai do + da pilha, passa pelos blocos nessa ordem e volta pelo −.' : ''}</p>
      <div class="cadeia">${pj.blocos.map((b, i) => `${i ? '<span class="seta" aria-hidden="true">→</span>' : ''}<div class="bloco">
        <span class="icone">${icone(b.bloco)}</span><span class="funcao">${esc(b.funcao)}</span><b>${esc(b.nome)}</b>
        <span class="por-que">${esc(b.por_que)}</span></div>`).join('')}</div>`);

    // 3. carrinho: uma peca de verdade da loja pra cada bloco
    const itens = pj.blocos.map(b => {
      const pc = b.peca, cor = porLedDaCor[b.ref];
      const alvo = pj.blocos.find(x => x.ref === (b.led || b.para));   // o bloco que o resistor atende
      const avisos = [];
      if (!pc) avisos.push('Ainda sem peça: clique em Escolher.');
      if (pc?.pendente?.length) avisos.push(`Falta o Claude conferir no datasheet: ${pc.pendente.join('; ')}.`);
      if (pc && b.na_placa === false) avisos.push('Ainda não está na placa: peça pro Claude pôr.');
      if (cor?.bate === false) avisos.push(`Você pediu ${cor.resposta}, mas esta peça é ${cor.da_peca}: troque o LED ou a cor.`);
      const custa = pc?.moeda && pc.moeda !== 'USD' ? `${preco(pc.preco, pc.moeda)} na ${esc(pc.loja || 'loja')}` : `${dolar(pc?.preco)} cada`;
      return `<li class="item">${fotoDa(pc)}<div class="info">
        <span class="sub">${esc(b.ref)} · ${esc(b.funcao)} · ${esc(b.nome)}${b.apelido ? ` · ${esc(b.apelido)}` : ''}</span>
        <b>${esc(pc?.nome || 'falta escolher')}</b>
        ${pc ? `<span class="sub">${esc(pc.marca)} ${esc(pc.modelo)} · ${esc(pc.tamanho)}</span>
        <span class="sub">${custa} · ${milhar(pc.estoque)} em estoque${b.quem ? ` · ${esc(b.quem === 'Luiz' ? 'você escolheu' : b.quem)}` : ''}</span>` : ''}
        ${b.pino ? `<span class="sub">${esc(noPinoTxt(b))}</span>` : ''}</div>
        <div class="mais">
        ${avisos.map(a => `<span class="aviso">${esc(a)}</span>`).join('')}
        ${(pc?.avisos || []).map(pendenteHTML).join('')}
        ${pc?.condicao_3v3 ? `<span class="sub">3V3 de verdade: ${esc(pc.condicao_3v3)}.</span>` : ''}
        ${b.acompanha?.length ? acompanhaHTML(b.acompanha) : ''}
        ${b.bloco === 'resistor' ? contaHTML(b.conta, pc, alvo) : ''}
        <div class="links">${pc?.datasheet ? `<a href="${esc(pc.datasheet)}" target="_blank" rel="noopener">Datasheet ↗</a>` : ''}
          ${/^https:\/\//.test(pc?.link || '') ? `<a href="${esc(pc.link)}" target="_blank" rel="noopener">Na loja ↗</a>` : ''}
          <button type="button" data-trocar="${esc(b.ref)}" aria-expanded="${!!S.opcoes[b.ref]}">${S.opcoes[b.ref] ? 'Fechar opções' : pc ? 'Trocar' : 'Escolher'}</button></div>
        </div>${opcoesHTML(b.ref)}</li>`;
    }).join('');
    const extras = [...new Set(pj.blocos.flatMap(b => b.peca?.extras || []))];
    // cheio: toda peça escolhida, conferida e na placa; toda conta fechando (sem falta, possível, dentro da força do pino) e a cor batendo
    const cheio = pj.blocos.every(b => b.peca && !b.peca.pendente.length && b.na_placa !== false)
      && pj.blocos.every(b => b.conta?.bate !== false && !b.conta?.falta && !b.conta?.impossivel && !b.conta?.passa_do_pino)
      && Object.values(porLedDaCor).every(x => x.bate !== false);
    p3 = passo(3, cheio ? 'ok' : 'falha', 'Carrinho', `
      <p>Uma peça de verdade, que a loja tem em estoque, pra cada bloco. O desenho dela na placa é o oficial do fabricante, não um chute.</p>
      ${S.recado && S.recadoOnde !== 'responder' ? `<p class="aviso">${esc(recadoAgora())}</p>` : ''}
      <ul class="carrinho">${itens}</ul>
      ${totalHTML(pj, extras)}`);
  } else if (lendo) {
    // o /api/projeto ainda não respondeu: não dá pra dizer que a placa é da ordem antiga
    p2 = passo(2, 'pendente', 'Blocos', '<p class="sub">lendo o projeto…</p>');
    p3 = passo(3, 'pendente', 'Carrinho', '<p class="sub">lendo o projeto…</p>');
  } else {
    // placa de antes da ordem nova: sem projeto.json, mostra a lista de compras antiga
    const compras = m?.compras || [];
    p2 = passo(2, 'pendente', 'Blocos', '<p>Esta placa é de antes da ordem nova: ainda não tem os blocos (<span class="mono">projeto.json</span>).</p>');
    p3 = passo(3, 'pendente', 'Carrinho', m ? `<p>Peças desta placa, ainda sem loja:</p>
      <ul class="compras">${compras.map(x => `<li><span class="mono">${esc(x.ref)}</span><b>${esc(x.nome)}</b>${x.valor ? `<span>${esc(x.valor)} Ω</span>` : ''}${x.compra ? `<span class="sub">${esc(x.compra)}</span>` : ''}</li>`).join('')}</ul>` : '<p>Aparece quando a placa for gerada.</p>');
  }

  // 4. placa: as pecas do carrinho, posicionadas
  const versoes = [...S.versoes].reverse();
  const forafora = pj ? pj.blocos.filter(b => b.peca && b.na_placa === false).map(b => b.ref) : [];
  const p4 = m ? passo(4, forafora.length ? 'falha' : 'ok', 'Placa', `<div class="placa-resumo">${miniatura(m)}<div style="display:flex;flex-direction:column;gap:10px">
      <span class="sub mono">${mm(m.placa.w, 0)} × ${mm(m.placa.h, 0)} mm · ${m.pecas.length} peças · ${ligacoesTxt(m)}${m.vias?.length ? ` · ${m.vias.length} vias` : ''}</span>
      ${forafora.length ? `<span class="aviso">A placa ainda usa a peça antiga de ${esc(forafora.join(', '))}.</span>` : ''}
      <ol class="versoes-lista">${versoes.map(v => `<li><span class="mono">v${v.v}</span> ${esc(v.frase)} <span class="sub">· ${esc(v.quando)}</span></li>`).join('')}</ol>
      <button type="button" class="link" data-aba="projeto">Abrir a placa →</button></div></div>`)
    : passo(4, 'pendente', 'Placa', '<p>Ainda não foi gerada.</p>');

  // 5. testes
  const rodar = S.api ? '<button type="button" class="link" data-rodar>Rodar os testes de novo ↻</button>' : '';
  let p5 = passo(5, 'pendente', 'Testes', `<p>Ainda não rodou.</p><div class="links">${rodar}</div>`);
  if (t) {
    const nc = naoConferido(t), passaram = t.etapas.filter(e => e.estado === 'ok');
    const texto = t.rodando ? 'Rodando agora…'
      : falha ? `Parou na etapa ${t.etapas.indexOf(falha) + 1}, ${esc(falha.nome.toLowerCase())}: ${esc(traduz(m, falha.detalhe))}`
      : nc.pulou.length ? `${passaram.length} de ${t.etapas.length} etapas passaram (${esc(passaram.map(e => e.nome.toLowerCase()).join(', '))}), e nenhuma falhou. ${nc.pulou.map(e => `A etapa ${t.etapas.indexOf(e) + 1}, ${esc(e.nome.toLowerCase())}, pulou: ${esc(traduz(m, e.detalhe))}.`).join(' ')}`
      : `As ${t.etapas.length} etapas passaram: ${t.etapas.map(e => e.nome.toLowerCase()).join(', ')}.`;
    const semResposta = !t.rodando && !falha && nc.sem.length ? `<p class="aviso">${nc.sem.length === 1 ? 'Um requisito ficou' : `${nc.sem.length} requisitos ficaram`} sem resposta (?): ${esc(nc.sem.map(i => `${i.id} ${i.titulo} · ${i.motivo}`).join('; '))}.</p>` : '';
    p5 = passo(5, t.rodando ? 'rodando' : falha || nc.txt ? 'falha' : 'ok', 'Testes', `<p>${texto}</p>${semResposta}
      ${!t.rodando && t.resumo ? `<div class="explica"><b>Resumo do Claude</b><p>${esc(t.resumo)}</p></div>` : ''}
      <div class="links"><button type="button" class="link" data-aba="testes">Ver as etapas →</button>${rodar}</div>`);
  }

  // 6. fabrica
  let corpo6 = '<p>Ainda não foi gerada.</p>', estado6 = 'pendente';
  const travas = m?.fabrica ? [...(m.fabrica.falta_datasheet || []), ...(m.fabrica.falta_conferir || [])] : [];
  if (m?.fabrica && !m.fabrica.pronta) {
    corpo6 = `<p>O <span class="mono">fabrica.zip</span> fica travado enquanto tiver peça sem datasheet conferido: ${esc(travas.join(', '))}.</p>`;
  } else if (m?.fabrica && (falha || !t || t.rodando)) {
    corpo6 = '<p>O <span class="mono">fabrica.zip</span> sai quando todos os testes passarem.</p>';
  } else if (m?.fabrica) {
    corpo6 = `<p>O <span class="mono">fabrica.zip</span> está pronto: contorno, cobre de cima e de baixo, máscara, serigrafia e os furos com e sem cobre.</p>
      <div class="links"><a class="link" href="${BASE}saida/fabrica.zip" download>Baixar fabrica.zip ↓</a></div>`;
  }
  const devkit = m?.pecas.find(p => p.confira?.length && p.eletrica?.modelo === 'mcu');   // a peça que encaixa: o DevKit
  if (devkit) corpo6 += confiraHTML(devkit, 'Confira antes de pedir', antesDePedir);
  if (c) {
    const antiga = cotacaoAntiga(c, m);
    estado6 = antiga ? estado6 : 'ok';
    corpo6 += `<div class="cotacao"><dl>
        <dt>Site</dt><dd>${esc(c.site)}</dd><dt>Situação</dt><dd>${esc(c.situacao)}${antiga ? ` · era a v${esc(c.versao)}; a placa mudou depois, cotar de novo` : ''}</dd>
        ${c.detectou ? `<dt>A fábrica leu</dt><dd>${esc(c.detectou)}</dd>` : ''}
        ${c.preco ? `<dt>Preço</dt><dd>${esc(c.preco)}</dd>` : ''}
        <dt>Quando</dt><dd>${esc(c.quando)}${c.versao ? ` · v${esc(c.versao)}` : ''}</dd></dl>
      ${c.imagem ? `<a href="${BASE}${esc(c.imagem)}" target="_blank" rel="noopener"><img src="${BASE}${esc(c.imagem)}" alt="Cotação no site da ${esc(c.site)}"></a>` : ''}
      ${/^https:\/\//.test(c.url || '') ? `<a class="link" href="${esc(c.url)}" target="_blank" rel="noopener">Abrir o site da ${esc(c.site)} ↗</a>` : ''}</div>`;
  }
  const p6 = passo(6, estado6, 'Fábrica', corpo6);

  // 7. montar
  const nomeDe = ref => pj?.blocos.find(b => b.ref === ref)?.nome.toLowerCase() || ref;
  const ordem = m ? [...m.pecas].sort((a, b) => a.corpo.w * a.corpo.h - b.corpo.w * b.corpo.h).map(p => nomeDe(p.ref)) : [];
  const p7 = passo(7, 'pendente', 'Montar e acender', devkit   // com o DevKit: as barras, a ponte de solda e a gravação do programa
    ? montarComDevkitHTML(devkit, pj, m, [...new Set([...m.pecas].filter(p => p !== devkit)
      .sort((a, b) => a.corpo.w * a.corpo.h - b.corpo.w * b.corpo.h).map(p => minusculo(pj?.blocos.find(b => b.ref === p.ref)?.nome || p.nome || p.ref)))])
    : m ? `<p>Quando a placa e as peças chegarem: solde do menor pro maior (${esc(ordem.join(', '))}), ponha a pilha e aperte o botão. Antes disso, dá pra ensaiar no ▶ da aba Projeto.</p>`
    : '<p>Depois da fábrica.</p>');

  const html = `<p class="caminho">O caminho de toda placa: dizer o que ela tem que fazer → escolher o tipo de cada peça → escolher as peças de verdade na loja → desenhar a placa com elas → testar no papel → fabricar → montar e acender.</p>
    <ol class="passos">${p1}${p2}${p3}${p4}${p5}${p6}${p7}</ol>`;
  let secao = main.querySelector('section.processo');
  if (!secao) { main.innerHTML = '<section class="processo" aria-label="Processo"></section>'; secao = main.querySelector('section.processo'); }
  if (secao.dataset.html !== html) {   // so troca se mudou, e sem perder a rolagem
    const rolagem = secao.scrollTop;
    secao.innerHTML = html;
    secao.dataset.html = html;
    secao.scrollTop = rolagem;
  }
}

// carrinho: abrir as opcoes de um bloco, escolher uma peca, responder uma pergunta
async function abrirOpcoes(ref, online = false) {
  if (S.opcoes[ref] && !online) { delete S.opcoes[ref]; return desenhar(); }
  S.opcoes[ref] = { carregando: online ? 'Procurando na loja e pondo o que achar no catálogo…' : 'Lendo o catálogo…' };
  desenhar();
  try {
    const r = await fetch(`/api/opcoes?placa=${encodeURIComponent(PLACA)}&ref=${encodeURIComponent(ref)}${online ? '&online=1' : ''}`, { cache: 'no-store' });
    const d = await r.json();
    if (S.opcoes[ref]) S.opcoes[ref] = r.ok ? d : { erro: d.erro || 'a loja não respondeu' };
  } catch { if (S.opcoes[ref]) S.opcoes[ref] = { erro: 'sem resposta do app (ele está aberto?)' }; }
  desenhar();
}

// as linhas 'liga' que o escolher virou ({antes, depois}), com o nome de gente dos furos: o + e o − vêm do modelo de
// antes da troca (o LED velho), e o + continua no mesmo lugar. Sem saber o nome do furo, mostra as linhas como estão
function viradaDeGente(m, ligas) {
  const furos = new Map();   // 'D1.2' -> 'D1.1': o furo de antes e o de agora
  for (const l of ligas) {
    const a = l.antes.split(' '), b = l.depois.split(' ');
    a.forEach((x, i) => { if (x !== b[i] && /^\w+\.\w+$/.test(x)) furos.set(x, b[i]); });
  }
  const ref = [...furos.keys()][0]?.split('.')[0], quantas = ligas.length > 1 ? `as ${ligas.length} ligações` : 'a ligação';
  const papeis = [...furos].map(([de, ate]) => [m && pinoDe(m, de)?.nome, de.split('.')[1], ate.split('.')[1]]);
  if (!ref || papeis.some(([nome]) => !['+', '−'].includes(nome)))
    return `No LED novo o + fica no outro furo, então virei ${quantas} dele no placa.txt: ${ligas.map(l => `${l.antes} → ${l.depois}`).join('; ')}.`;
  return `No LED novo o + fica no outro furo, então virei ${quantas} do ${ref} no placa.txt pra ele continuar virado pro mesmo lado: `
    + papeis.map(([nome, de, ate]) => `o ${nome} era o furo ${de} e agora é o ${ate}`).join('; ') + '.';
}

const RODANDO_DE_NOVO = 'Os testes estão rodando de novo com a mudança.';
async function mexer(caminho, corpo, recado) {
  S.mexendo = true; S.recado = recado; S.recadoDesde = 0; S.recadoOnde = caminho; desenhar();
  let ok = false;
  try {
    const r = await fetch(`/api/${caminho}?placa=${encodeURIComponent(PLACA)}`, {
      method: 'POST', headers: { 'X-Bancada': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
    const d = await r.json().catch(() => ({}));
    ok = r.ok;
    S.recado = r.ok ? [d.pendente?.length ? `Peça nova no carrinho. Falta o Claude conferir no datasheet: ${d.pendente.join('; ')}.` : `Feito. ${RODANDO_DE_NOVO}`,
      d.ligas?.length ? viradaDeGente(S.modelo, d.ligas) : '',   // o LED novo com o + no outro furo: o escolher virou as 'liga' dele
      ...[].concat(d.avisos || []).map(a => `Atenção: ${String(a).replace(/[.\s]+$/, '')}.`)].filter(Boolean).join(' ')
      : (d.erro || 'não deu certo');
    if (r.ok) S.recadoDesde = Date.now();   // quando os testes que o pedido disparou acabarem, o recado diz (recadoAgora)
    return r.ok;
  } catch { S.recado = 'sem resposta do app (ele está aberto?)'; return false; }
  finally {
    S.mexendo = false; S.brutos.projeto = null; await atualizar();
    const ruim = ok && caminho === 'responder' ? avisoDaResposta(S.projeto) : '';   // a resposta que a conta não aceita
    if (ruim) S.recado = `${ruim} ${S.recado.replace(/^Feito\. /, '')}`;
    desenhar();
    // o recado sai sozinho (com virada ou aviso, dá mais tempo de ler); o 'rodando de novo' espera os testes acabarem e
    // virar o 'Pronto' (recadoAgora), e aí fica mais 15 s
    const este = S.recado, longo = este.length > 120, desde = Date.now();
    const tirar = () => {
      if (S.recado !== este) return;
      if (este.includes(RODANDO_DE_NOVO) && recadoAgora() === este && Date.now() - desde < 600000) return setTimeout(tirar, 2000);
      setTimeout(() => { if (S.recado === este) { S.recado = ''; desenhar(); } }, 15000);
    };
    setTimeout(tirar, longo ? 15000 : 5000);
  }
}

// depois de responder a luz: os LEDs em que a conta não dá (passa da força padrão do pino, ou o pino não tem força pra
// essa luz). A resposta fica gravada, mas o resistor do carrinho não muda: o passo 3 mostra a conta com o ✗
function avisoDaResposta(pj) {
  const ruins = (pj?.blocos || []).filter(b => b.bloco === 'resistor' && b.led && (b.conta?.passa_do_pino || b.conta?.impossivel));
  if (!ruins.length) return '';
  const passa = ruins.filter(b => b.conta.passa_do_pino && !b.conta.impossivel).map(b => b.led), sem = ruins.filter(b => b.conta.impossivel).map(b => b.led);
  const iPino = ruins.find(b => positivo(b.conta.i_pino))?.conta.i_pino;
  const partes = [passa.length ? `${listaDeRefs(passa)} ${passa.length > 1 ? 'passam' : 'passa'} da força padrão do pino${iPino ? ` (~${mA(iPino)} mA)` : ''}` : '',
    sem.length ? `o pino não tem força pra essa luz em ${listaDeRefs(sem)}` : ''].filter(Boolean).join(', e ');
  return `A resposta mudou, mas com essa luz ${partes}: o resistor do carrinho fica como está, e o passo 3 mostra a conta. Escolha menos luz aqui, ou peça pro Claude menos luz só pra ${ruins.length > 1 ? 'esses LEDs' : 'esse LED'}.`;
}

// o recado na tela: o 'rodando de novo' vira 'já rodaram' quando a rodada que o pedido disparou acaba
function recadoAgora() {
  const t = S.testes;
  if (!S.recado.includes(RODANDO_DE_NOVO) || !S.recadoDesde || !t || t.rodando || !(Date.parse(t.inicio) >= S.recadoDesde - 5000)) return S.recado;
  return S.recado.replace(`Feito. ${RODANDO_DE_NOVO}`, RODANDO_DE_NOVO).replace(RODANDO_DE_NOVO, 'Pronto: os testes já rodaram de novo com a mudança (o passo 5 diz como foram).');
}

// ---------- aba Testes ----------
const ESTADOS = { ok: ['✓', 'ok'], rodando: ['…', 'rodando'], falhou: ['✗', 'falhou'], pulou: ['–', 'pulou'], nao_rodou: ['·', 'não rodou'], aguardando: ['·', 'aguardando'] };

function hora(iso) { return iso ? iso.slice(11, 16) : ''; }

function desenharTestes(main) {
  const t = S.testes;
  if (!t) { main.innerHTML = `<p class="vazio">Ainda não rodou nenhum teste.<br>Rode <span class="mono">python ferramenta/testar.py placas/${esc(PLACA)}</span>.</p>`; return; }
  const falha = !t.rodando && t.etapas.find(e => e.estado === 'falhou');
  const m = S.modelo;
  // o rótulo uma vez só por problema, numa peça que ainda não tem, de preferência fora do cérebro (o DevKit é grande e já
  // ganha o contorno; três etiquetas iguais amontoadas não dizem mais que uma): {ref: rótulo, ou '' = só o contorno}
  const eCerebro = ref => m?.pecas.find(p => p.ref === ref)?.eletrica?.modelo === 'mcu';
  const umaVez = (rotulos, ja = {}) => {
    const porRotulo = {}, saida = {};
    for (const [ref, rot] of Object.entries(rotulos || {})) (porRotulo[rot] ||= []).push(ref);
    for (const [rot, refs] of Object.entries(porRotulo)) {
      const livres = refs.filter(r => !ja[r] && !saida[r]), dono = livres.find(r => !eCerebro(r)) ?? livres[0];
      for (const r of refs) if (!ja[r] && !saida[r]) saida[r] = r === dono ? rot : '';
    }
    return saida;
  };
  const erros = falha ? umaVez(falha.rotulos) : {};
  // a etapa que passou com aviso (a antena, a psram, o pino de boot, os pinos juntos, o botão que não lê 0): contorno e
  // etiqueta amarela, do mesmo jeito
  const avisos = {};
  if (!t.rodando) for (const e of t.etapas) if (e.estado === 'ok' && e.aviso) {
    for (const [ref, rot] of Object.entries(umaVez(e.rotulos, avisos))) if (!avisos[ref]) avisos[ref] = rot;
  }
  const quando = t.rodando ? `começou ${hora(t.inicio)}` : `rodou ${hora(t.fim || t.inicio)}`;
  const etapaFoto = t.etapas.find(e => e.nome === 'Tira foto da placa');
  const fotoOk = etapaFoto?.estado === 'ok' && !etapaFoto.aviso;   // com aviso (o Chrome faltou ou falhou) não tem png

  const etapas = t.etapas.map(e => {
    const [icone, texto] = ESTADOS[e.estado] || ESTADOS.aguardando;
    let detalhe = ['ok', 'falhou', 'pulou'].includes(e.estado) ? traduz(m, e.detalhe) : '';
    if (e.estado === 'falhou' && e.requisitos?.length) detalhe += ` · requisitos ${e.requisitos.join(', ')}`;
    const comAviso = e.estado === 'ok' && e.aviso;   // o aviso sai do meio do detalhe e fica à vista, um por linha
    if (comAviso) detalhe = detalhe.split(' · ').filter(x => !x.startsWith('aviso: ')).join(' · ');
    return `<li class="etapa ${esc(e.estado)}">
      <span class="bola" aria-hidden="true">${icone}</span>
      <div class="meio"><span class="nome-etapa">${esc(e.nome)}</span>
        ${detalhe ? `<span class="detalhe">${esc(detalhe)}</span>` : ''}
        ${comAviso ? traduz(m, e.aviso).split(' · ').map(a => `<span class="aviso">Aviso: ${esc(a)}</span>`).join('') : ''}
        ${e.codigo ? `<code>${esc(e.codigo)}</code>` : ''}</div>
      <span class="estado">${texto}</span></li>`;
  }).join('');

  const placa = m ? miniatura(m, { erros, avisos }) : '';
  const nc = naoConferido(t), resto = nc.txt ? ` (no que foi conferido: ${nc.txt})` : '';
  const titulo = t.rodando ? 'Conferindo a placa…' : falha ? 'Onde está o problema' : Object.keys(avisos).length ? `Placa sem problemas, com avisos${resto}` : `Placa sem problemas${resto}`;
  const links = [...new Set([...Object.keys(erros), ...Object.keys(avisos)])].filter(ref => m?.pecas.some(p => p.ref === ref))
    .map(ref => `<button type="button" data-abrir="${esc(ref)}">Abrir ${esc(ref)} no Projeto →</button>`).join('');

  main.innerHTML = `<section class="testes" aria-label="Testes">
    <div class="coluna">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
        <div><h2>Rodada de testes</h2><span class="sub">${t.versao ? 'v' + t.versao + ' · ' : ''}${quando} · testes.json</span></div>
        ${S.api ? `<button type="button" class="pilula" data-rodar ${t.rodando ? 'disabled' : ''}>Rodar de novo ↻</button>` : ''}
      </div>
      <ol class="etapas">${etapas}</ol>
      ${!t.rodando && t.resumo ? `<div class="explica"><b>Resumo do Claude · só no final</b><p>${esc(t.resumo)}</p></div>` : ''}
    </div>
    <div class="coluna placa">
      <span class="titulo-placa">${titulo}</span>
      ${placa}
      <div class="links">${links}${fotoOk ? `<a href="${BASE}saida/foto.png" target="_blank" rel="noopener">Ver a foto tirada do Gerber ↗</a>` : ''}</div>
      ${m?.fabrica ? (m.fabrica.pronta && !falha && !t.rodando
        ? `<div class="links"><a href="${BASE}saida/fabrica.zip" download>Baixar fabrica.zip ↓</a></div>`
        : `<span class="sub">fabrica.zip ${m.fabrica.pronta ? 'sai quando todos os testes passarem' : 'bloqueado: peça sem datasheet conferido em ' + esc([...(m.fabrica.falta_datasheet || []), ...(m.fabrica.falta_conferir || [])].join(', '))}</span>`) : ''}
    </div>
  </section>`;
}

// ---------- desenha a aba certa ----------
function desenhar() {
  desenharTopo();
  const main = $('#main');
  if (main.dataset.aba !== S.aba) { main.innerHTML = ''; main.dataset.aba = S.aba; }
  if (S.aba === 'projeto') desenharProjeto(main);
  else if (S.aba === 'testes') desenharTestes(main);
  else if (S.aba === 'thinking') desenharThinking(main);
  else desenharProcesso(main);
}

function irPara(aba, sel) {
  S.aba = aba;
  if (sel !== undefined) S.sel = sel;
  $('#versoes').hidden = true;
  desenhar();
}

// ---------- eventos ----------
document.addEventListener('click', async e => {
  if (!e.target.closest('#versoes, #relogio')) $('#versoes').hidden = true;
  const b = e.target.closest('button, input, [data-alvo]');
  if (!b) return;
  if (b.dataset.aba) return irPara(b.dataset.aba);
  if (b.id === 'relogio') {
    const lista = $('#versoes');
    lista.hidden = !lista.hidden;
    b.setAttribute('aria-expanded', !lista.hidden);
    return desenharTopo();
  }
  if (b.dataset.versao) {
    const v = +b.dataset.versao;
    S.ver = v === versaoAtual() ? null : v;
    await Promise.all([modeloDaVersao(v), v > 1 && modeloDaVersao(v - 1)]);
    S.sel = null; S.cx = null; S.ligado = false; S.ajustes = novosAjustes();
    $('#versoes').hidden = true;
    return desenhar();
  }
  if (b.id === 'destacar') {
    S.destacar = b.checked;
    const v = S.ver ?? versaoAtual();
    if (v > 1) await modeloDaVersao(v - 1);
    return desenhar();
  }
  if ('rodar' in b.dataset) {
    b.disabled = true;
    for (const k of Object.keys(FALTA_ATE)) delete FALTA_ATE[k];   // o testes.json e o modelo vão aparecer: pergunta já
    await fetch(`/api/testar?placa=${encodeURIComponent(PLACA)}`, { method: 'POST', headers: { 'X-Bancada': '1' } }).catch(() => null);
    return;
  }
  if (b.dataset.abrir) { S.ver = null; S.cx = null; return irPara('projeto', { k: 'peca', ref: b.dataset.abrir }); }
  if (b.dataset.trocar) return abrirOpcoes(b.dataset.trocar);
  if (b.dataset.online) return abrirOpcoes(b.dataset.online, true);
  if (b.dataset.checarOp) {
    const ref = b.dataset.checarOp, codigos = (S.opcoes[ref]?.itens || []).map(i => i.codigo);
    S.opcoes[ref] = { carregando: 'Conferindo preço e estoque na loja agora…' }; desenhar();
    const d = await postar('/api/catalogo/checar', { codigos });
    S.recado = d.erro || `Conferi ${d.conferidas} na loja agora${d.mudaram?.length ? `: ${d.mudaram.length} mudaram` : ', nada mudou'}.`;
    S.recadoOnde = 'carrinho';
    delete S.opcoes[ref];
    return abrirOpcoes(ref);
  }
  if (b.dataset.inicio) { S.inicio = b.dataset.inicio; history.replaceState(null, '', S.inicio === 'pecas' ? '?pecas' : './'); return desenharInicio(); }
  if (b.dataset.cat) { Object.assign(C, { cat: b.dataset.cat, chip: null, todas: false }); return desenharCatalogo(); }
  if (b.dataset.catChip !== undefined) { C.chip = b.dataset.catChip || null; C.todas = false; return desenharCatalogo(); }
  if (b.dataset.catToggle) { C[b.dataset.catToggle] = b.checked; return desenharCatalogo(); }
  if ('catTodas' in b.dataset) { C.todas = true; return desenharCatalogo(); }
  if (b.dataset.checar) return acaoCatalogo('/api/catalogo/checar', { codigos: b.dataset.checar.split(',') }, 'Conferindo na loja agora…');
  if ('buscarLoja' in b.dataset) return acaoCatalogo('/api/catalogo/buscar', { bloco: C.cat, texto: $('#cat-busca').value }, 'Procurando na loja…');
  if (b.dataset.escolher) {
    const ref = b.dataset.escolher;
    if (await mexer('escolher', { ref, codigo: b.dataset.codigo }, `Trazendo ${b.dataset.codigo} da loja…`)) delete S.opcoes[ref];
    return desenhar();
  }
  if (b.dataset.responder) {
    for (const ref of Object.keys(S.opcoes)) delete S.opcoes[ref];   // a conta muda: as opcoes do resistor tambem
    return mexer('responder', { pergunta: b.dataset.responder, resposta: b.dataset.resposta }, 'Refazendo a conta…');
  }
  if ('programa' in b.dataset) return alternarPrograma();   // ▶ Programa: a régua do tempo
  if ('tocar' in b.dataset) return alternarTocar();
  if (b.dataset.pular) return pular(+b.dataset.pular);
  if (b.dataset.vel) { S.prog.vel = +b.dataset.vel; return mostrarInstante(); }
  if (b.dataset.ir) { pararDeTocar(); return irParaInstante(+b.dataset.ir); }   // uma marca da régua, uma linha da serial, um chip
  if (b.dataset.tirar) { const [tipo, i] = b.dataset.tirar.split(':'); return tirarChip(tipo, +i); }   // o ✕ de um chip
  if (b.dataset.luzQuarto) return luzNoInstante(b.dataset.luzQuarto, +b.dataset.luxQuarto);
  if (b.dataset.apertar) return apertarNoInstante(b.dataset.apertar);   // o 'Apertar SW1' do painel do ▶ Programa
  if ('rodarProg' in b.dataset) return rodarDeNovo();
  if (S.prog.aberto && S.modo === 'seta' && !S.arrastou && podeMexer() && b.dataset.alvo?.startsWith('peca:')) {   // o botão desenhado
    const ref = b.dataset.alvo.slice(5);
    if (modeloDaPeca(modeloVisto(), ref) === 'chave') return apertarNoInstante(ref);
  }
  if ('ligar' in b.dataset) return alternarLigado();
  if (b.dataset.chave) { S.ajustes.chave[b.dataset.chave] = !S.ajustes.chave[b.dataset.chave]; return desenhar(); }
  if (b.dataset.gpio) { S.ajustes.pinos[b.dataset.gpio] = +b.dataset.nivel; return desenhar(); }   // o pino do cérebro em 0 ou 1
  if (b.dataset.lux) { S.ajustes.lux[b.dataset.lux] = +b.dataset.valor; return desenhar(); }      // a luz no LDR (0 = escuro)
  if (b.dataset.piezo) { S.ajustes.piezo[b.dataset.piezo] = !S.ajustes.piezo[b.dataset.piezo]; return desenhar(); }
  if ('reset' in b.dataset) { S.ajustes = novosAjustes(); return desenhar(); }
  if (S.ligado && S.modo === 'seta' && b.dataset.alvo?.startsWith('peca:') && !motivoSemSimulacao(modeloVisto())) {   // ligado, clicar no botao e apertar
    const ref = b.dataset.alvo.slice(5), p = modeloVisto()?.pecas.find(q => q.ref === ref);
    if (p?.eletrica?.modelo === 'chave') { S.ajustes.chave[ref] = !S.ajustes.chave[ref]; return desenhar(); }
  }
  if (b.dataset.detalhado) { S.detalhado = b.dataset.detalhado === '1'; return desenhar(); }
  if (b.dataset.modo) { S.modo = b.dataset.modo; return desenhar(); }
  if (b.dataset.zoom) return zoomEm(+b.dataset.zoom);
  if ('centralizar' in b.dataset) { centralizar(); return aplicarZoom(); }
  if ('fechar' in b.dataset) { S.sel = null; return desenhar(); }
  if (b.dataset.alvo && S.modo === 'seta' && !S.arrastou) {
    S.sel = selecaoDoAlvo(b.dataset.alvo);
    return desenhar();
  }
});

document.addEventListener('change', e => {   // a caixa de escolher a categoria (aba Peças, tela estreita)
  if (e.target.id === 'cat-select') { Object.assign(C, { cat: e.target.value, chip: null, todas: false }); desenharCatalogo(); }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'cat-texto') { C.texto = el.value; C.todas = false; return desenharCatalogo(); }
  if ('regua' in el.dataset) { pararDeTocar(); return irParaInstante(+el.value); }   // arrastando a régua do ▶ Programa
  if (el.dataset.pilha) S.ajustes.pilha[el.dataset.pilha] = +el.value;
  else if (el.dataset.resistor) S.ajustes.resistor[el.dataset.resistor] = el.dataset.lista.split(',').map(Number)[+el.value];
  else return;
  desenhar();
});

document.addEventListener('mousedown', e => {
  const area = e.target.closest('.area');
  if (!area || e.target.closest('.ferramentas, .regua')) return;
  S.arrastou = false;
  if (S.modo === 'mao' || e.button === 1) {
    e.preventDefault();
    S.arrastando = { x: e.clientX, y: e.clientY };
    area.classList.add('arrastando');
  }
});

// a etiqueta do mouse (HUD) é do mouse: o toque (celular) não tem 'passar por cima', e o mousemove que o navegador
// inventa depois de um toque deixaria ela presa na tela. Some com o toque e não volta até o mouse mexer de verdade
let ultimoToque = 0;
document.addEventListener('touchstart', () => { ultimoToque = Date.now(); const hud = $('.hud'); if (hud) hud.hidden = true; }, { passive: true, capture: true });
document.addEventListener('mouseout', e => {   // o mouse saiu da área (ou da janela): a etiqueta some
  const hud = $('.hud');
  if (hud && !hud.hidden && !e.relatedTarget?.closest?.('.area')) hud.hidden = true;
});

document.addEventListener('mousemove', e => {
  if (S.arrastando) {
    const a = areaInfo(), k = a.base * S.zoom;
    S.cx -= (e.clientX - S.arrastando.x) / k;
    S.cy -= (e.clientY - S.arrastando.y) / k;
    S.arrastando = { x: e.clientX, y: e.clientY };
    S.arrastou = true;
    aplicarZoom();
  }
  const area = e.target.closest('.area'), hud = $('.hud');
  if (!hud) return;
  if (Date.now() - ultimoToque < 1500 || e.sourceCapabilities?.firesTouchEvents) { hud.hidden = true; return; }
  if (!area || S.modo !== 'seta' || e.target.closest('.ferramentas, .regua, .aviso-versao')) { hud.hidden = true; return; }
  const m = modeloVisto(), svg = area.querySelector('.desenho');
  const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  const dentro = pt.x >= 0 && pt.y >= 0 && pt.x <= m.placa.w && pt.y <= m.placa.h;
  const alvo = e.target.closest('[data-alvo]')?.dataset.alvo;
  if (!dentro && !alvo) { hud.hidden = true; return; }
  const r = area.getBoundingClientRect();
  hud.hidden = false;
  let simHud = null;
  if (S.ligado && m.simulacao?.pode) try { simHud = simLigado(m); } catch { /* número pendente: o painel já diz qual */ }
  hud.querySelector('.nome-hud').textContent = nomeDoAlvo(m, alvo || 'placa', simHud);
  hud.querySelector('.xy').textContent = `x ${mm(pt.x, 1)}  y ${mm(m.placa.h - pt.y, 1)} mm`;
  // do lado do mouse, sem passar da borda da área: perto da direita (ou de baixo), vai pro outro lado do mouse
  const x = e.clientX - r.left, y = e.clientY - r.top, w = hud.offsetWidth, h = hud.offsetHeight;
  hud.style.left = `${Math.max(8, x + 18 + w <= r.width - 8 ? x + 18 : x - 12 - w)}px`;
  hud.style.top = `${Math.max(8, y + 18 + h <= r.height - 8 ? y + 18 : y - 12 - h)}px`;
});

document.addEventListener('mouseup', () => {
  if (!S.arrastando) return;
  S.arrastando = null;
  $('.area')?.classList.remove('arrastando');
});

document.addEventListener('wheel', e => {
  const area = e.target.closest('.area');
  if (!area || e.target.closest('.regua')) return;
  e.preventDefault();
  const r = area.querySelector('.desenho').getBoundingClientRect();   // o desenho pode começar abaixo do topo da área
  zoomEm(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

document.addEventListener('keydown', e => {
  if (teclaDoPrograma(e)) return;
  if (!PLACA || e.target.closest('input, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') { S.sel = null; $('#versoes').hidden = true; return desenhar(); }
  if (S.aba !== 'projeto') return;
  if (e.key === 'v') { S.modo = 'seta'; desenhar(); }
  if (e.key === 'h') { S.modo = 'mao'; desenhar(); }
  if (e.key === '+' || e.key === '=') zoomEm(1.25);
  if (e.key === '-') zoomEm(0.8);
  if (e.key === '0') { centralizar(); aplicarZoom(); }
  if (e.key === 'l') alternarLigado();
  if (e.key === 'p') alternarPrograma();
});

window.addEventListener('resize', () => { const area = $('.area'); if (area) arrumarFerramentas(area, modeloVisto()); aplicarZoom(); });

if (PLACA) {
  lerDe('/api/placas').then(api => { S.api = !!api; S.apiSabido = true; if (S.api) atualizar(); desenhar(); });
  atualizar();
  setInterval(atualizar, 1000);
  setInterval(() => { if (S.prog.aberto && S.aba === 'projeto') lerPrograma(); }, 1000);   // a régua aberta: o programa novo, ou 'rodando'
} else {   // janela principal: Projetos | Pecas (relê a lista de projetos de vez em quando; as pecas, por clique)
  for (const id of ['voltar', 'direita']) $('#' + id).hidden = true;
  $('#abas').innerHTML = '<button type="button" data-inicio="projetos">Projetos</button><button type="button" data-inicio="pecas">Peças</button>';
  S.inicio = PECAS ? 'pecas' : 'projetos';
  document.title = 'Sianvolt';
  desenharInicio();
  carregarCatalogo().then(desenharInicio);
  setInterval(() => { if (S.inicio === 'projetos') desenharInicio(); }, 5000);
}
</script>
</body>
</html>
