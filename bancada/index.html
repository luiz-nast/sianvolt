  if (ref) info.req = requisitosDa(ref);
  painel.innerHTML = `
    <div class="cab">
      <div><div class="tipo">${esc(info.tipo)}</div><div class="titulo${info.nomePeca ? ' nome-peca' : ''}">${esc(info.titulo)}</div></div>
      <button type="button" class="fechar" data-fechar aria-label="Fechar inspetor"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    ${info.agora ? `<div class="agora${info.agora.includes('QUEIMA') ? ' queima' : ''}">${esc(info.agora)}</div>` : ''}
    ${info.loja?.foto ? `<img class="foto-peca" src="${BASE}pecas/${encodeURIComponent(info.loja.foto)}" alt="Foto da peça">` : ''}
    <div class="explica"><b>O que é isso?</b><p>${esc(info.explica)}</p></div>
    <dl>${info.linhas.map(([k, v, alerta]) => `<dt>${esc(k)}</dt><dd${alerta ? ' class="alerta"' : ''}>${esc(v)}</dd>`).join('')}</dl>
    ${info.linha ? `<div class="origem"><span>Vem de placa.txt, linha ${info.linha}</span><code>${esc(m.linhas[info.linha - 1])}</code></div>` : ''}
    ${info.req ? `<span class="tipo">Requisito: ${esc(info.req)}</span>` : ''}
    ${info.loja ? `<div class="origem"><span>Peça de verdade: ${esc(info.compra || '')}</span><div class="links">
      ${/^https:\/\//.test(info.loja.link || '') ? `<a href="${esc(info.loja.link)}" target="_blank" rel="noopener">Na loja ↗</a>` : ''}
      ${/^https:\/\//.test(info.loja.datasheet || '') ? `<a href="${esc(info.loja.datasheet)}" target="_blank" rel="noopener">Datasheet ↗</a>` : ''}</div></div>` : ''}`;
}

// ---------- painel: mexer na pilha, no resistor e no botao e ver o que acontece ----------
function porModelo(m, modelo) { return m.pecas.filter(p => p.eletrica?.modelo === modelo); }

// ---- ▶ Ligar com o cérebro (ESP32): cada GPIO usado vira uma chave 0/1 na mão; o botão aperta e o LDR ganha a luz ----
// o que o painel mudou: pilha (V), resistor (Ω), chave (apertada), pinos (GPIOn: 0 ou 1), lux (LDR: 0 = escuro), piezo (na virada)
function novosAjustes() { return { pilha: {}, resistor: {}, chave: {}, pinos: {}, lux: {}, piezo: {} }; }
const LUXES = [[0, 'escuro'], [1, '1 lux'], [10, '10 lux'], [100, '100 lux']];   // as luzes da tabelinha do LDR no Carrinho
const NOME_DO_MODELO = { led: 'LED', chave: 'Botão', ldr: 'Olho de luz', piezo: 'Som', capacitor: 'Capacitor' };
const QUEM_MANDA = ['led', 'piezo', 'chave', 'ldr', 'capacitor'];   // a peça do ramo que dá nome ao pino, nesta ordem
const modeloDaPeca = (m, ref) => m.pecas.find(p => p.ref === ref)?.eletrica?.modelo;
// o que o regulador do 3V3 entrega: o 3V3 mais os pinos que fornecem (o que afunda não soma), como o testar.soma_3v3
const soma3v3 = sim => Object.entries(sim?.pecas || {}).reduce((s, [ref, x]) => s + (ref === '~3V3' || ref.startsWith('~GPIO') ? Math.max(x.i, 0) : 0), 0);

// o papel de cada GPIO ligado, tirado do circuito, com a mesma regra da etapa 4 (testar.py, papel_dos_pinos): olha as peças
// no pino e as que vêm depois de UM resistor (ou de dois em série). Chave = 'pullup' ('pullup_fora'/'pulldown_fora' com
// resistor pro 3V3/GND), LDR = 'analogica', LED, piezo ou capacitor = 'saida', direto no 3V3/GND/VIN = 'energia'.
// Sem cérebro, null; com ele, {u, pinos: [{nome, n, net, papel, ramo}]} na ordem em que as peças estão no placa.txt
function pinosDoCerebro(m) {
  const u = m.pecas.find(p => p.eletrica?.modelo === 'mcu');
  if (!u) return null;
  const pecas = Object.fromEntries(m.pecas.map(p => [p.ref, p])), modeloDe = ref => pecas[ref]?.eletrica?.modelo;
  const naNet = {};   // net -> as peças nela, sem o cérebro
  for (const p of m.pecas) if (p !== u) for (const q of p.pinos) if (q.net && !(naNet[q.net] ||= []).includes(p.ref)) naNet[q.net].push(p.ref);
  const energia = Object.fromEntries(['3V3', 'GND', 'VIN'].map(k => [k, new Set(u.pinos.filter(q => q.nome === k && q.net).map(q => q.net))]));
  const todas = new Set(Object.values(energia).flatMap(s => [...s]));
  const resistores = (net, sem) => (naNet[net] || []).filter(x => modeloDe(x) === 'resistor' && x !== sem);
  const outraPonta = (ref, net) => pecas[ref].pinos.map(q => q.net).filter(n => n && n !== net);
  const gpios = u.pinos.filter(q => q.net && /^GPIO\d+$/.test(q.nome || ''));
  const colados = new Set(gpios.filter(q => !todas.has(q.net)).flatMap(q => (naNet[q.net] || []).filter(x => modeloDe(x) === 'ldr')));
  const pinos = gpios.map(q => {
    const g = { nome: q.nome, n: q.n, net: q.net, papel: 'energia', ramo: [] };
    if (todas.has(q.net)) return g;
    const direto = naNet[q.net] || [], chega = new Set();
    g.ramo = [...direto];
    for (const r1 of resistores(q.net)) for (const net of outraPonta(r1, q.net)) {
      chega.add(net);
      if (todas.has(net)) continue;   // o que vai pro 3V3 ou pro GND não leva adiante
      for (const x of naNet[net] || []) if (!g.ramo.includes(x)) g.ramo.push(x);
      for (const r2 of resistores(net, r1)) for (const n of outraPonta(r2, net)) chega.add(n);
    }
    const puxa = k => [...chega].some(n => energia[k].has(n)), tem = k => g.ramo.some(x => modeloDe(x) === k);
    const ldrs = g.ramo.filter(x => modeloDe(x) === 'ldr');
    if (tem('chave')) g.papel = puxa('3V3') ? 'pullup_fora' : puxa('GND') ? 'pulldown_fora' : 'pullup';
    else if (ldrs.some(x => direto.includes(x) || !colados.has(x)) || (ldrs.length && puxa('3V3'))) g.papel = 'analogica';
    else g.papel = ldrs.length || ['led', 'piezo', 'capacitor'].some(k => tem(k)) ? 'saida' : null;
    return g;
  });
  const ordem = g => Math.min(Infinity, ...g.ramo.map(x => m.pecas.findIndex(p => p.ref === x)));
  return { u, pinos: pinos.sort((a, b) => ordem(a) - ordem(b)) };
}

// o estado de cada GPIO pro comPinos: a saída como o painel deixou (começa em 0), o botão com o pull-up de dentro e o
// resto solto (o LDR, o pino só de entrada, o que está direto na energia). Igual à etapa 4, só que o 0 e o 1 são na mão
function estadoDosPinos(c) {
  const so = new Set(c.u.eletrica.so_entrada || []), estado = {};
  for (const g of c.pinos) {
    if (so.has(g.nome)) continue;   // GPIO34 a 39 só leem: nem saída nem pull-up de dentro
    if (g.papel === 'saida') estado[g.nome] = S.ajustes.pinos?.[g.nome] ?? 0;
    else if (g.papel === 'pullup' || g.papel === 'pullup_fora') estado[g.nome] = 'pullup';
  }
  return estado;
}

// os ajustes no formato do simular: o LDR vai em ohms, pela luz escolhida (sem escolha, os 10 lux de sempre do simular).
// cantos: {LDR1: 'min' | 'max'}, o LDR mais claro ou mais escuro que a loja pode mandar (sem canto, o do meio)
function ajustesDoSimular(m, cantos = {}) {
  const aj = S.ajustes, ldr = {};
  for (const p of porModelo(m, 'ldr')) {
    const lux = aj.lux?.[p.ref], canto = cantos[p.ref];
    if (lux != null || canto) ldr[p.ref] = ohmsDoLdr(p.eletrica, lux ?? LUX_PADRAO, canto || 'meio', p.ref);
  }
  return { pilha: aj.pilha, resistor: aj.resistor, chave: aj.chave, piezo: aj.piezo || {}, ldr };
}

// o circuito ligado como o painel deixou; com o cérebro, os pinos viram pilhas de mentira (comPinos). vdd null = o do meio.
// Número pendente na conta (comPinos, ohmsDoLdr) lança Error com a frase de gente, pra mostrar no painel
function simLigado(m, vdd = null, cantos = {}) {
  const c = pinosDoCerebro(m);
  return simular(c ? comPinos(m, estadoDosPinos(c), vdd) : m, ajustesDoSimular(m, cantos));
}

// o modelo com cada LED no vf_min ou no vf_max do datasheet, como o testar.com_vf (LED sem o campo fica no vf típico)
const comVf = (m, campo) => ({ ...m, pecas: m.pecas.map(p => p.eletrica?.modelo === 'led' && positivo(p.eletrica[campo])
  ? { ...p, eletrica: { ...p.eletrica, vf: p.eletrica[campo] } } : p) });
const ouNada = f => { try { return f(); } catch { return null; } };   // conta com número pendente: sem faixa, em vez de chute

// os volts no GPIO do LDR nos cantos, como a etapa 4 (testar.faixa_do_ldr): o LDR mais claro e o mais escuro da loja,
// com o 3V3 no mínimo e no máximo (a ponta pendente fica no do meio). {de, ate, com3v3} ou null
function cantosDoLdr(m, c, g, ldrs) {
  const e = c.u.eletrica, vdds = ['vdd_min', 'vdd_max'].map(k => (positivo(e[k]) ? e[k] : e.vdd));
  const vs = ['min', 'max'].flatMap(canto => vdds.map(v => ouNada(() => simLigado(m, v, Object.fromEntries(ldrs.map(r => [r, canto]))).nets[g.net])));
  if (vs.some(v => v == null)) return null;
  return { de: Math.min(...vs), ate: Math.max(...vs), com3v3: positivo(e.vdd_min) && positivo(e.vdd_max) };
}

// número do cérebro que é estimativa (a fonte diz), e não do datasheet: a tela marca com ~ e diz de onde veio
function estimativa(e, campo) {
  const f = [].concat(e.fontes?.[campo] || []).join(' ');   // a fonte: 'MicroPython quickref ESP32 https://...: ...'
  return /estimativa|suposi[cç]/i.test(f) ? (f.split(/ https?:|: /)[0] || 'uma estimativa') : null;
}

// "LED A (D1)" + "D32 · GPIO32": o apelido do bloco no projeto.json (ou a peça do ramo), o que está escrito no DevKit e o pino
function nomeDoGpio(m, c, g) {
  const b = S.projeto?.blocos?.find(x => x.pino === g.nome && x.apelido && g.ramo.includes(x.ref));
  const principal = QUEM_MANDA.map(k => g.ramo.filter(x => modeloDaPeca(m, x) === k)).find(l => l.length) || [];
  const quem = b?.apelido ? `${b.apelido} (${b.ref})` : principal.map(ref => `${NOME_DO_MODELO[modeloDaPeca(m, ref)]} ${ref}`).join(' e ')
    || (g.papel === 'energia' ? 'direto na energia' : 'sem peça que eu conheça');
  const ser = c.u.serigrafia?.[g.n];
  return { quem, onde: [ser && ser !== g.nome ? ser : null, g.nome].filter(Boolean).join(' · ') };
}

// uma linha por GPIO usado: quem está nele, a chave 0/1 (saída), o botão (entrada), a luz do LDR (analógica) e o que o
// pino lê (preencherPinos). Devolve {html, chaves}: os botões que já têm linha não repetem na lista de baixo
function pinosHTML(m, c) {
  const so = new Set(c.u.eletrica.so_entrada || []), chaves = new Set();
  const linhas = c.pinos.map(g => {
    const { quem, onde } = nomeDoGpio(m, c, g), de = k => g.ramo.filter(x => modeloDaPeca(m, x) === k);
    const cor = de('led').map(ref => bolinha(m.pecas.find(p => p.ref === ref).eletrica.cor)).join('');
    let ctl = '';
    if (g.papel === 'saida') ctl += so.has(g.nome) ? '<span class="sub">só lê: não dá pra ligar daqui</span>'
      : `<div class="escolhas mini" role="group" aria-label="${esc(g.nome)} em 0 ou 1">${[0, 1].map(n => `<button type="button" data-gpio="${esc(g.nome)}" data-nivel="${n}">${n}</button>`).join('')}</div>`;
    for (const ref of de('chave').filter(x => !chaves.has(x))) { chaves.add(ref); ctl += `<button type="button" class="pilula" data-chave="${esc(ref)}"></button>`; }
    if (g.papel === 'analogica') for (const ref of de('ldr')) {
      ctl += `<div class="escolhas mini" role="group" aria-label="Luz no ${esc(ref)}">${LUXES.map(([lux, txt]) => `<button type="button" data-lux="${esc(ref)}" data-valor="${lux}">${txt}</button>`).join('')}</div>`;
    }
    for (const ref of de('piezo')) ctl += `<button type="button" class="pilula" data-piezo="${esc(ref)}"></button>`;
    return `<div class="gpio"><span class="quem">${cor}<b>${esc(quem)}</b><span class="mono">· ${esc(onde)}</span></span>
      ${ctl ? `<div class="controles">${ctl}</div>` : ''}<span class="le" data-le="${esc(g.nome)}"></span></div>`;
  });
  return { chaves, html: `<div class="gpios leitura">${linhas.join('')}</div>` };
}

// o que cada pino faz e lê agora: a saída (quanto dá ou puxa, contra a força padrão do pino), o botão (lê 0 pelo VIL do
// datasheet), o LDR (os volts contra a faixa boa do ADC); e quanto o 3V3 entrega, contra o que sobra dele pras peças
function preencherPinos(m, c, sim, q) {
  const e = c.u.eletrica, aj = S.ajustes, vdd = e.vdd, so = new Set(e.so_entrada || []);
  const todos = sel => document.querySelectorAll('aside.painel ' + sel);
  for (const b of todos('[data-gpio]')) b.setAttribute('aria-pressed', +b.dataset.nivel === (aj.pinos[b.dataset.gpio] ?? 0));
  for (const b of todos('[data-lux]')) b.setAttribute('aria-pressed', +b.dataset.valor === (aj.lux[b.dataset.lux] ?? LUX_PADRAO));
  for (const b of todos('[data-piezo]')) {
    const fio = !!aj.piezo[b.dataset.piezo];
    b.setAttribute('aria-pressed', fio);
    b.textContent = `Som ${b.dataset.piezo} · ${fio ? 'na virada do apito' : 'parado'}`;
  }
  const vil = positivo(e.vil) ? e.vil * vdd : null;   // vil é fração do 3V3 (DS v5.3, Tabela 5-3)
  const adc = positivo(e.adc_min) && positivo(e.adc_max);
  for (const g of c.pinos) {
    const el = q(`[data-le="${g.nome}"]`), v = sim?.nets[g.net], de = k => g.ramo.filter(x => modeloDaPeca(m, x) === k);
    if (!el) continue;
    if (v == null) { el.textContent = '?'; el.className = 'le'; continue; }
    const partes = [`${mm(v, 2)} V no pino`];
    let classe = '';
    if (g.papel === 'saida' && !so.has(g.nome)) {
      const i = sim.pecas['~' + g.nome]?.i ?? 0;
      partes[0] = `em ${aj.pinos[g.nome] ?? 0}: ${partes[0]}`;
      partes.push(Math.abs(i) < 1e-6 ? 'não passa corrente' : `${i > 0 ? 'dá' : 'puxa'} ${mA(Math.abs(i))} mA`);
      if (positivo(e.i_pino) && Math.abs(i) > e.i_pino) { partes.push(`passa da força padrão do pino (~${mA(e.i_pino)} mA)`); classe = 'queima'; }
      for (const ref of de('piezo')) {
        const r = sim.pecas[ref];
        partes.push(r?.fio ? `${ref} na virada do apito: ${mA(Math.abs(r.i))} mA` : `${ref} parado: não passa corrente`);
      }
    } else if (g.papel === 'analogica') {   // o veredito vale nos cantos, como a etapa 4 e o Carrinho (o LDR do meio só não basta)
      const cantos = cantosDoLdr(m, c, g, de('ldr'));
      if (cantos) partes[0] += ` (de ${mm(cantos.de, 2)} a ${mm(cantos.ate, 2)} V nos cantos do LDR${cantos.com3v3 ? ' e do 3V3' : '; a faixa do 3V3 está pendente'})`;
      for (const ref of de('ldr')) if (sim.pecas[ref]) partes.push(`${ref} com ${ohmsCurto(sim.pecas[ref].ohms)}`);
      if (adc) {
        const faixa = `da faixa boa do ADC (${mm(e.adc_min, 2)} a ${mm(e.adc_max, 2)} V)`, na = x => x >= e.adc_min && x <= e.adc_max;
        const meio = na(v), todos = cantos ? na(cantos.de) && na(cantos.ate) : meio;
        // fora da faixa o número sai torto, mas não troca de lado: o pino acima da faixa continua lendo alto (e abaixo,
        // baixo). Com o LDR no GND (o divisor da luz noturna), alto é escuro; com ele no 3V3, alto é claro
        const lado = ladoDoLdr(c, m, de('ldr')), alto = v > e.adc_max;
        const quer = lado == null ? '' : `, e ${alto ? 'alto' : 'baixo'} aqui quer dizer ${alto === (lado === 'gnd') ? 'escuro' : 'claro'}`;
        partes.push(todos ? `dentro ${faixa}${cantos ? ', até nos cantos' : ''}` : meio ? `fora ${faixa} em algum canto: com o LDR que vier, a leitura pode sair torta`
          : `${alto ? 'acima' : 'abaixo'} ${faixa}: o número que o ADC lê sai torto (menos exato), mas continua ${alto ? 'alto' : 'baixo'}${quer}`);
        classe = todos ? 'ok' : 'fora';
      }
    } else if (g.papel === 'pullup' && so.has(g.nome)) {   // GPIO34 a 39: sem pull-up de dentro, o botão solto deixa o pino no ar
      partes.push('este pino não tem pull-up de dentro: com o botão solto, ele fica no ar e lê qualquer coisa');
      classe = 'fora';
    } else if (['pullup', 'pullup_fora', 'pulldown_fora'].includes(g.papel)) {
      if (vil !== null && v <= vil) partes.push(`lê 0 (até ${mm(vil, 2)} V o pino lê 0)`);
      else if (Math.abs(v - vdd) < 0.005) partes.push('no 3V3: lê 1');
      else if (g.papel === 'pulldown_fora')   // no pull-down, apertado é pra ler 1: não é problema, só falta o número
        partes.push(`${vil !== null ? `não lê 0 (até ${mm(vil, 2)} V o pino lê 0)` : 'o VIL está pendente'}; se ele lê 1 depende do VIH (onde o pino passa a ler 1), que está pendente`);
      else if (vil !== null) { partes.push(`não chega a ler 0 (até ${mm(vil, 2)} V o pino lê 0)`); classe = 'fora'; }
    } else partes.push(g.papel === 'energia' ? 'ligado direto na energia: fica solto (nunca vire saída)' : 'fica solto: o pino só lê');
    el.textContent = partes.join(' · ');
    el.className = `le ${classe}`;
  }
  const b = q('[data-soma-3v3]'), soma = soma3v3(sim), orc = positivo(e.orcamento_3v3) ? e.orcamento_3v3 : null;
  if (b) {
    b.textContent = `${mA(soma)} mA${orc ? ` de ~${mA(orc)} mA que sobram pras peças` : ' (o que sobra pras peças está pendente)'}`;
    b.className = orc && soma > orc ? 'queima' : 'ok';
  }
}

// o LDR do pino do ADC liga a outra ponta no GND ('gnd': no escuro a tensão sobe) ou no 3V3 ('3v3': no escuro ela
// desce)? null se não dá pra dizer (mais de um LDR, ou nenhum dos dois)
function ladoDoLdr(c, m, ldrs) {
  if (ldrs.length !== 1) return null;
  const nets = m.pecas.find(p => p.ref === ldrs[0])?.pinos.map(q => q.net) || [];
  const de = nome => c.u.pinos.filter(q => q.nome === nome && q.net).map(q => q.net);
  return nets.some(n => de('GND').includes(n)) ? 'gnd' : nets.some(n => de('3V3').includes(n)) ? '3v3' : null;
}

// a conta de cada LED no pino, como a da pilha: (pino − LED) ÷ (resistor + pino). Só no caso clássico:
// GPIO → um resistor → + do LED, e o − dele no GND do cérebro
function contasDosPinos(m, c, sim) {
  const e = c.u.eletrica, aj = S.ajustes, linhas = [];
  const peca = ref => m.pecas.find(p => p.ref === ref), netDe = (p, n) => p.pinos.find(q => q.n === n)?.net;
  const gnd = c.u.pinos.filter(q => q.nome === 'GND' && q.net).map(q => q.net);
  for (const g of c.pinos) {
    const leds = g.ramo.map(peca).filter(p => p.eletrica?.modelo === 'led'), rs = g.ramo.map(peca).filter(p => p.eletrica?.modelo === 'resistor');
    if (g.papel !== 'saida' || leds.length !== 1 || rs.length !== 1) continue;
    const [led, r] = [leds[0], rs[0]], [mais, menos] = polos(led.eletrica), nets = r.pinos.map(q => q.net);
    if (!gnd.includes(netDe(led, menos)) || !nets.includes(g.net) || !nets.includes(netDe(led, mais))) continue;
    const x = sim.pecas[led.ref], nivel = aj.pinos[g.nome] ?? 0, v = e.vdd, ohms = aj.resistor[r.ref] ?? r.valor, j = joelho(led.eletrica);
    const rPino = `${estimativa(e, 'r_pino') ? '~' : ''}${e.r_pino}`;   // ~: estimativa, não datasheet (o rodapé diz de onde)
    // o LED com as casas que fazem a conta fechar na mão (2; 3 ou 4 quando o arredondamento cai na beirada do mA mostrado)
    const passo = Math.abs(x?.i ?? 0) >= 0.0095 ? 1e-3 : 1e-4, fecha = k => {
      const q = (v - +(x.v.toFixed(k))) / (ohms + e.r_pino) / passo;
      return Math.abs(q - Math.round(q)) < 0.45 && Math.round(q) === Math.round(x.i / passo);
    };
    linhas.push(`${led.ref}: ` + ((e.so_entrada || []).includes(g.nome) ? `o ${g.nome} só lê: ele não tem saída pra acender o LED`
      : !nivel ? `o ${g.nome} está em 0 (0 V): nada empurra a corrente e o LED fica apagado`
      : x?.i > 1e-6 ? `corrente = (pino − LED) ÷ (resistor + pino) = (${volts(v)} − ${mm(x.v, [2, 3, 4].find(fecha) ?? 4)}) ÷ (${ohms} + ${rPino}) = ${mA(x.i)} mA`
      : v <= j ? `o pino (${volts(v)} V) não passa dos ${volts(j)} V que o LED pede pra começar: ele fica apagado`
      : 'o circuito está aberto: a corrente não tem por onde passar'));
  }
  return linhas;
}

// em letra pequena: o 3V3 de verdade (a faixa e a condição dela) e o que falta conferir nas peças (a porta USB...)
function rodapeDoCerebro(m, u) {
  const e = u.eletrica, porTexto = {};
  for (const p of m.pecas) for (const t of p.eletrica?.pendentes || []) (porTexto[t] ||= []).push(p.ref);
  const faixa = positivo(e.vdd_min) && positivo(e.vdd_max) ? `3V3 de verdade: de ${mm(e.vdd_min, 3)} a ${mm(e.vdd_max, 3)} V (a conta usa ${volts(e.vdd)} V)`
    : `a faixa do 3V3 está pendente (a conta usa ${volts(e.vdd)} V)`;
  // os números das contas do painel que são estimativa (a fonte deles diz), se o pendentes da peça ainda não fala deles
  const chutes = ['r_pino', 'r_pull', 'r_3v3'].filter(k => positivo(e[k]) && estimativa(e, k) && !(e.pendentes || []).some(t => t.startsWith(k + ':')))
    .map(k => `${k}: ${k === 'r_pino' ? '~' : ''}${ohmsTxt(e[k])} é estimativa (${estimativa(e, k)}), não vem do datasheet`);
  return `<div class="pendentes"><span class="sub">${esc(faixa)}${e.condicao_3v3 ? `; ${esc(e.condicao_3v3)}` : ''}.</span>
    ${Object.entries(porTexto).map(([t, refs]) => pendenteHTML(refs.join() === u.ref ? t : `${refs.join(', ')} · ${t}`)).join('')}${chutes.map(pendenteHTML).join('')}</div>`;
}

// a faixa verde de um LED no pino do cérebro, com as palavras da etapa 4: de (vf_max) a (vf_min) no 3V3 do meio, e o pior
// caso (vf_min e o 3V3 máximo). e: a eletrica do LED; u: a do cérebro. A ponta sem vf no datasheet fica no vf típico, e diz
function faixaNoPino(e, u, iDe, iAte, iPior) {
  if (Math.max(iDe, iAte) < 1e-6) return 'nenhuma agora, o LED está apagado';
  const falta = ['vf_min', 'vf_max'].filter(k => !positivo(e[k])), nome = { vf_min: 'vf mínimo', vf_max: 'vf máximo' };
  const faixa = falta.length === 2 ? `${mA(iAte)} mA com ${volts(u.vdd)} V e o vf típico (o vf mínimo e o máximo do LED estão pendentes)`
    : `de ${mA(Math.min(iDe, iAte))} a ${mA(Math.max(iDe, iAte))} mA com ${volts(u.vdd)} V, cada LED sai um pouco diferente`
      + (falta.length ? ` (o ${nome[falta[0]]} do LED está pendente: essa ponta fica no vf típico)` : '');
  return faixa + (iPior != null ? `; até ${mA(iPior)} mA no pior caso, com o 3V3 em ${mm(u.vdd_max, 3)} V` : '');
}

    ${comCerebro ? comCerebro.html : ''}
    ${soltas.length ? `<div class="chaves">${soltas.map(p => `<button type="button" class="pilula" data-chave="${esc(p.ref)}"></button>`).join('')}</div>` : ''}

      <div class="barra"><i class="faixa-b" data-faixa="${esc(p.ref)}"></i><i class="faixa-q" data-faixa-q="${esc(p.ref)}"></i><i class="teste" data-teste="${esc(p.ref)}"></i><i class="limite" data-limite="${esc(p.ref)}"></i><i class="marca" data-marca="${esc(p.ref)}"></i></div>
