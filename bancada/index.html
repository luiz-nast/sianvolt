// ---- passos 6 e 7 com o DevKit: o que conferir antes de pedir e como soldar as barras sem estragar
// antes de pedir, só o que se confere sem solda (a régua, a folha em 1:1); o que fala de solda é da montagem
const antesDePedir = t => !/\bsold/i.test(t);
function confiraHTML(p, titulo, filtro = () => true) {
  return `<div class="confira"><b>${esc(titulo)}</b><ol>${p.confira.filter(filtro).map(t => `<li>${esc(t)}</li>`).join('')}</ol>
    <div class="links"><a href="${BASE}saida/imprimir_1x1.svg" target="_blank" rel="noopener">Folha pra imprimir em 1:1, com a régua de 50 mm ↗</a></div></div>`;
}
const LIGA_SEMPRE = ['GND', '3V3', 'VIN'];   // os pinos de energia contam como ligados, mesmo sem trilha (uma ponte neles é curto)
function fileirasDe(p) {   // os pinos de cada fileira do DevKit, da esquerda pra direita
  const por = {};
  for (const q of p.pinos) (por[Math.round(q.y * 10)] ||= []).push(q);
  return Object.values(por).map(f => f.sort((a, b) => a.x - b.x));
}
function montarComDevkitHTML(p, pj, m, ordem) {
  const ser = q => p.serigrafia?.[q.n] || q.nome || q.n;
  const naoSolda = q => /não soldar/i.test(p.cuidados?.[q.n] || '');
  const lado = q => q.net || (LIGA_SEMPRE.includes(q.nome) ? q.nome : null);
  const fileiras = fileirasDe(p), achados = [];
  for (const f of fileiras) for (let i = 1; i < f.length; i++) {
    const [a, b] = [f[i - 1], f[i]].sort((x, y) => +x.n - +y.n);
    if (lado(a) && lado(b) && lado(a) !== lado(b))
      achados.push({ energia: [a, b].some(q => LIGA_SEMPRE.includes(q.nome)), n: +a.n, txt: `${a.n}–${b.n} (${ser(a)} e ${ser(b)})` });
  }
  const pares = achados.sort((x, y) => y.energia - x.energia || x.n - y.n).map(x => x.txt);   // os de energia primeiro
  const pontas = fileiras.map(f => f.filter(q => !naoSolda(q))).filter(f => f.length > 1)
    .map(f => [f[0].n, f.at(-1).n].sort((x, y) => x - y).join(' e ')).join('; ');
  const semSolda = p.pinos.filter(naoSolda), ligados = semSolda.filter(q => q.net);
  const barras = pj?.blocos.find(b => b.bloco === 'cerebro')?.acompanha || p.acompanha || [];
  const calor = barras.flatMap(a => [a, a.alternativa_peca || (a.alternativa ? { codigo: a.alternativa } : null)]).filter(Boolean).map(a => {
    const conhecida = SOLDA_DA_BARRA[a.codigo];   // o número do /api/projeto vale primeiro; senão, o do desenho anotado aqui
    const s = a.mecanica?.solda_max_c ? { c: a.mecanica.solda_max_c, s: a.mecanica.solda_max_s, marca: conhecida?.marca, fonte: a.mecanica.fonte }
      : conhecida;
    if (!s) return null;
    const fonte = esc(s.fonte || 'o desenho do fabricante');
    return `${esc(`${s.marca ? `${s.marca} ` : ''}${a.codigo}`)}, ${s.c}&nbsp;°C por ${s.s}&nbsp;s (${/^https:\/\//.test(a.datasheet || '')
      ? `<a href="${esc(a.datasheet)}" target="_blank" rel="noopener">${fonte} ↗</a>` : fonte})`;
  }).filter(Boolean);
  const temLdr = pj?.blocos.some(b => b.bloco === 'ldr') || m.pecas.some(x => x.eletrica?.modelo === 'ldr');
  const pasta = `placas/${PLACA}/codigo/`;
  // tem programa? A etapa "Roda o programa" só existe com o codigo/main.py; sem os testes, não dá pra saber (null)
  const programa = S.testes?.etapas ? S.testes.etapas.some(e => /programa/i.test(e.nome)) : null;
  const copiar = 'dentro dessa pasta: <code>mpremote cp main.py pinos.py :</code> (o <code>pinos.py</code> é gerado pelo Sianvolt: não edite)';
  return `<p>Quando a placa e as peças chegarem:</p>
    <ol class="montar">
      <li>Solde as peças pequenas primeiro, da menor pra maior (${esc(ordem.join(', '))}), e as barras do DevKit por último.</li>
      <li><b>O lado da barra:</b> as barras fêmea entram por cima, no lado do desenho do DevKit (a serigrafia), e a solda fica embaixo.</li>
      <li><b>Solde com o DevKit encaixado:</b> ponha as duas barras nos furos e encaixe o DevKit nelas antes de soldar, assim elas ficam retas e na distância certa. Solde primeiro as pontas de cada barra (pinos ${esc(pontas)}), confira que ficou reto e só então o resto, pulando de um pino pra outro longe dele.</li>
      <li><b>Pouco calor:</b> encoste o ferro só o tempo de a solda escorrer pelo pino, uns 2 a 3 s, e passe pro próximo. ${calor.length ? `O máximo que o desenho da barra aguenta: ${calor.join('; ')}.` : ''}
        ${pendenteHTML('2 a 3 s por pino: é costume de quem solda, sugerido na revisão do plano; falta uma fonte (datasheet ou norma) pra esse tempo. O limite com fonte é o do desenho da barra')}</li>
      ${calor.length ? '' : `<li>${pendenteHTML('temperatura da barra: falta conferir no desenho dela quanto calor ela aguenta')}</li>`}
      ${semSolda.length ? `<li><b>${esc(semSolda.map(q => `${ser(q)} (pino ${q.n})`).join(', '))}: não soldar.</b> ${ligados.length
        ? `<span class="nao-bate">✗ Mas a placa liga ${esc(ligados.map(ser).join(', '))}: peça pro Claude tirar essa ligação.</span>`
        : `Nenhuma peça desta placa usa ${semSolda.length > 1 ? 'esses pinos' : 'esse pino'}, e um pino a menos soldado é uma ponte de solda a menos.`}</li>` : ''}
      <li><b>Procure ponte de solda</b>, com o DevKit fora: a lupa do celular em cada fileira e o multímetro na continuidade (o bip) entre ${esc(pares.join(', ') || 'cada par de pinos vizinhos')}. Nenhum desses pares pode bipar.</li>
      <li><b>Nunca encaixe nem tire o DevKit com o USB ligado.</b></li>
      <li><b>Cabo de dados:</b> o cabo micro-USB que só carrega não faz a porta do DevKit aparecer no computador.</li>
      <li><b>Grupo dialout (quem faz é você):</b> no Linux, a porta do DevKit (<code>/dev/ttyUSB0</code>) só abre pra quem está no grupo dialout. É configuração do sistema: <code>sudo usermod -aG dialout $USER</code>, e depois saia e entre de novo na sessão.</li>
      <li><b>Grave o MicroPython ${MICROPYTHON}</b> no DevKit com o esptool, como diz a <a href="https://micropython.org/download/ESP32_GENERIC/" target="_blank" rel="noopener">página oficial ↗</a>: primeiro apaga (<code>esptool.py erase_flash</code>), depois grava o .bin baixado (<code>esptool.py --baud 460800 write_flash 0x1000 &lt;o .bin&gt;</code>).</li>
      <li><b>Copie o programa:</b> ${programa === false
        ? `esta placa ainda não tem programa (falta o <code>main.py</code> em <code>${esc(pasta)}</code>). Quando tiver, o Sianvolt gera o <code>pinos.py</code> do lado dele e é só copiar os dois, ${copiar}.`
        : `o <code>main.py</code> e o <code>pinos.py</code> ficam em <code>${esc(pasta)}</code>${programa ? '' : ' (quando a placa tiver programa)'}. ${comMaiuscula(copiar)}.`}</li>
      ${temLdr ? '<li><b>Se a luz não acender no escuro,</b> cubra o LED vermelho do DevKit com fita isolante preta: o olho de luz pode estar vendo ele.</li>' : ''}
    </ol>
    ${p.confira?.length ? confiraHTML(p, 'Confira') : ''}
    <p>Antes disso, dá pra ensaiar no ▶ da aba Projeto.</p>`;
}

function desenharProcesso(main) {
  const m = S.modelo, t = S.testes, obj = t?.objetivo, c = S.cotacao, pj = S.projeto;
  const reqs = obj?.itens || [];
  const falha = t && !t.rodando && t.etapas.find(e => e.estado === 'falhou');
  const ocupado = S.mexendo || t?.rodando;

  // 1. objetivo: o que a placa faz e o que a gente quer dela
  const listaReqs = reqs.length ? `<ul class="reqs">${reqs.map(i => `<li class="${i.status === 'ok' ? 'ok' : 'falha'}">${i.status === 'ok' ? '✓' : '✗'} ${esc(i.id)} ${esc(i.titulo)}${i.status === 'ok' ? '' : ` · ${esc(i.motivo)}`}</li>`).join('')}</ul>` : '';
  // a cor de cada LED (a da peça do carrinho, que é a que acende; sem peça, a pedida), pras bolinhas e pros ícones
  const porLedDaCor = Object.fromEntries(((pj?.perguntas || []).find(q => q.id === 'cor')?.por_led || []).map(x => [x.ref, x]));
  const corDe = ref => porLedDaCor[ref]?.da_peca || porLedDaCor[ref]?.resposta;
  const perguntas = (pj?.perguntas || []).map(q => {
    if (q.id === 'cor') return corPorLedHTML(q);   // a cor é sempre de um LED: sem botão geral
    const escolhida = q.opcoes.find(o => o.id === q.resposta);
    const quem = q.por_led ? ` · a resposta geral: ${esc(quemDecidiu(q.quem))}${q.quem && q.quem !== 'Luiz' ? ', clique pra mudar' : ''}`
      : q.quem && q.quem !== 'Luiz' ? ` · ${esc(q.quem)}, clique pra mudar` : '';
    return `<div class="pergunta"><span class="pergunta-txt">${esc(q.texto)}</span>
      <div class="escolhas" role="group" aria-label="${esc(q.texto)}">${q.opcoes.map(o => `<button type="button" data-responder="${esc(q.id)}" data-resposta="${esc(o.id)}" aria-pressed="${q.resposta === o.id}" ${ocupado ? 'disabled' : ''}>${esc(o.nome)}</button>`).join('')}</div>
      <span class="sub">${escolhida ? esc(escolhida.explica) : 'Escolha uma: é daqui que sai o resistor.'}${quem}</span>${q.por_led ? brilhoPorLedHTML(q, pj, corDe) : ''}</div>`;
  }).join('');
  const titulo = pj?.objetivo || obj?.titulo || PLACA, frase = pj?.frase || obj?.texto;
  const p1 = passo(1, reqs.length && reqs.every(i => i.status === 'ok') && (pj?.perguntas || []).every(q => q.respondida ?? q.resposta) ? 'ok' : 'falha', 'Objetivo', `
      <p class="destaque">${esc(titulo)}</p>${frase ? `<p>${esc(frase)}</p>` : ''}
      ${perguntas}
      ${obj?.erro ? `<p class="erro-req">${esc(obj.erro)}</p>` : ''}
      ${listaReqs}${reqs.length ? '<button type="button" class="link" data-aba="thinking">Ver os requisitos →</button>' : ''}`);

  // 2. blocos: o tipo de cada peca, sem numero ainda
  let p2, p3;
  if (pj) {
    const classica = pj.blocos.map(b => b.bloco).join() === 'pilha,botao,resistor,led';
    const comCerebro = pj.blocos.some(b => b.bloco === 'cerebro');
    p2 = comCerebro ? passo(2, 'ok', 'Blocos', `
      <p>Antes de qualquer número: que tipo de peça faz cada parte do trabalho. O cérebro fica no meio: cada ramo sai de um pino dele, passa pelo freio e volta pro GND${pj.blocos.some(b => b.bloco === 'ldr') ? ' (o olho de luz pega a força no 3V3 do cérebro)' : ''}.</p>
      ${estrelaHTML(pj, corDe)}
      <ul class="tipos-de-bloco">${[...new Map(pj.blocos.map(b => [b.bloco, b])).values()].map(b => `<li><b>${esc(b.nome)}</b> (${esc(minusculo(b.funcao))}): ${esc(b.por_que)}</li>`).join('')}</ul>`)
      : passo(2, 'ok', 'Blocos', `
      <p>Antes de qualquer número: que tipo de peça faz cada parte do trabalho.${classica ? ' A corrente sai do + da pilha, passa pelos blocos nessa ordem e volta pelo −.' : ''}</p>
      <div class="cadeia">${pj.blocos.map((b, i) => `${i ? '<span class="seta" aria-hidden="true">→</span>' : ''}<div class="bloco">
        <span class="icone">${icone(b.bloco)}</span><span class="funcao">${esc(b.funcao)}</span><b>${esc(b.nome)}</b>
        <span class="por-que">${esc(b.por_que)}</span></div>`).join('')}</div>`);

    // 3. carrinho: uma peca de verdade da loja pra cada bloco
    const itens = pj.blocos.map(b => {
      const pc = b.peca, cor = porLedDaCor[b.ref];
      const alvo = pj.blocos.find(x => x.ref === (b.led || b.para));   // o bloco que o resistor atende
      const avisos = [];
      if (!pc) avisos.push('Ainda sem peça: clique em Escolher.');
      if (pc?.pendente?.length) avisos.push(`Falta o Claude conferir no datasheet: ${pc.pendente.join('; ')}.`);
      if (pc && b.na_placa === false) avisos.push('Ainda não está na placa: peça pro Claude pôr.');
      if (cor?.bate === false) avisos.push(`Você pediu ${cor.resposta}, mas esta peça é ${cor.da_peca}: troque o LED ou a cor.`);
      const custa = pc?.moeda && pc.moeda !== 'USD' ? `${preco(pc.preco, pc.moeda)} na ${esc(pc.loja || 'loja')}` : `${dolar(pc?.preco)} cada`;
      return `<li class="item">${fotoDa(pc)}<div class="info">
        <span class="sub">${esc(b.ref)} · ${esc(b.funcao)} · ${esc(b.nome)}${b.apelido ? ` · ${esc(b.apelido)}` : ''}</span>
        <b>${esc(pc?.nome || 'falta escolher')}</b>
        ${pc ? `<span class="sub">${esc(pc.marca)} ${esc(pc.modelo)} · ${esc(pc.tamanho)}</span>
        <span class="sub">${custa} · ${milhar(pc.estoque)} em estoque${b.quem ? ` · ${esc(b.quem === 'Luiz' ? 'você escolheu' : b.quem)}` : ''}</span>` : ''}
        ${b.pino ? `<span class="sub">${esc(noPinoTxt(b))}</span>` : ''}
        ${avisos.map(a => `<span class="aviso">${esc(a)}</span>`).join('')}
        ${(pc?.avisos || []).map(pendenteHTML).join('')}
        ${pc?.condicao_3v3 ? `<span class="sub">3V3 de verdade: ${esc(pc.condicao_3v3)}.</span>` : ''}
        ${b.acompanha?.length ? acompanhaHTML(b.acompanha) : ''}
        ${b.bloco === 'resistor' ? contaHTML(b.conta, pc, alvo) : ''}
        <div class="links">${pc?.datasheet ? `<a href="${esc(pc.datasheet)}" target="_blank" rel="noopener">Datasheet ↗</a>` : ''}
          ${/^https:\/\//.test(pc?.link || '') ? `<a href="${esc(pc.link)}" target="_blank" rel="noopener">Na loja ↗</a>` : ''}
          <button type="button" data-trocar="${esc(b.ref)}" aria-expanded="${!!S.opcoes[b.ref]}">${S.opcoes[b.ref] ? 'Fechar opções' : pc ? 'Trocar' : 'Escolher'}</button></div>
        </div>${opcoesHTML(b.ref)}</li>`;
    }).join('');
    const extras = [...new Set(pj.blocos.flatMap(b => b.peca?.extras || []))];
    // cheio: toda peça escolhida, conferida e na placa; toda conta fechando (sem falta, possível, dentro da força do pino) e a cor batendo
    const cheio = pj.blocos.every(b => b.peca && !b.peca.pendente.length && b.na_placa !== false)
      && pj.blocos.every(b => b.conta?.bate !== false && !b.conta?.falta && !b.conta?.impossivel && !b.conta?.passa_do_pino)
      && Object.values(porLedDaCor).every(x => x.bate !== false);
    p3 = passo(3, cheio ? 'ok' : 'falha', 'Carrinho', `
      <p>Uma peça de verdade, que a loja tem em estoque, pra cada bloco. O desenho dela na placa é o oficial do fabricante, não um chute.</p>
      ${S.recado ? `<p class="aviso">${esc(S.recado)}</p>` : ''}
      <ul class="carrinho">${itens}</ul>
      ${totalHTML(pj, extras)}`);
  } else {
    // placa de antes da ordem nova: sem projeto.json, mostra a lista de compras antiga
    const compras = m?.compras || [];
    p2 = passo(2, 'pendente', 'Blocos', '<p>Esta placa é de antes da ordem nova: ainda não tem os blocos (<span class="mono">projeto.json</span>).</p>');
    p3 = passo(3, 'pendente', 'Carrinho', m ? `<p>Peças desta placa, ainda sem loja:</p>
      <ul class="compras">${compras.map(x => `<li><span class="mono">${esc(x.ref)}</span><b>${esc(x.nome)}</b>${x.valor ? `<span>${esc(x.valor)} Ω</span>` : ''}${x.compra ? `<span class="sub">${esc(x.compra)}</span>` : ''}</li>`).join('')}</ul>` : '<p>Aparece quando a placa for gerada.</p>');
  }

  // 4. placa: as pecas do carrinho, posicionadas
  const versoes = [...S.versoes].reverse();
  const forafora = pj ? pj.blocos.filter(b => b.peca && b.na_placa === false).map(b => b.ref) : [];
  const p4 = m ? passo(4, forafora.length ? 'falha' : 'ok', 'Placa', `<div class="placa-resumo">${miniatura(m)}<div style="display:flex;flex-direction:column;gap:10px">
      <span class="sub mono">${mm(m.placa.w, 0)} × ${mm(m.placa.h, 0)} mm · ${m.pecas.length} peças · ${new Set(m.trilhas.map(t => t.de + '>' + t.ate)).size} ligações${m.vias?.length ? ` · ${m.vias.length} vias` : ''}</span>
      ${forafora.length ? `<span class="aviso">A placa ainda usa a peça antiga de ${esc(forafora.join(', '))}.</span>` : ''}
      <ol class="versoes-lista">${versoes.map(v => `<li><span class="mono">v${v.v}</span> ${esc(v.frase)} <span class="sub">· ${esc(v.quando)}</span></li>`).join('')}</ol>
      <button type="button" class="link" data-aba="projeto">Abrir a placa →</button></div></div>`)
    : passo(4, 'pendente', 'Placa', '<p>Ainda não foi gerada.</p>');

  // 5. testes
  const rodar = S.api ? '<button type="button" class="link" data-rodar>Rodar os testes de novo ↻</button>' : '';
  let p5 = passo(5, 'pendente', 'Testes', `<p>Ainda não rodou.</p><div class="links">${rodar}</div>`);
  if (t) {
    const texto = t.rodando ? 'Rodando agora…'
      : falha ? `Parou na etapa ${t.etapas.indexOf(falha) + 1}, ${esc(falha.nome.toLowerCase())}: ${esc(traduz(m, falha.detalhe))}`
      : `As ${t.etapas.length} etapas passaram: ${t.etapas.map(e => e.nome.toLowerCase()).join(', ')}.`;
    p5 = passo(5, t.rodando ? 'rodando' : falha ? 'falha' : 'ok', 'Testes', `<p>${texto}</p>
      ${!t.rodando && t.resumo ? `<div class="explica"><b>Resumo do Claude</b><p>${esc(t.resumo)}</p></div>` : ''}
      <div class="links"><button type="button" class="link" data-aba="testes">Ver as etapas →</button>${rodar}</div>`);
  }

  // 6. fabrica
  let corpo6 = '<p>Ainda não foi gerada.</p>', estado6 = 'pendente';
  const travas = m?.fabrica ? [...(m.fabrica.falta_datasheet || []), ...(m.fabrica.falta_conferir || [])] : [];
  if (m?.fabrica && !m.fabrica.pronta) {
    corpo6 = `<p>O <span class="mono">fabrica.zip</span> fica travado enquanto tiver peça sem datasheet conferido: ${esc(travas.join(', '))}.</p>`;
  } else if (m?.fabrica && (falha || !t || t.rodando)) {
    corpo6 = '<p>O <span class="mono">fabrica.zip</span> sai quando todos os testes passarem.</p>';
  } else if (m?.fabrica) {
    corpo6 = `<p>O <span class="mono">fabrica.zip</span> está pronto: contorno, cobre de cima e de baixo, máscara, serigrafia e os furos com e sem cobre.</p>
      <div class="links"><a class="link" href="${BASE}saida/fabrica.zip" download>Baixar fabrica.zip ↓</a></div>`;
  }
  const devkit = m?.pecas.find(p => p.confira?.length && p.eletrica?.modelo === 'mcu');   // a peça que encaixa: o DevKit
  if (devkit) corpo6 += confiraHTML(devkit, 'Confira antes de pedir', antesDePedir);
  if (c) {
    const antiga = cotacaoAntiga(c, m);
    estado6 = antiga ? estado6 : 'ok';
    corpo6 += `<div class="cotacao"><dl>
        <dt>Site</dt><dd>${esc(c.site)}</dd><dt>Situação</dt><dd>${esc(c.situacao)}${antiga ? ` · era a v${esc(c.versao)}; a placa mudou depois, cotar de novo` : ''}</dd>
        ${c.detectou ? `<dt>A fábrica leu</dt><dd>${esc(c.detectou)}</dd>` : ''}
        ${c.preco ? `<dt>Preço</dt><dd>${esc(c.preco)}</dd>` : ''}
        <dt>Quando</dt><dd>${esc(c.quando)}${c.versao ? ` · v${esc(c.versao)}` : ''}</dd></dl>
      ${c.imagem ? `<a href="${BASE}${esc(c.imagem)}" target="_blank" rel="noopener"><img src="${BASE}${esc(c.imagem)}" alt="Cotação no site da ${esc(c.site)}"></a>` : ''}
      ${/^https:\/\//.test(c.url || '') ? `<a class="link" href="${esc(c.url)}" target="_blank" rel="noopener">Abrir o site da ${esc(c.site)} ↗</a>` : ''}</div>`;
  }
  const p6 = passo(6, estado6, 'Fábrica', corpo6);

  // 7. montar
  const nomeDe = ref => pj?.blocos.find(b => b.ref === ref)?.nome.toLowerCase() || ref;
  const ordem = m ? [...m.pecas].sort((a, b) => a.corpo.w * a.corpo.h - b.corpo.w * b.corpo.h).map(p => nomeDe(p.ref)) : [];
  const p7 = passo(7, 'pendente', 'Montar e acender', devkit   // com o DevKit: as barras, a ponte de solda e a gravação do programa
    ? montarComDevkitHTML(devkit, pj, m, [...new Set([...m.pecas].filter(p => p !== devkit)
      .sort((a, b) => a.corpo.w * a.corpo.h - b.corpo.w * b.corpo.h).map(p => minusculo(pj?.blocos.find(b => b.ref === p.ref)?.nome || p.nome || p.ref)))])
    : m ? `<p>Quando a placa e as peças chegarem: solde do menor pro maior (${esc(ordem.join(', '))}), ponha a pilha e aperte o botão. Antes disso, dá pra ensaiar no ▶ da aba Projeto.</p>`
    : '<p>Depois da fábrica.</p>');

  const html = `<p class="caminho">O caminho de toda placa: dizer o que ela tem que fazer → escolher o tipo de cada peça → escolher as peças de verdade na loja → desenhar a placa com elas → testar no papel → fabricar → montar e acender.</p>
    <ol class="passos">${p1}${p2}${p3}${p4}${p5}${p6}${p7}</ol>`;
  let secao = main.querySelector('section.processo');
  if (!secao) { main.innerHTML = '<section class="processo" aria-label="Processo"></section>'; secao = main.querySelector('section.processo'); }
  if (secao.dataset.html !== html) {   // so troca se mudou, e sem perder a rolagem
    const rolagem = secao.scrollTop;
    secao.innerHTML = html;
    secao.dataset.html = html;
    secao.scrollTop = rolagem;
  }
}

// carrinho: abrir as opcoes de um bloco, escolher uma peca, responder uma pergunta
async function abrirOpcoes(ref, online = false) {
  if (S.opcoes[ref] && !online) { delete S.opcoes[ref]; return desenhar(); }
  S.opcoes[ref] = { carregando: online ? 'Procurando na loja e pondo o que achar no catálogo…' : 'Lendo o catálogo…' };
  desenhar();
  try {
    const r = await fetch(`/api/opcoes?placa=${encodeURIComponent(PLACA)}&ref=${encodeURIComponent(ref)}${online ? '&online=1' : ''}`, { cache: 'no-store' });
    const d = await r.json();
    if (S.opcoes[ref]) S.opcoes[ref] = r.ok ? d : { erro: d.erro || 'a loja não respondeu' };
  } catch { if (S.opcoes[ref]) S.opcoes[ref] = { erro: 'sem resposta do app (ele está aberto?)' }; }
  desenhar();
}

// as linhas 'liga' que o escolher virou ({antes, depois}), com o nome de gente dos furos: o + e o − vêm do modelo de
// antes da troca (o LED velho), e o + continua no mesmo lugar. Sem saber o nome do furo, mostra as linhas como estão
function viradaDeGente(m, ligas) {
  const furos = new Map();   // 'D1.2' -> 'D1.1': o furo de antes e o de agora
  for (const l of ligas) {
    const a = l.antes.split(' '), b = l.depois.split(' ');
    a.forEach((x, i) => { if (x !== b[i] && /^\w+\.\w+$/.test(x)) furos.set(x, b[i]); });
  }
  const ref = [...furos.keys()][0]?.split('.')[0], quantas = ligas.length > 1 ? `as ${ligas.length} ligações` : 'a ligação';
  const papeis = [...furos].map(([de, ate]) => [m && pinoDe(m, de)?.nome, de.split('.')[1], ate.split('.')[1]]);
  if (!ref || papeis.some(([nome]) => !['+', '−'].includes(nome)))
    return `No LED novo o + fica no outro furo, então virei ${quantas} dele no placa.txt: ${ligas.map(l => `${l.antes} → ${l.depois}`).join('; ')}.`;
  return `No LED novo o + fica no outro furo, então virei ${quantas} do ${ref} no placa.txt pra ele continuar virado pro mesmo lado: `
    + papeis.map(([nome, de, ate]) => `o ${nome} era o furo ${de} e agora é o ${ate}`).join('; ') + '.';
}

async function mexer(caminho, corpo, recado) {
  S.mexendo = true; S.recado = recado; desenhar();
  try {
    const r = await fetch(`/api/${caminho}?placa=${encodeURIComponent(PLACA)}`, {
      method: 'POST', headers: { 'X-Bancada': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
    const d = await r.json().catch(() => ({}));
    S.recado = r.ok ? [d.pendente?.length ? `Peça nova no carrinho. Falta o Claude conferir no datasheet: ${d.pendente.join('; ')}.` : 'Feito. Os testes estão rodando de novo com a mudança.',
      d.ligas?.length ? viradaDeGente(S.modelo, d.ligas) : '',   // o LED novo com o + no outro furo: o escolher virou as 'liga' dele
      ...[].concat(d.avisos || []).map(a => `Atenção: ${String(a).replace(/[.\s]+$/, '')}.`)].filter(Boolean).join(' ')
      : (d.erro || 'não deu certo');
    return r.ok;
  } catch { S.recado = 'sem resposta do app (ele está aberto?)'; return false; }
  finally {
    S.mexendo = false; S.brutos.projeto = null; await atualizar(); desenhar();
    const este = S.recado, longo = este.length > 120;   // com virada ou aviso, dá tempo de ler
    setTimeout(() => { if (S.recado === este) { S.recado = ''; desenhar(); } }, longo ? 30000 : 10000);   // o recado sai sozinho
  }
}

// ---------- aba Thinking ----------
function desenharThinking(main) {
  const obj = S.testes?.objetivo;
  if (!obj) { main.innerHTML = `<p class="vazio">Ainda não tem <span class="mono">requisitos.md</span> (ou os testes não rodaram depois dele).</p>`; return; }
  const cards = obj.itens.map(i => {
    const classe = i.status === 'ok' ? 'ok' : i.status === 'falha' ? 'falha' : '';
    const detalhes = S.detalhado ? `<ul>
        ${i.detalhes.map(d => `<li>${esc(d)}</li>`).join('')}
        ${(i.verifica || []).map(v => `<li class="checa${v.ok === false ? ' nao' : ''}">${v.ok ? '✓' : v.ok === false ? '✗' : '·'} ${esc(traduz(S.modelo, v.texto))}</li>`).join('')}
      </ul>` : '';
    const primeira = i.pecas.find(r => S.modelo?.pecas.some(p => p.ref === r));
    return `<div class="galho"><article class="req ${classe}">
      <span class="status">${esc(i.motivo || i.status)}</span>
      <span class="titulo-req">${esc(i.titulo)}</span>
      <span class="pecas">${esc(i.id)} · ${esc(i.pecas.join(' · ') || 'sem peças')}</span>
      ${detalhes}
      ${primeira ? `<button type="button" class="ver" data-abrir="${esc(primeira)}">Ver na placa →</button>` : ''}
    </article></div>`;
  }).join('');
  main.innerHTML = `<section class="thinking" aria-label="Thinking">
    <div class="modos" role="group" aria-label="Modo">
      <button type="button" data-detalhado="0" aria-pressed="${!S.detalhado}">Simples</button>
      <button type="button" data-detalhado="1" aria-pressed="${S.detalhado}">Detalhado</button>
    </div>
    <div class="arvore">
      <div class="objetivo"><span class="rotulo">Objetivo</span><span class="titulo-obj">${esc(obj.titulo || PLACA)}</span>${obj.texto ? `<p>${esc(obj.texto)}</p>` : ''}</div>
      ${obj.itens.length ? `<div class="tronco"></div><div class="galhos">${cards}</div>` : ''}
    </div>
    ${obj.erro ? `<p class="erro-req">${esc(obj.erro)}</p>` : ''}
    <span class="rodape">requisitos.md · status calculado pelos testes, sem IA</span>
  </section>`;
}

// ---------- aba Testes ----------
const ESTADOS = { ok: ['✓', 'ok'], rodando: ['…', 'rodando'], falhou: ['✗', 'falhou'], pulou: ['–', 'pulou'], nao_rodou: ['·', 'não rodou'], aguardando: ['·', 'aguardando'] };

function hora(iso) { return iso ? iso.slice(11, 16) : ''; }

function desenharTestes(main) {
  const t = S.testes;
  if (!t) { main.innerHTML = `<p class="vazio">Ainda não rodou nenhum teste.<br>Rode <span class="mono">python ferramenta/testar.py placas/${esc(PLACA)}</span>.</p>`; return; }
  const falha = !t.rodando && t.etapas.find(e => e.estado === 'falhou');
  const m = S.modelo;
  // o rótulo uma vez só por problema, numa peça que ainda não tem, de preferência fora do cérebro (o DevKit é grande e já
  // ganha o contorno; três etiquetas iguais amontoadas não dizem mais que uma): {ref: rótulo, ou '' = só o contorno}
  const eCerebro = ref => m?.pecas.find(p => p.ref === ref)?.eletrica?.modelo === 'mcu';
  const umaVez = (rotulos, ja = {}) => {
    const porRotulo = {}, saida = {};
    for (const [ref, rot] of Object.entries(rotulos || {})) (porRotulo[rot] ||= []).push(ref);
    for (const [rot, refs] of Object.entries(porRotulo)) {
      const livres = refs.filter(r => !ja[r] && !saida[r]), dono = livres.find(r => !eCerebro(r)) ?? livres[0];
      for (const r of refs) if (!ja[r] && !saida[r]) saida[r] = r === dono ? rot : '';
    }
    return saida;
  };
  const erros = falha ? umaVez(falha.rotulos) : {};
  // a etapa que passou com aviso (a antena, a psram, o pino de boot, os pinos juntos, o botão que não lê 0): contorno e
  // etiqueta amarela, do mesmo jeito
  const avisos = {};
  if (!t.rodando) for (const e of t.etapas) if (e.estado === 'ok' && e.aviso) {
    for (const [ref, rot] of Object.entries(umaVez(e.rotulos, avisos))) if (!avisos[ref]) avisos[ref] = rot;
  }
  const quando = t.rodando ? `começou ${hora(t.inicio)}` : `rodou ${hora(t.fim || t.inicio)}`;
  const fotoOk = t.etapas.find(e => e.nome === 'Tira foto da placa')?.estado === 'ok';

  const etapas = t.etapas.map(e => {
    const [icone, texto] = ESTADOS[e.estado] || ESTADOS.aguardando;
    let detalhe = ['ok', 'falhou', 'pulou'].includes(e.estado) ? traduz(m, e.detalhe) : '';
    if (e.estado === 'falhou' && e.requisitos?.length) detalhe += ` · requisitos ${e.requisitos.join(', ')}`;
    const comAviso = e.estado === 'ok' && e.aviso;   // o aviso sai do meio do detalhe e fica à vista, um por linha
    if (comAviso) detalhe = detalhe.split(' · ').filter(x => !x.startsWith('aviso: ')).join(' · ');
    return `<li class="etapa ${esc(e.estado)}">
      <span class="bola" aria-hidden="true">${icone}</span>
      <div class="meio"><span class="nome-etapa">${esc(e.nome)}</span>
        ${detalhe ? `<span class="detalhe">${esc(detalhe)}</span>` : ''}
        ${comAviso ? traduz(m, e.aviso).split(' · ').map(a => `<span class="aviso">Aviso: ${esc(a)}</span>`).join('') : ''}
        ${e.codigo ? `<code>${esc(e.codigo)}</code>` : ''}</div>
      <span class="estado">${texto}</span></li>`;
  }).join('');

  const placa = m ? miniatura(m, { erros, avisos }) : '';
  const titulo = t.rodando ? 'Conferindo a placa…' : falha ? 'Onde está o problema' : Object.keys(avisos).length ? 'Placa sem problemas, com avisos' : 'Placa sem problemas';
  const links = [...new Set([...Object.keys(erros), ...Object.keys(avisos)])].filter(ref => m?.pecas.some(p => p.ref === ref))
    .map(ref => `<button type="button" data-abrir="${esc(ref)}">Abrir ${esc(ref)} no Projeto →</button>`).join('');

  main.innerHTML = `<section class="testes" aria-label="Testes">
    <div class="coluna">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
        <div><h2>Rodada de testes</h2><span class="sub">${t.versao ? 'v' + t.versao + ' · ' : ''}${quando} · testes.json</span></div>
        ${S.api ? `<button type="button" class="pilula" data-rodar ${t.rodando ? 'disabled' : ''}>Rodar de novo ↻</button>` : ''}
      </div>
      <ol class="etapas">${etapas}</ol>
      ${!t.rodando && t.resumo ? `<div class="explica"><b>Resumo do Claude · só no final</b><p>${esc(t.resumo)}</p></div>` : ''}
    </div>
    <div class="coluna placa">
      <span class="titulo-placa">${titulo}</span>
      ${placa}
      <div class="links">${links}${fotoOk ? `<a href="${BASE}saida/foto.png" target="_blank" rel="noopener">Ver a foto tirada do Gerber ↗</a>` : ''}</div>
      ${m?.fabrica ? (m.fabrica.pronta && !falha && !t.rodando
        ? `<div class="links"><a href="${BASE}saida/fabrica.zip" download>Baixar fabrica.zip ↓</a></div>`
        : `<span class="sub">fabrica.zip ${m.fabrica.pronta ? 'sai quando todos os testes passarem' : 'bloqueado: peça sem datasheet conferido em ' + esc([...(m.fabrica.falta_datasheet || []), ...(m.fabrica.falta_conferir || [])].join(', '))}</span>`) : ''}
    </div>
  </section>`;
}

// ---------- desenha a aba certa ----------
function desenhar() {
  desenharTopo();
  const main = $('#main');
  if (main.dataset.aba !== S.aba) { main.innerHTML = ''; main.dataset.aba = S.aba; }
  if (S.aba === 'projeto') desenharProjeto(main);
  else if (S.aba === 'testes') desenharTestes(main);
  else if (S.aba === 'thinking') desenharThinking(main);
  else desenharProcesso(main);
}

function irPara(aba, sel) {
  S.aba = aba;
  if (sel !== undefined) S.sel = sel;
  $('#versoes').hidden = true;
  desenhar();
}

// ---------- eventos ----------
document.addEventListener('click', async e => {
  if (!e.target.closest('#versoes, #relogio')) $('#versoes').hidden = true;
  const b = e.target.closest('button, input, [data-alvo]');
  if (!b) return;
  if (b.dataset.aba) return irPara(b.dataset.aba);
  if (b.id === 'relogio') {
    const lista = $('#versoes');
    lista.hidden = !lista.hidden;
    b.setAttribute('aria-expanded', !lista.hidden);
    return desenharTopo();
  }
  if (b.dataset.versao) {
    const v = +b.dataset.versao;
    S.ver = v === versaoAtual() ? null : v;
    await Promise.all([modeloDaVersao(v), v > 1 && modeloDaVersao(v - 1)]);
    S.sel = null; S.cx = null; S.ligado = false; S.ajustes = novosAjustes();
    $('#versoes').hidden = true;
    return desenhar();
  }
  if (b.id === 'destacar') {
    S.destacar = b.checked;
    const v = S.ver ?? versaoAtual();
    if (v > 1) await modeloDaVersao(v - 1);
    return desenhar();
  }
  if ('rodar' in b.dataset) {
    b.disabled = true;
    await fetch(`/api/testar?placa=${encodeURIComponent(PLACA)}`, { method: 'POST', headers: { 'X-Bancada': '1' } }).catch(() => null);
    return;
  }
  if (b.dataset.abrir) { S.ver = null; S.cx = null; return irPara('projeto', { k: 'peca', ref: b.dataset.abrir }); }
  if (b.dataset.trocar) return abrirOpcoes(b.dataset.trocar);
  if (b.dataset.online) return abrirOpcoes(b.dataset.online, true);
  if (b.dataset.checarOp) {
    const ref = b.dataset.checarOp, codigos = (S.opcoes[ref]?.itens || []).map(i => i.codigo);
    S.opcoes[ref] = { carregando: 'Conferindo preço e estoque na loja agora…' }; desenhar();
    const d = await postar('/api/catalogo/checar', { codigos });
    S.recado = d.erro || `Conferi ${d.conferidas} na loja agora${d.mudaram?.length ? `: ${d.mudaram.length} mudaram` : ', nada mudou'}.`;
    delete S.opcoes[ref];
    return abrirOpcoes(ref);
  }
  if (b.dataset.inicio) { S.inicio = b.dataset.inicio; history.replaceState(null, '', S.inicio === 'pecas' ? '?pecas' : './'); return desenharInicio(); }
  if (b.dataset.cat) { Object.assign(C, { cat: b.dataset.cat, chip: null, todas: false }); return desenharCatalogo(); }
  if (b.dataset.catChip !== undefined) { C.chip = b.dataset.catChip || null; C.todas = false; return desenharCatalogo(); }
  if (b.dataset.catToggle) { C[b.dataset.catToggle] = b.checked; return desenharCatalogo(); }
  if ('catTodas' in b.dataset) { C.todas = true; return desenharCatalogo(); }
  if (b.dataset.checar) return acaoCatalogo('/api/catalogo/checar', { codigos: b.dataset.checar.split(',') }, 'Conferindo na loja agora…');
  if ('buscarLoja' in b.dataset) return acaoCatalogo('/api/catalogo/buscar', { bloco: C.cat, texto: $('#cat-busca').value }, 'Procurando na loja…');
  if (b.dataset.escolher) {
    const ref = b.dataset.escolher;
    if (await mexer('escolher', { ref, codigo: b.dataset.codigo }, `Trazendo ${b.dataset.codigo} da loja…`)) delete S.opcoes[ref];
    return desenhar();
  }
  if (b.dataset.responder) {
    for (const ref of Object.keys(S.opcoes)) delete S.opcoes[ref];   // a conta muda: as opcoes do resistor tambem
    return mexer('responder', { pergunta: b.dataset.responder, resposta: b.dataset.resposta }, 'Refazendo a conta…');
  }
  if ('ligar' in b.dataset) return alternarLigado();
  if (b.dataset.chave) { S.ajustes.chave[b.dataset.chave] = !S.ajustes.chave[b.dataset.chave]; return desenhar(); }
  if (b.dataset.gpio) { S.ajustes.pinos[b.dataset.gpio] = +b.dataset.nivel; return desenhar(); }   // o pino do cérebro em 0 ou 1
  if (b.dataset.lux) { S.ajustes.lux[b.dataset.lux] = +b.dataset.valor; return desenhar(); }      // a luz no LDR (0 = escuro)
  if (b.dataset.piezo) { S.ajustes.piezo[b.dataset.piezo] = !S.ajustes.piezo[b.dataset.piezo]; return desenhar(); }
  if ('reset' in b.dataset) { S.ajustes = novosAjustes(); return desenhar(); }
  if (S.ligado && S.modo === 'seta' && b.dataset.alvo?.startsWith('peca:') && !motivoSemSimulacao(modeloVisto())) {   // ligado, clicar no botao e apertar
    const ref = b.dataset.alvo.slice(5), p = modeloVisto()?.pecas.find(q => q.ref === ref);
    if (p?.eletrica?.modelo === 'chave') { S.ajustes.chave[ref] = !S.ajustes.chave[ref]; return desenhar(); }
  }
  if (b.dataset.detalhado) { S.detalhado = b.dataset.detalhado === '1'; return desenhar(); }
  if (b.dataset.modo) { S.modo = b.dataset.modo; return desenhar(); }
  if (b.dataset.zoom) return zoomEm(+b.dataset.zoom);
  if ('centralizar' in b.dataset) { centralizar(); return aplicarZoom(); }
  if ('fechar' in b.dataset) { S.sel = null; return desenhar(); }
  if (b.dataset.alvo && S.modo === 'seta' && !S.arrastou) {
    S.sel = selecaoDoAlvo(b.dataset.alvo);
    return desenhar();
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'cat-texto') { C.texto = el.value; C.todas = false; return desenharCatalogo(); }
  if (el.dataset.pilha) S.ajustes.pilha[el.dataset.pilha] = +el.value;
  else if (el.dataset.resistor) S.ajustes.resistor[el.dataset.resistor] = el.dataset.lista.split(',').map(Number)[+el.value];
  else return;
  desenhar();
});

document.addEventListener('mousedown', e => {
  const area = e.target.closest('.area');
  if (!area || e.target.closest('.ferramentas')) return;
  S.arrastou = false;
  if (S.modo === 'mao' || e.button === 1) {
    e.preventDefault();
    S.arrastando = { x: e.clientX, y: e.clientY };
    area.classList.add('arrastando');
  }
});

document.addEventListener('mousemove', e => {
  if (S.arrastando) {
    const a = areaInfo(), k = a.base * S.zoom;
    S.cx -= (e.clientX - S.arrastando.x) / k;
    S.cy -= (e.clientY - S.arrastando.y) / k;
    S.arrastando = { x: e.clientX, y: e.clientY };
    S.arrastou = true;
    aplicarZoom();
  }
  const area = e.target.closest('.area'), hud = $('.hud');
  if (!hud) return;
  if (!area || S.modo !== 'seta' || e.target.closest('.ferramentas')) { hud.hidden = true; return; }
  const m = modeloVisto(), svg = area.querySelector('.desenho');
  const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  const dentro = pt.x >= 0 && pt.y >= 0 && pt.x <= m.placa.w && pt.y <= m.placa.h;
  const alvo = e.target.closest('[data-alvo]')?.dataset.alvo;
  if (!dentro && !alvo) { hud.hidden = true; return; }
  const r = area.getBoundingClientRect();
  hud.hidden = false;
  hud.style.left = (e.clientX - r.left + 18) + 'px';
  hud.style.top = (e.clientY - r.top + 18) + 'px';
  let simHud = null;
  if (S.ligado && m.simulacao?.pode) try { simHud = simLigado(m); } catch { /* número pendente: o painel já diz qual */ }
  hud.querySelector('.nome-hud').textContent = nomeDoAlvo(m, alvo || 'placa', simHud);
  hud.querySelector('.xy').textContent = `x ${mm(pt.x, 1)}  y ${mm(m.placa.h - pt.y, 1)} mm`;
});

document.addEventListener('mouseup', () => {
  if (!S.arrastando) return;
  S.arrastando = null;
  $('.area')?.classList.remove('arrastando');
});

document.addEventListener('wheel', e => {
  const area = e.target.closest('.area');
  if (!area) return;
  e.preventDefault();
  const r = area.getBoundingClientRect();
  zoomEm(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

document.addEventListener('keydown', e => {
  if (!PLACA || e.target.closest('input, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') { S.sel = null; $('#versoes').hidden = true; return desenhar(); }
  if (S.aba !== 'projeto') return;
  if (e.key === 'v') { S.modo = 'seta'; desenhar(); }
  if (e.key === 'h') { S.modo = 'mao'; desenhar(); }
  if (e.key === '+' || e.key === '=') zoomEm(1.25);
  if (e.key === '-') zoomEm(0.8);
  if (e.key === '0') { centralizar(); aplicarZoom(); }
  if (e.key === 'l') alternarLigado();
});

window.addEventListener('resize', aplicarZoom);

if (PLACA) {
  lerDe('/api/placas').then(api => { S.api = !!api; desenhar(); });
  atualizar();
  setInterval(atualizar, 1000);
} else {   // janela principal: Projetos | Pecas (relê a lista de projetos de vez em quando; as pecas, por clique)
  for (const id of ['voltar', 'direita']) $('#' + id).hidden = true;
  $('#abas').innerHTML = '<button type="button" data-inicio="projetos">Projetos</button><button type="button" data-inicio="pecas">Peças</button>';
  S.inicio = PECAS ? 'pecas' : 'projetos';
  document.title = 'Sianvolt';
  desenharInicio();
  carregarCatalogo().then(desenharInicio);
  setInterval(() => { if (S.inicio === 'projetos') desenharInicio(); }, 5000);
}
</script>
</body>
