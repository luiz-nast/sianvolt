// ---------- painel: mexer na pilha, no resistor e no botao e ver o que acontece ----------
function porModelo(m, modelo) { return m.pecas.filter(p => p.eletrica?.modelo === modelo); }

// ---- ▶ Ligar com o cérebro (ESP32): cada GPIO usado vira uma chave 0/1 na mão; o botão aperta e o LDR ganha a luz ----
// o que o painel mudou: pilha (V), resistor (Ω), chave (apertada), pinos (GPIOn: 0 ou 1), lux (LDR: 0 = escuro), piezo (na virada)
function novosAjustes() { return { pilha: {}, resistor: {}, chave: {}, pinos: {}, lux: {}, piezo: {} }; }
const LUXES = [[0, 'escuro'], [1, '1 lux'], [10, '10 lux'], [100, '100 lux']];   // as luzes da tabelinha do LDR no Carrinho
const NOME_DO_MODELO = { led: 'LED', chave: 'Botão', ldr: 'Olho de luz', piezo: 'Som', capacitor: 'Capacitor' };
const QUEM_MANDA = ['led', 'piezo', 'chave', 'ldr', 'capacitor'];   // a peça do ramo que dá nome ao pino, nesta ordem
const modeloDaPeca = (m, ref) => m.pecas.find(p => p.ref === ref)?.eletrica?.modelo;
// o que o regulador do 3V3 entrega: o 3V3 mais os pinos que fornecem (o que afunda não soma), como o testar.soma_3v3
const soma3v3 = sim => Object.entries(sim?.pecas || {}).reduce((s, [ref, x]) => s + (ref === '~3V3' || ref.startsWith('~GPIO') ? Math.max(x.i, 0) : 0), 0);

// o papel de cada GPIO ligado, tirado do circuito, com a mesma regra da etapa 4 (testar.py, papel_dos_pinos): olha as peças
// no pino e as que vêm depois de UM resistor (ou de dois em série). Chave = 'pullup' ('pullup_fora'/'pulldown_fora' com
// resistor pro 3V3/GND), LDR = 'analogica', LED, piezo ou capacitor = 'saida', direto no 3V3/GND/VIN = 'energia'.
// Sem cérebro, null; com ele, {u, pinos: [{nome, n, net, papel, ramo}]} na ordem em que as peças estão no placa.txt
function pinosDoCerebro(m) {
  const u = m.pecas.find(p => p.eletrica?.modelo === 'mcu');
  if (!u) return null;
  const pecas = Object.fromEntries(m.pecas.map(p => [p.ref, p])), modeloDe = ref => pecas[ref]?.eletrica?.modelo;
  const naNet = {};   // net -> as peças nela, sem o cérebro
  for (const p of m.pecas) if (p !== u) for (const q of p.pinos) if (q.net && !(naNet[q.net] ||= []).includes(p.ref)) naNet[q.net].push(p.ref);
  const energia = Object.fromEntries(['3V3', 'GND', 'VIN'].map(k => [k, new Set(u.pinos.filter(q => q.nome === k && q.net).map(q => q.net))]));
  const todas = new Set(Object.values(energia).flatMap(s => [...s]));
  const resistores = (net, sem) => (naNet[net] || []).filter(x => modeloDe(x) === 'resistor' && x !== sem);
  const outraPonta = (ref, net) => pecas[ref].pinos.map(q => q.net).filter(n => n && n !== net);
  const gpios = u.pinos.filter(q => q.net && /^GPIO\d+$/.test(q.nome || ''));
  const colados = new Set(gpios.filter(q => !todas.has(q.net)).flatMap(q => (naNet[q.net] || []).filter(x => modeloDe(x) === 'ldr')));
  const pinos = gpios.map(q => {
    const g = { nome: q.nome, n: q.n, net: q.net, papel: 'energia', ramo: [] };
    if (todas.has(q.net)) return g;
    const direto = naNet[q.net] || [], chega = new Set();
    g.ramo = [...direto];
    for (const r1 of resistores(q.net)) for (const net of outraPonta(r1, q.net)) {
      chega.add(net);
      if (todas.has(net)) continue;   // o que vai pro 3V3 ou pro GND não leva adiante
      for (const x of naNet[net] || []) if (!g.ramo.includes(x)) g.ramo.push(x);
      for (const r2 of resistores(net, r1)) for (const n of outraPonta(r2, net)) chega.add(n);
    }
    const puxa = k => [...chega].some(n => energia[k].has(n)), tem = k => g.ramo.some(x => modeloDe(x) === k);
    const ldrs = g.ramo.filter(x => modeloDe(x) === 'ldr');
    if (tem('chave')) g.papel = puxa('3V3') ? 'pullup_fora' : puxa('GND') ? 'pulldown_fora' : 'pullup';
    else if (ldrs.some(x => direto.includes(x) || !colados.has(x)) || (ldrs.length && puxa('3V3'))) g.papel = 'analogica';
    else g.papel = ldrs.length || ['led', 'piezo', 'capacitor'].some(k => tem(k)) ? 'saida' : null;
    return g;
  });
  const ordem = g => Math.min(Infinity, ...g.ramo.map(x => m.pecas.findIndex(p => p.ref === x)));
  return { u, pinos: pinos.sort((a, b) => ordem(a) - ordem(b)) };
}

// o estado de cada GPIO pro comPinos: a saída como o painel deixou (começa em 0), o botão com o pull-up de dentro e o
// resto solto (o LDR, o pino só de entrada, o que está direto na energia). Igual à etapa 4, só que o 0 e o 1 são na mão
function estadoDosPinos(c) {
  const so = new Set(c.u.eletrica.so_entrada || []), estado = {};
  for (const g of c.pinos) {
    if (so.has(g.nome)) continue;   // GPIO34 a 39 só leem: nem saída nem pull-up de dentro
    if (g.papel === 'saida') estado[g.nome] = S.ajustes.pinos?.[g.nome] ?? 0;
    else if (g.papel === 'pullup' || g.papel === 'pullup_fora') estado[g.nome] = 'pullup';
  }
  return estado;
}

// os ajustes no formato do simular: o LDR vai em ohms, pela luz escolhida (sem escolha, os 10 lux de sempre do simular).
// cantos: {LDR1: 'min' | 'max'}, o LDR mais claro ou mais escuro que a loja pode mandar (sem canto, o do meio)
function ajustesDoSimular(m, cantos = {}) {
  const aj = S.ajustes, ldr = {};
  for (const p of porModelo(m, 'ldr')) {
    const lux = aj.lux?.[p.ref], canto = cantos[p.ref];
    if (lux != null || canto) ldr[p.ref] = ohmsDoLdr(p.eletrica, lux ?? LUX_PADRAO, canto || 'meio', p.ref);
  }
  return { pilha: aj.pilha, resistor: aj.resistor, chave: aj.chave, piezo: aj.piezo || {}, ldr };
}

// o circuito ligado como o painel deixou; com o cérebro, os pinos viram pilhas de mentira (comPinos). vdd null = o do meio.
// Número pendente na conta (comPinos, ohmsDoLdr) lança Error com a frase de gente, pra mostrar no painel
function simLigado(m, vdd = null, cantos = {}) {
  const c = pinosDoCerebro(m);
  return simular(c ? comPinos(m, estadoDosPinos(c), vdd) : m, ajustesDoSimular(m, cantos));
}

// o modelo com cada LED no vf_min ou no vf_max do datasheet, como o testar.com_vf (LED sem o campo fica no vf típico)
const comVf = (m, campo) => ({ ...m, pecas: m.pecas.map(p => p.eletrica?.modelo === 'led' && positivo(p.eletrica[campo])
  ? { ...p, eletrica: { ...p.eletrica, vf: p.eletrica[campo] } } : p) });
const ouNada = f => { try { return f(); } catch { return null; } };   // conta com número pendente: sem faixa, em vez de chute

// os volts no GPIO do LDR nos cantos, como a etapa 4 (testar.faixa_do_ldr): o LDR mais claro e o mais escuro da loja,
// com o 3V3 no mínimo e no máximo (a ponta pendente fica no do meio). {de, ate, com3v3} ou null
function cantosDoLdr(m, c, g, ldrs) {
  const e = c.u.eletrica, vdds = ['vdd_min', 'vdd_max'].map(k => (positivo(e[k]) ? e[k] : e.vdd));
  const vs = ['min', 'max'].flatMap(canto => vdds.map(v => ouNada(() => simLigado(m, v, Object.fromEntries(ldrs.map(r => [r, canto]))).nets[g.net])));
  if (vs.some(v => v == null)) return null;
  return { de: Math.min(...vs), ate: Math.max(...vs), com3v3: positivo(e.vdd_min) && positivo(e.vdd_max) };
}

// número do cérebro que é estimativa (a fonte diz), e não do datasheet: a tela marca com ~ e diz de onde veio
function estimativa(e, campo) {
  const f = [].concat(e.fontes?.[campo] || []).join(' ');   // a fonte: 'MicroPython quickref ESP32 https://...: ...'
  return /estimativa|suposi[cç]/i.test(f) ? (f.split(/ https?:|: /)[0] || 'uma estimativa') : null;
}

// "LED A (D1)" + "D32 · GPIO32": o apelido do bloco no projeto.json (ou a peça do ramo), o que está escrito no DevKit e o pino
function nomeDoGpio(m, c, g) {
  const b = S.projeto?.blocos?.find(x => x.pino === g.nome && x.apelido && g.ramo.includes(x.ref));
  const principal = QUEM_MANDA.map(k => g.ramo.filter(x => modeloDaPeca(m, x) === k)).find(l => l.length) || [];
  const quem = b?.apelido ? `${b.apelido} (${b.ref})` : principal.map(ref => `${NOME_DO_MODELO[modeloDaPeca(m, ref)]} ${ref}`).join(' e ')
    || (g.papel === 'energia' ? 'direto na energia' : 'sem peça que eu conheça');
  const ser = c.u.serigrafia?.[g.n];
  return { quem, onde: [ser && ser !== g.nome ? ser : null, g.nome].filter(Boolean).join(' · ') };
}

// uma linha por GPIO usado: quem está nele, a chave 0/1 (saída), o botão (entrada), a luz do LDR (analógica) e o que o
// pino lê (preencherPinos). Devolve {html, chaves}: os botões que já têm linha não repetem na lista de baixo
function pinosHTML(m, c) {
  const so = new Set(c.u.eletrica.so_entrada || []), chaves = new Set();
  const linhas = c.pinos.map(g => {
    const { quem, onde } = nomeDoGpio(m, c, g), de = k => g.ramo.filter(x => modeloDaPeca(m, x) === k);
    const cor = de('led').map(ref => bolinha(m.pecas.find(p => p.ref === ref).eletrica.cor)).join('');
    let ctl = '';
    if (g.papel === 'saida') ctl += so.has(g.nome) ? '<span class="sub">só lê: não dá pra ligar daqui</span>'
      : `<div class="escolhas mini" role="group" aria-label="${esc(g.nome)} em 0 ou 1">${[0, 1].map(n => `<button type="button" data-gpio="${esc(g.nome)}" data-nivel="${n}">${n}</button>`).join('')}</div>`;
    for (const ref of de('chave').filter(x => !chaves.has(x))) { chaves.add(ref); ctl += `<button type="button" class="pilula" data-chave="${esc(ref)}"></button>`; }
    if (g.papel === 'analogica') for (const ref of de('ldr')) {
      ctl += `<div class="escolhas mini" role="group" aria-label="Luz no ${esc(ref)}">${LUXES.map(([lux, txt]) => `<button type="button" data-lux="${esc(ref)}" data-valor="${lux}">${txt}</button>`).join('')}</div>`;
    }
    for (const ref of de('piezo')) ctl += `<button type="button" class="pilula" data-piezo="${esc(ref)}"></button>`;
    return `<div class="gpio"><span class="quem">${cor}<b>${esc(quem)}</b><span class="mono">· ${esc(onde)}</span></span>
      ${ctl ? `<div class="controles">${ctl}</div>` : ''}<span class="le" data-le="${esc(g.nome)}"></span></div>`;
  });
  return { chaves, html: `<div class="gpios leitura">${linhas.join('')}</div>` };
}

// o que cada pino faz e lê agora: a saída (quanto dá ou puxa, contra a força padrão do pino), o botão (lê 0 pelo VIL do
// datasheet), o LDR (os volts contra a faixa boa do ADC); e quanto o 3V3 entrega, contra o que sobra dele pras peças
function preencherPinos(m, c, sim, q) {
  const e = c.u.eletrica, aj = S.ajustes, vdd = e.vdd, so = new Set(e.so_entrada || []);
  const todos = sel => document.querySelectorAll('aside.painel ' + sel);
  for (const b of todos('[data-gpio]')) b.setAttribute('aria-pressed', +b.dataset.nivel === (aj.pinos[b.dataset.gpio] ?? 0));
  for (const b of todos('[data-lux]')) b.setAttribute('aria-pressed', +b.dataset.valor === (aj.lux[b.dataset.lux] ?? LUX_PADRAO));
  for (const b of todos('[data-piezo]')) {
    const fio = !!aj.piezo[b.dataset.piezo];
    b.setAttribute('aria-pressed', fio);
    b.textContent = `Som ${b.dataset.piezo} · ${fio ? 'na virada do apito' : 'parado'}`;
  }
  const vil = positivo(e.vil) ? e.vil * vdd : null;   // vil é fração do 3V3 (DS v5.3, Tabela 5-3)
  const adc = positivo(e.adc_min) && positivo(e.adc_max);
  for (const g of c.pinos) {
    const el = q(`[data-le="${g.nome}"]`), v = sim?.nets[g.net], de = k => g.ramo.filter(x => modeloDaPeca(m, x) === k);
    if (!el) continue;
    if (v == null) { el.textContent = '?'; el.className = 'le'; continue; }
    const partes = [`${mm(v, 2)} V no pino`];
    let classe = '';
    if (g.papel === 'saida' && !so.has(g.nome)) {
      const i = sim.pecas['~' + g.nome]?.i ?? 0;
      partes[0] = `em ${aj.pinos[g.nome] ?? 0}: ${partes[0]}`;
      partes.push(Math.abs(i) < 1e-6 ? 'não passa corrente' : `${i > 0 ? 'dá' : 'puxa'} ${mA(Math.abs(i))} mA`);
      if (positivo(e.i_pino) && Math.abs(i) > e.i_pino) { partes.push(`passa da força padrão do pino (~${mA(e.i_pino)} mA)`); classe = 'queima'; }
      for (const ref of de('piezo')) {
        const r = sim.pecas[ref];
        partes.push(r?.fio ? `${ref} na virada do apito: ${mA(Math.abs(r.i))} mA` : `${ref} parado: não passa corrente`);
      }
    } else if (g.papel === 'analogica') {   // o veredito vale nos cantos, como a etapa 4 e o Carrinho (o LDR do meio só não basta)
      const cantos = cantosDoLdr(m, c, g, de('ldr'));
      if (cantos) partes[0] += ` (de ${mm(cantos.de, 2)} a ${mm(cantos.ate, 2)} V nos cantos do LDR${cantos.com3v3 ? ' e do 3V3' : '; a faixa do 3V3 está pendente'})`;
      for (const ref of de('ldr')) if (sim.pecas[ref]) partes.push(`${ref} com ${ohmsCurto(sim.pecas[ref].ohms)}`);
      if (adc) {
        const faixa = `da faixa boa do ADC (${mm(e.adc_min, 2)} a ${mm(e.adc_max, 2)} V)`, na = x => x >= e.adc_min && x <= e.adc_max;
        const meio = na(v), todos = cantos ? na(cantos.de) && na(cantos.ate) : meio;
        partes.push(todos ? `dentro ${faixa}${cantos ? ', até nos cantos' : ''}` : meio ? `fora ${faixa} em algum canto: com o LDR que vier, a leitura pode não ser confiável`
          : `fora ${faixa}: a leitura não é confiável`);
        classe = todos ? 'ok' : 'fora';
      }
    } else if (g.papel === 'pullup' && so.has(g.nome)) {   // GPIO34 a 39: sem pull-up de dentro, o botão solto deixa o pino no ar
      partes.push('este pino não tem pull-up de dentro: com o botão solto, ele fica no ar e lê qualquer coisa');
      classe = 'fora';
    } else if (['pullup', 'pullup_fora', 'pulldown_fora'].includes(g.papel)) {
      if (vil !== null && v <= vil) partes.push(`lê 0 (até ${mm(vil, 2)} V o pino lê 0)`);
      else if (Math.abs(v - vdd) < 0.005) partes.push('no 3V3: lê 1');
      else if (g.papel === 'pulldown_fora')   // no pull-down, apertado é pra ler 1: não é problema, só falta o número
        partes.push(`${vil !== null ? `não lê 0 (até ${mm(vil, 2)} V o pino lê 0)` : 'o VIL está pendente'}; se ele lê 1 depende do VIH (onde o pino passa a ler 1), que está pendente`);
      else if (vil !== null) { partes.push(`não chega a ler 0 (até ${mm(vil, 2)} V o pino lê 0)`); classe = 'fora'; }
    } else partes.push(g.papel === 'energia' ? 'ligado direto na energia: fica solto (nunca vire saída)' : 'fica solto: o pino só lê');
    el.textContent = partes.join(' · ');
    el.className = `le ${classe}`;
  }
  const b = q('[data-soma-3v3]'), soma = soma3v3(sim), orc = positivo(e.orcamento_3v3) ? e.orcamento_3v3 : null;
  if (b) {
    b.textContent = `${mA(soma)} mA${orc ? ` de ~${mA(orc)} mA que sobram pras peças` : ' (o que sobra pras peças está pendente)'}`;
    b.className = orc && soma > orc ? 'queima' : 'ok';
  }
}

// a conta de cada LED no pino, como a da pilha: (pino − LED) ÷ (resistor + pino). Só no caso clássico:
// GPIO → um resistor → + do LED, e o − dele no GND do cérebro
function contasDosPinos(m, c, sim) {
  const e = c.u.eletrica, aj = S.ajustes, linhas = [];
  const peca = ref => m.pecas.find(p => p.ref === ref), netDe = (p, n) => p.pinos.find(q => q.n === n)?.net;
  const gnd = c.u.pinos.filter(q => q.nome === 'GND' && q.net).map(q => q.net);
  for (const g of c.pinos) {
    const leds = g.ramo.map(peca).filter(p => p.eletrica?.modelo === 'led'), rs = g.ramo.map(peca).filter(p => p.eletrica?.modelo === 'resistor');
    if (g.papel !== 'saida' || leds.length !== 1 || rs.length !== 1) continue;
    const [led, r] = [leds[0], rs[0]], [mais, menos] = polos(led.eletrica), nets = r.pinos.map(q => q.net);
    if (!gnd.includes(netDe(led, menos)) || !nets.includes(g.net) || !nets.includes(netDe(led, mais))) continue;
    const x = sim.pecas[led.ref], nivel = aj.pinos[g.nome] ?? 0, v = e.vdd, ohms = aj.resistor[r.ref] ?? r.valor, j = joelho(led.eletrica);
    const rPino = `${estimativa(e, 'r_pino') ? '~' : ''}${e.r_pino}`;   // ~: estimativa, não datasheet (o rodapé diz de onde)
    // o LED com as casas que fazem a conta fechar na mão (2; 3 ou 4 quando o arredondamento cai na beirada do mA mostrado)
    const passo = Math.abs(x?.i ?? 0) >= 0.0095 ? 1e-3 : 1e-4, fecha = k => {
      const q = (v - +(x.v.toFixed(k))) / (ohms + e.r_pino) / passo;
      return Math.abs(q - Math.round(q)) < 0.45 && Math.round(q) === Math.round(x.i / passo);
    };
    linhas.push(`${led.ref}: ` + ((e.so_entrada || []).includes(g.nome) ? `o ${g.nome} só lê: ele não tem saída pra acender o LED`
      : !nivel ? `o ${g.nome} está em 0 (0 V): nada empurra a corrente e o LED fica apagado`
      : x?.i > 1e-6 ? `corrente = (pino − LED) ÷ (resistor + pino) = (${volts(v)} − ${mm(x.v, [2, 3, 4].find(fecha) ?? 4)}) ÷ (${ohms} + ${rPino}) = ${mA(x.i)} mA`
      : v <= j ? `o pino (${volts(v)} V) não passa dos ${volts(j)} V que o LED pede pra começar: ele fica apagado`
      : 'o circuito está aberto: a corrente não tem por onde passar'));
  }
  return linhas;
}

// em letra pequena: o 3V3 de verdade (a faixa e a condição dela) e o que falta conferir nas peças (a porta USB...)
function rodapeDoCerebro(m, u) {
  const e = u.eletrica, porTexto = {};
  for (const p of m.pecas) for (const t of p.eletrica?.pendentes || []) (porTexto[t] ||= []).push(p.ref);
  const faixa = positivo(e.vdd_min) && positivo(e.vdd_max) ? `3V3 de verdade: de ${mm(e.vdd_min, 3)} a ${mm(e.vdd_max, 3)} V (a conta usa ${volts(e.vdd)} V)`
    : `a faixa do 3V3 está pendente (a conta usa ${volts(e.vdd)} V)`;
  // os números das contas do painel que são estimativa (a fonte deles diz), se o pendentes da peça ainda não fala deles
  const chutes = ['r_pino', 'r_pull', 'r_3v3'].filter(k => positivo(e[k]) && estimativa(e, k) && !(e.pendentes || []).some(t => t.startsWith(k + ':')))
    .map(k => `${k}: ${k === 'r_pino' ? '~' : ''}${ohmsTxt(e[k])} é estimativa (${estimativa(e, k)}), não vem do datasheet`);
  return `<div class="pendentes"><span class="sub">${esc(faixa)}${e.condicao_3v3 ? `; ${esc(e.condicao_3v3)}` : ''}.</span>
    ${Object.entries(porTexto).map(([t, refs]) => pendenteHTML(refs.join() === u.ref ? t : `${refs.join(', ')} · ${t}`)).join('')}${chutes.map(pendenteHTML).join('')}</div>`;
}

// a faixa verde de um LED no pino do cérebro, com as palavras da etapa 4: de (vf_max) a (vf_min) no 3V3 do meio, e o pior
// caso (vf_min e o 3V3 máximo). e: a eletrica do LED; u: a do cérebro. A ponta sem vf no datasheet fica no vf típico, e diz
function faixaNoPino(e, u, iDe, iAte, iPior) {
  if (Math.max(iDe, iAte) < 1e-6) return 'nenhuma agora, o LED está apagado';
  const falta = ['vf_min', 'vf_max'].filter(k => !positivo(e[k])), nome = { vf_min: 'vf mínimo', vf_max: 'vf máximo' };
  const faixa = falta.length === 2 ? `${mA(iAte)} mA com ${volts(u.vdd)} V e o vf típico (o vf mínimo e o máximo do LED estão pendentes)`
    : `de ${mA(Math.min(iDe, iAte))} a ${mA(Math.max(iDe, iAte))} mA com ${volts(u.vdd)} V, cada LED sai um pouco diferente`
      + (falta.length ? ` (o ${nome[falta[0]]} do LED está pendente: essa ponta fica no vf típico)` : '');
  return faixa + (iPior != null ? `; até ${mA(iPior)} mA no pior caso, com o 3V3 em ${mm(u.vdd_max, 3)} V` : '');
}

function painelHTML(m) {
  const pilhas = porModelo(m, 'pilha'), chaves = porModelo(m, 'chave'), resistores = porModelo(m, 'resistor'), leds = porModelo(m, 'led');
  const c = pinosDoCerebro(m), comCerebro = c ? pinosHTML(m, c) : null;   // os botões de um GPIO ficam na linha dele
  const soltas = chaves.filter(p => !comCerebro?.chaves.has(p.ref));
  const desliga = '<button type="button" class="fechar" data-ligar aria-label="Desligar o circuito"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></button>';
  return `
    <div class="cab"><div><div class="tipo">Circuito ligado</div><div class="titulo">Painel</div></div>${desliga}</div>
    <p class="dica">${c ? `Cada pino do cérebro é como uma pilhinha de ${volts(c.u.eletrica.vdd)} V que o programa liga (1) e desliga (0); aqui você faz isso na mão. As bolinhas nas trilhas são a corrente andando.`
      : 'As bolinhas nas trilhas são a corrente andando. Mexa aqui e veja o que muda.'}${chaves.length ? ' Clique no botão da placa pra apertar e soltar.' : ''}</p>
    ${pilhas.map(p => `<label class="controle"><span>Pilha · ${esc(p.ref)} <b data-txt-pilha="${esc(p.ref)}"></b></span>
      <input type="range" data-pilha="${esc(p.ref)}" min="${p.eletrica.v_min}" max="${p.eletrica.v_max}" step="0.1" value="${p.eletrica.v}">
      <span class="faixa"><i>fraca ${volts(p.eletrica.v_min)} V</i><i>nova ${volts(p.eletrica.v_max)} V</i></span></label>`).join('')}
    ${comCerebro ? comCerebro.html : ''}
    ${soltas.length ? `<div class="chaves">${soltas.map(p => `<button type="button" class="pilula" data-chave="${esc(p.ref)}"></button>`).join('')}</div>` : ''}
    ${resistores.map(p => {
      const lista = OHMS.includes(p.valor) ? OHMS : [...OHMS, p.valor].sort((a, b) => a - b);
      return `<label class="controle"><span>Resistor · ${esc(p.ref)} <b data-txt-resistor="${esc(p.ref)}"></b></span>
      <input type="range" data-resistor="${esc(p.ref)}" data-lista="${lista.join(',')}" min="0" max="${lista.length - 1}" step="1" value="${lista.indexOf(p.valor)}">
      <span class="faixa"><i>${ohmsTxt(lista[0])}</i><i>${ohmsTxt(lista[lista.length - 1])}</i></span></label>`;
    }).join('')}
    ${leds.map(p => `<div class="leitura"><span>${COR_DE_TELA[p.eletrica.cor] ? `<span>LED · ${esc(p.ref)} ${bolinha(p.eletrica.cor)}</span>` : `LED · ${esc(p.ref)}`} <b data-led="${esc(p.ref)}"></b></span>
      <div class="barra"><i class="faixa-b" data-faixa="${esc(p.ref)}"></i><i class="teste" data-teste="${esc(p.ref)}"></i><i class="limite" data-limite="${esc(p.ref)}"></i><i class="marca" data-marca="${esc(p.ref)}"></i></div>
      <span class="legenda" data-legenda="${esc(p.ref)}"></span></div>`).join('')}
    ${resistores.map(p => `<div class="leitura"><span>Resistor · ${esc(p.ref)} esquenta <b data-pot="${esc(p.ref)}"></b></span></div>`).join('')}
    ${pilhas.map(p => `<div class="leitura"><span>Pilha · ${esc(p.ref)} gasta <b data-gasto="${esc(p.ref)}"></b></span></div>`).join('')}
    ${c ? `<div class="leitura"><span>3V3 do ${esc(c.u.ref)} entrega <b data-soma-3v3></b></span></div>` : ''}
    <p class="formula" data-formula></p>
    ${c ? rodapeDoCerebro(m, c.u) : ''}
    <button type="button" class="link" data-reset>Voltar aos valores da placa</button>`;
}

function preencherPainel(m, sim) {
  const q = sel => $('aside.painel ' + sel.replace(/="([^"]*)"/g, (_, v) => `="${CSS.escape(v)}"`));
  const pilhas = porModelo(m, 'pilha');
  const aj = S.ajustes, c = pinosDoCerebro(m), e3 = c?.u.eletrica;
  const com = v => simular(m, { ...ajustesDoSimular(m), pilha: Object.fromEntries(pilhas.map(p => [p.ref, p.eletrica[v]])) });
  // a faixa de cada LED: entre a pilha fraca e a nova; com o cérebro, a mesma da etapa 4 e do Carrinho: no 3V3 do meio, do
  // LED de vf mais alto (vf_max, a menor corrente) ao de vf mais baixo (vf_min, a maior); e o pior caso, com o 3V3 no máximo
  const [fraca, nova] = c ? [ouNada(() => simLigado(comVf(m, 'vf_max'))), ouNada(() => simLigado(comVf(m, 'vf_min')))] : [com('v_min'), com('v_max')];
  const pior = c && positivo(e3.vdd_max) ? ouNada(() => simLigado(comVf(m, 'vf_min'), e3.vdd_max)) : null;
  if (c) preencherPinos(m, c, sim, q);
  for (const p of pilhas) {
    const v = aj.pilha[p.ref] ?? p.eletrica.v;
    q(`[data-txt-pilha="${p.ref}"]`).textContent = `${volts(v)} V`;
    const r = q(`[data-pilha="${p.ref}"]`);
    if (+r.value !== v) r.value = v;
    const i = sim?.pecas[p.ref]?.i ?? 0;
    const horas = i > 1e-6 ? p.eletrica.mah / (i * 1000) : null;
    q(`[data-gasto="${p.ref}"]`).textContent = `${mA(i)} mA${horas && horas < 1e5 ? ` · dura no máximo ≈ ${horas < 100 ? horas.toFixed(0) : Math.round(horas / 24) + ' dias ou ' + horas.toFixed(0)} h assim` : ''}`;
  }
  for (const p of porModelo(m, 'chave')) {
    const b = q(`[data-chave="${p.ref}"]`), ap = !!aj.chave[p.ref];
    b.setAttribute('aria-pressed', ap);
    b.textContent = `Botão ${p.ref} · ${ap ? 'apertado' : 'solto'}`;
  }
  for (const p of porModelo(m, 'resistor')) {
    const ohms = aj.resistor[p.ref] ?? p.valor;
    q(`[data-txt-resistor="${p.ref}"]`).textContent = ohmsTxt(ohms);
    const r = q(`[data-resistor="${p.ref}"]`), lista = r.dataset.lista.split(',').map(Number);
    if (lista[+r.value] !== ohms) r.value = lista.indexOf(ohms);
    const pw = sim?.pecas[p.ref]?.p ?? 0, max = p.eletrica.potencia_max;
    const b = q(`[data-pot="${p.ref}"]`);
    b.textContent = `${mW(pw)} mW, aguenta ${mW(max)}${pw > max ? ' · QUEIMA' : ''}`;
    b.className = pw > max ? 'queima' : 'ok';
  }
  for (const p of porModelo(m, 'led')) {
    const r = sim?.pecas[p.ref], e = p.eletrica, topo = e.i_max * 1.15;
    const pct = i => `${Math.min(100, Math.max(0, i / topo * 100)).toFixed(1)}%`;
    const b = q(`[data-led="${p.ref}"]`);
    if (!r) { b.textContent = '?'; continue; }
    const est = estadoLed(r), brilho = brilhoDaCorrente(e, r.i);
    b.textContent = `${mA(r.i)} mA · ${TEXTO_LED[est]}${brilho !== null && r.i > 0 ? ` · ≈ ${Math.round(brilho * 100)}% do anúncio` : ''}`;
    b.className = est;
    const iF = fraca?.pecas[p.ref]?.i ?? 0, iN = nova?.pecas[p.ref]?.i ?? 0;
    const f = q(`[data-faixa="${p.ref}"]`);
    f.style.left = pct(Math.min(iF, iN)); f.style.width = `calc(${pct(Math.max(iF, iN))} - ${pct(Math.min(iF, iN))})`;
    q(`[data-marca="${p.ref}"]`).style.left = pct(r.i);
    q(`[data-teste="${p.ref}"]`).style.left = pct(e.i_teste);
    q(`[data-limite="${p.ref}"]`).style.left = pct(e.i_max);
    const verde = c ? faixaNoPino(e, e3, iF, iN, pior?.pecas[p.ref]?.i) : `de ${mA(Math.min(iF, iN))} a ${mA(Math.max(iF, iN))} mA entre pilha fraca e nova`;
    q(`[data-legenda="${p.ref}"]`).textContent = `faixa verde: ${verde} · risquinho: ${mA(e.i_teste)} mA, onde o datasheet mediu · vermelho: ${mA(e.i_max)} mA, acima disso queima`;
  }
  // a conta, quando o circuito e o classico pilha + botao + resistor + LED em serie
  const leds = porModelo(m, 'led'), resistores = porModelo(m, 'resistor');
  const formula = q('[data-formula]');
  if (c) {   // com o cérebro: uma conta por LED, o pino no lugar da pilha
    const linhas = sim ? contasDosPinos(m, c, sim) : [];
    formula.replaceChildren(...linhas.map(t => Object.assign(document.createElement('span'), { className: 'linha', textContent: t })));
  } else if (pilhas.length === 1 && leds.length === 1 && resistores.length === 1 && sim) {
    const v = aj.pilha[pilhas[0].ref] ?? pilhas[0].eletrica.v, ohms = aj.resistor[resistores[0].ref] ?? resistores[0].valor;
    const r = sim.pecas[leds[0].ref], j = joelho(leds[0].eletrica);
    const rp = pilhas[0].eletrica.r_interna || 0;
    formula.textContent = r.acende
      ? `corrente = (pilha − LED) ÷ (resistor${rp ? ' + pilha' : ''}) = (${volts(v)} − ${mm(r.v)}) ÷ ${rp ? `(${ohms} + ${rp})` : ohms} = ${mA(r.i)} mA`
      : (v <= j ? `a pilha (${volts(v)} V) não passa dos ${volts(j)} V que o LED pede pra começar: ele fica apagado` : 'o circuito está aberto: a corrente não tem por onde passar');
  } else formula.textContent = '';
}

function alternarLigado() {
  const m = modeloVisto();
  if (!S.ligado && (!m || motivoSemSimulacao(m))) return;   // desligar pode sempre; ligar so quando da
  S.ligado = !S.ligado;
  if (S.ligado) { S.ajustes = novosAjustes(); S.sel = null; }
  desenhar();
}

// requisitos (do testes.json) que citam essa peca
function requisitosDa(ref) {
  return (S.testes?.objetivo?.itens || []).filter(i => i.pecas.includes(ref)).map(i => `${i.id} ${i.titulo}`).join(' · ');
}

// o que o inspetor mostra pra cada coisa clicada
function agoraDe(m, ref, sim) {
  const p = m.pecas.find(q => q.ref === ref), r = sim?.pecas[ref];
  if (p?.eletrica?.modelo === 'mcu' && sim) return `agora: o 3V3 entrega ${mA(soma3v3(sim))} mA`;
  if (!p?.eletrica || !r) return '';
  switch (p.eletrica.modelo) {
    case 'ldr': return `agora: ${ohmsCurto(r.ohms)} · ${mA(Math.abs(r.i))} mA passando`;
    case 'piezo': return `agora: ${r.fio ? `na virada do apito, ${mA(Math.abs(r.i))} mA` : 'parado, não passa corrente'}`;
    case 'led': return `agora: ${mA(r.i)} mA · ${TEXTO_LED[estadoLed(r)]}`;
    case 'resistor': return `agora: ${mA(Math.abs(r.i))} mA passando · esquenta ${mW(r.p)} mW, aguenta ${mW(p.eletrica.potencia_max)}`;
    case 'pilha': return `agora: ${volts(r.v)} V · entrega ${mA(r.i)} mA`;
    case 'chave': return `agora: ${r.apertada ? 'apertado, passando ' + mA(Math.abs(r.i)) + ' mA' : 'solto, não passa nada'}`;
  }
  return '';
}

function inspecionar(m, sel, sim) {
  if (sel.k === 'peca') {
    const p = m.pecas.find(q => q.ref === sel.ref);
    if (!p) return null;
    const outros = x => [...new Set(pinosDaNet(m, x.net).filter(n => n.split('.')[0] !== p.ref).map(n => nomePino(m, n)))];   // de outras pecas
    const usados = p.pinos.filter(x => x.net && outros(x).length);
    const rotulo = x => x.nome ? (p.pinos.filter(y => y.nome === x.nome).length > 1 ? `Lado ${x.nome}` : x.nome) : `Pino ${x.n}`;
    let linhas;
    if (p.pinos.length > 4) {
      linhas = [['Pinos', String(p.pinos.length)], ['Usados', String(usados.length)], ...usados.map(x => [rotulo(x), outros(x).join(', ')])];
    } else {
      const vistos = new Set();   // os dois pinos do mesmo lado do botao viram uma linha so
      linhas = p.pinos.filter(x => !vistos.has(rotulo(x)) && vistos.add(rotulo(x)))
        .map(x => [rotulo(x), outros(x).join(', ') || 'nada ainda']);
    }
    if (p.valor_txt) linhas.push(['Valor', ohmsTxt(+p.valor_txt)]);
    if (p.loja) linhas.push(['Tamanho', p.loja.tamanho || '—'], ['Preço', p.loja.preco != null ? `US$ ${String(p.loja.preco).replace('.', ',')} cada` : '—']);
    linhas.push(['Posição', `${mm(p.x, 1)}, ${mm(p.y, 1)} mm`]);
    if (p.exemplo) linhas.push(['Medidas', 'de exemplo, sem datasheet', true]);
    if (p.pendente?.length) linhas.push(['Falta conferir', p.pendente.join('; '), true]);
    const bloco = S.projeto?.blocos.find(b => b.ref === p.ref);
    return { tipo: `${p.ref}${bloco ? ' · ' + bloco.funcao : ''}`, titulo: p.nome, nomePeca: true, linhas, linha: p.linha,
      explica: p.explica, agora: agoraDe(m, p.ref, sim), loja: p.loja, compra: p.compra };
  }
  if (sel.k === 'pino') {
    const [ref, n] = sel.nome.split('.');
    const p = m.pecas.find(q => q.ref === ref), pino = pinoDe(m, sel.nome);
    if (!pino) return null;
    const outros = pinosDaNet(m, pino.net).filter(x => x !== sel.nome);
    const dentro = (p.juntos || []).filter(par => par.includes(n)).map(par => `${ref}.${par[0] === n ? par[1] : par[0]}`);
    const fora = [...new Set(outros.filter(x => !dentro.includes(x)).map(x => nomePino(m, x)))];
    const linhas = [['Ligado a', fora.join(', ') || 'nada ainda'], ['Net', pino.net || '—'],
      ['Furo', pino.furo ? `${mm(pino.furo)} mm (passante)` : 'não (superfície)'], ['Posição', `${mm(pino.x)}, ${mm(pino.y)} mm`]];
    const quem = { '+': 'o positivo', '−': 'o negativo' }[pino.nome];
    let explica = quem ? `É ${quem} de ${ref} (${p.nome}). ` : dentro.length ? `É o lado ${pino.nome} de ${ref} (${p.nome}). ` : `${nomePino(m, sel.nome)}, ${p.nome}. `;
    if (dentro.length) explica += `Os dois pinos do lado ${pino.nome} são ligados por dentro: contam como um só. `;
    if (pino.net === 'GND') explica += 'Está no GND, o terra: o 0 V de referência de todo o circuito.';
    else if (!fora.length) explica += dentro.length ? 'Por fora, ainda não vai pra lugar nenhum.' : 'Ainda não está ligado em nada.';
    else explica += `A trilha leva o sinal dele até ${fora.join(', ')}; tudo isso é a mesma net (${pino.net}).`;
    let agora = '';
    if (sim?.nets && pino.net in sim.nets) agora = `agora: ${volts(sim.nets[pino.net])} V neste pino`;
    return { tipo: `${p.nome} · pino ${n}`, titulo: nomePino(m, sel.nome), linhas, linha: p.linha, explica, agora };
  }
  if (sel.k === 'trilha') {
    const t = m.trilhas[sel.i];
    if (!t) return null;
    const comp = Math.hypot(t.x2 - t.x1, t.y2 - t.y1);
    const i_t = sim ? correnteNaTrilha(m, sim, t) : null;
    return { tipo: 'Trilha', titulo: `${nomePino(m, t.de)} → ${nomePino(m, t.ate)}`, linha: t.linha,
      linhas: [['Net', t.net], ['Lado', t.lado === 'baixo' ? 'embaixo da placa (azul)' : 'em cima'], ['Largura', `${mm(t.largura)} mm`], ['Comprimento', `${mm(comp, 1)} mm`]],
      explica: 'Um caminho de cobre na placa: é o fio que liga um pino no outro. Sai reto quando dá; quando outra coisa está no caminho, desvia, ou passa pro outro lado da placa por uma via (o furinho de cobre) e volta.',
      agora: i_t === null ? '' : (Math.abs(i_t) > 1e-6 ? `agora: ${mA(Math.abs(i_t))} mA passando` : 'agora: nada passando') };
  }
  if (sel.k === 'furo') {
    const f = m.furos[sel.i];
    if (!f) return null;
    const linhas = [['Diâmetro', `${mm(f.d, 1)} mm`], ['Posição', `${mm(f.x, 1)}, ${mm(f.y, 1)} mm`]];
    if (f.d >= 3.1 && f.d <= 3.4) linhas.splice(1, 0, ['Parafuso', 'M3']);
    return { tipo: 'Furo', titulo: 'Fixação', linhas, linha: f.linha,
      explica: 'Furo sem cobre pra prender a placa numa caixa ou base com parafuso.' };
  }
  return null;
}

// ---------- zoom e arrasto (mexem so no viewBox) ----------
function areaInfo() {
  const area = $('.area'), m = modeloVisto();
  if (!area || !m) return null;
  const r = area.getBoundingClientRect();
  const base = Math.min((r.width - 150) / m.placa.w, (r.height - 64) / m.placa.h);   // sobra espaco pras ferramentas
  return { area, r, base, m };
}

function centralizar() {
  const m = modeloVisto();
  S.zoom = 1; S.cx = m.placa.w / 2; S.cy = m.placa.h / 2;
}

function aplicarZoom() {
  const a = areaInfo();
  if (!a) return;
  const k = a.base * S.zoom, vw = a.r.width / k, vh = a.r.height / k;
  a.area.querySelector('.desenho').setAttribute('viewBox', `${S.cx - vw / 2} ${S.cy - vh / 2} ${vw} ${vh}`);
  a.area.querySelector('.zoom').textContent = Math.round(S.zoom * 100) + '%';
}

function zoomEm(fator, px, py) {
  const a = areaInfo();
  if (!a) return;
  if (px === undefined) { px = a.r.width / 2; py = a.r.height / 2; }
  const novo = Math.min(12, Math.max(0.4, S.zoom * fator));
  const k1 = a.base * S.zoom, k2 = a.base * novo;
  // o ponto embaixo do mouse continua no mesmo lugar
  S.cx += (px - a.r.width / 2) * (1 / k1 - 1 / k2);
  S.cy += (py - a.r.height / 2) * (1 / k1 - 1 / k2);
  S.zoom = novo;
  aplicarZoom();
}

function nomeDoAlvo(m, alvo, sim) {
  const [k, id] = alvo.split(':');
  if (k === 'peca') {
    const p = m.pecas.find(q => q.ref === id), agora = agoraDe(m, id, sim).replace('agora: ', '');
    return `${id} · ${p?.nome ?? ''}${agora ? ' · ' + agora : ''}`;
  }
  if (k === 'pino') {
    const pino = pinoDe(m, id), nome = nomePino(m, id);
    if (sim?.nets && pino?.net in sim.nets) return `${nome} · ${volts(sim.nets[pino.net])} V`;
    return pino?.net ? `${nome} · ${pino.net}` : nome;
  }
  if (k === 'trilha') {
    const t = m.trilhas[+id];
    if (!t) return 'trilha';
    const i_t = sim ? correnteNaTrilha(m, sim, t) : null;
    return `trilha ${nomePino(m, t.de)} → ${nomePino(m, t.ate)}${i_t !== null ? ` · ${mA(Math.abs(i_t))} mA` : ''}`;
  }
  if (k === 'furo') return 'Furo de fixação';
  return 'Placa';
}

function selecaoDoAlvo(alvo) {
  const [k, id] = alvo.split(':');
  if (k === 'peca') return { k, ref: id };
  if (k === 'pino') return { k, nome: id };
  if (k === 'trilha' || k === 'furo') return { k, i: +id };
  return null;
}

// ---------- tela inicial: os projetos ----------
async function lerDe(url) {
  try {
    const r = await fetch(url, { cache: 'no-store' });
    return r.ok ? await r.json() : null;
  } catch { return null; }
}

async function listarPlacas() {
  const api = await lerDe('/api/placas');
  if (api) { S.api = true; return api.placas; }
  try {   // sem o app.py (python -m http.server): le a listagem da pasta
    const html = await (await fetch('../placas/', { cache: 'no-store' })).text();
    return [...html.matchAll(/href="([^"/?#]+)\/"/g)].map(x => decodeURIComponent(x[1]));
  } catch { return []; }
}

function miniatura(m, o = {}) {
  const pad = 4;
  return `<svg class="mini" viewBox="${-pad} ${-pad} ${m.placa.w + 2 * pad} ${m.placa.h + 2 * pad}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placa">${placaSVG(m, o)}</svg>`;
}

// a cotacao vale pra versao que foi pro site; se a placa mudou depois, e so historia
function cotacaoAntiga(c, m) { return !!(c?.versao && m?.versao && c.versao !== m.versao); }

function selosDe(t, m, cotacao) {
  let testes = '<span class="selo">sem testes</span>';
  if (t?.rodando) testes = '<span class="selo rodando">testes rodando…</span>';
  else if (t) {
    const falhas = t.etapas.filter(e => e.estado === 'falhou').length;
    testes = falhas ? `<span class="selo falha">✗ ${falhas} etapa falhou</span>` : '<span class="selo ok">✓ testes ok</span>';
  }
  let fabrica = '';
  const passou = t && !t.rodando && !t.etapas.some(e => e.estado === 'falhou');
  if (cotacao && cotacaoAntiga(cotacao, m)) fabrica = `<span class="selo">fábrica: cotação da v${esc(cotacao.versao)}, a placa mudou</span>`;
  else if (cotacao) fabrica = `<span class="selo ok">fábrica: ${esc(cotacao.situacao || 'cotado')}</span>`;
  else if (m?.fabrica?.pronta && passou) fabrica = '<span class="selo">fabrica.zip pronto</span>';
  else if (m?.fabrica && !m.fabrica.pronta) fabrica = '<span class="selo">fabrica.zip travado</span>';
  return testes + fabrica;
}

async function desenharInicio() {
  document.querySelectorAll('#abas [data-inicio]').forEach(b => b.setAttribute('aria-pressed', b.dataset.inicio === S.inicio));
  if (S.inicio === 'pecas') { if ($('#main').dataset.aba !== 'pecas') { $('#main').innerHTML = ''; $('#main').dataset.aba = 'pecas'; S.brutos.inicio = null; } return desenharCatalogo(); }
  $('#main').dataset.aba = 'projetos';
  const nomes = await listarPlacas();
  if (S.inicio !== 'projetos') return;
  const placas = await Promise.all(nomes.map(async nome => {
    const base = `../placas/${encodeURIComponent(nome)}/`;
    const [modelo, testes, versoes, cotacao] = await Promise.all(
      ['saida/modelo.json', 'testes.json', 'versoes/versoes.json', 'fabrica.json'].map(c => lerDe(base + c)));
    return { nome, modelo, testes, versoes: versoes || [], cotacao };
  }));
  placas.sort((a, b) => (b.versoes.at(-1)?.quando || '').localeCompare(a.versoes.at(-1)?.quando || ''));
  const cartoes = placas.map(p => {
    const v = p.versoes.at(-1);
    return `<a class="cartao" href="?placa=${encodeURIComponent(p.nome)}">
      ${p.modelo ? miniatura(p.modelo) : '<div class="sem-placa">ainda não foi gerada</div>'}
      <span class="titulo-cartao">${esc(p.testes?.objetivo?.titulo || p.nome)}</span>
      <span class="sub mono">placas/${esc(p.nome)}${v ? ` · v${v.v} · ${esc(v.quando)}` : ''}</span>
      <span class="selos">${selosDe(p.testes, p.modelo, p.cotacao)}</span>
    </a>`;
  }).join('');
  const cat = C.dado ? Object.values(C.dado.pecas) : null;
  const html = `<section class="inicio" aria-label="Projetos"><div class="miolo">
    <div><h1>Projetos</h1><span class="sub">${placas.length} ${placas.length === 1 ? 'placa' : 'placas'} em placas/</span></div>
    ${placas.length ? `<div class="cartoes">${cartoes}</div>` : '<p class="vazio">Nenhuma placa em <span class="mono">placas/</span> ainda.</p>'}
    ${cat ? `<button type="button" class="cartao catalogo-cartao" data-inicio="pecas"><span class="titulo-cartao">Peças →</span>
      <span class="sub">${cat.length} peças em ${Object.keys(C.dado.categorias).length} categorias · ${cat.filter(conferidaDe).length} prontas pra placa</span></button>` : ''}
  </div></section>`;
  if (html !== S.brutos.inicio) $('#main').innerHTML = S.brutos.inicio = html;   // so troca se mudou (nao engole clique)
}

// ---------- pecas: a lista de compras de sempre (ferramenta/catalogo/, um arquivo por categoria) ----------
const CORES_PT = { Red: 'vermelho', 'Orange Red': 'laranja-avermelhado', Orange: 'laranja', Yellow: 'amarelo', 'Yellow Green': 'verde-amarelado',
  Green: 'verde', 'Emerald Green': 'verde', Blue: 'azul', White: 'branco' };
const MONTAGEM = { furo: 'de furo', 'superfície': 'de superfície', 'módulo': 'módulo pronto', fio: 'vai no fio, não na placa', 'não informado': 'montagem não informada' };
// 'type|Type': o primeiro atributo que a peca tiver (a loja escreve o mesmo atributo de jeitos diferentes)
const atrib = (e, nome) => (nome || '').split('|').map(n => e.atributos?.[n]).find(v => v && v !== '-');
const emPt = (v, cat) => C.dado?.categorias?.[cat]?.traducoes?.[v] || C.dado?.traducoes?.[v] || CORES_PT[v] || v;   // a da categoria vale primeiro
const dia = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) : '?';
const preco = (v, moeda) => v == null ? '?' : `${moeda === 'BRL' ? 'R$' : 'US$'} ${v < 0.1 ? v.toFixed(4) : v.toFixed(2)}`.replace('.', ',');
const numeroDe = t => { const m = /^\s*([\d.]+)\s*([pnuµmkM]?)/.exec(t || ''); return m ? +m[1] * ({ p: 1e-12, n: 1e-9, u: 1e-6, 'µ': 1e-6, m: 1e-3, k: 1e3, M: 1e6 }[m[2]] || 1) : null; };

// um cartao de peca: o mesmo no carrinho e na aba Pecas
function cartaoPeca(e, o = {}) {
  const ruim = e.situacao && e.situacao !== 'ok';
  const extra = (o.destaques || []).map(k => atrib(e, k)).filter(Boolean).map(v => emPt(v, e.categoria));
  const outras = (e.outras_lojas || []).filter(x => /^https:\/\//.test(x.link || ''));
  return `<div class="opcao${o.escolhida ? ' escolhida' : ''}${ruim ? ' ruim' : ''}">
      <img src="${e.foto && /^https:\/\//.test(e.foto) ? esc(e.foto) : `/api/foto?codigo=${encodeURIComponent(e.codigo)}`}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <b>${esc(e.apelido || e.nome)}</b><span class="sub">${esc(e.marca)} · ${esc(e.modelo)}${e.loja === 'LCSC' || !e.loja ? ` · ${esc(e.codigo)}` : ''}</span>
      <span>${esc(e.tamanho || '')}${e.montagem ? ` · ${esc(MONTAGEM[e.montagem] || e.montagem)}` : ''}${extra.length ? ` · ${esc(extra.join(' · '))}` : ''}</span>
      <span class="sub">${preco(e.preco, e.moeda)} na ${esc(e.loja || 'LCSC')} · ${ruim ? `<span class="aviso">${esc(e.situacao)}</span>` : e.estoque != null ? `${milhar(e.estoque)} em estoque` : 'estoque não informado'} · visto ${dia(e.visto)}</span>
      ${outras.length ? `<span class="sub">também em: ${outras.map(x => `<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.loja)}${x.preco != null ? ' ' + preco(x.preco, x.moeda) : ''} ↗</a>`).join(', ')}</span>` : ''}
      <span class="sub">${o.conferida ? '✓ datasheet conferido' : 'datasheet ainda não conferido'}${/^https:\/\//.test(e.link || '') ? ` · <a href="${esc(e.link)}" target="_blank" rel="noopener">loja ↗</a>` : ''}</span>
      ${o.usos?.length ? `<span class="selo ok">em uso: ${esc(o.usos.join(', '))}</span>` : ''}
      ${o.acao || ''}
    </div>`;
}

async function postar(caminho, corpo) {
  try {
    const r = await fetch(caminho, { method: 'POST', headers: { 'X-Bancada': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
    const d = await r.json().catch(() => ({}));
    return r.ok ? d : { erro: d.erro || 'não deu certo' };
  } catch { return { erro: 'sem resposta do app (ele está aberto?)' }; }
}

const C = { dado: null, cat: 'tudo', texto: '', chip: null, soEstoque: true, soConferidas: false, soFuro: false, todas: false, recado: '', ocupado: false };

async function carregarCatalogo() {
  const d = await lerDe('/api/catalogo');
  if (d) C.dado = d;
  return C.dado;
}

const especDe = id => C.dado?.categorias?.[id] || {};
const conferidaDe = e => !!e.conferido || e.categoria === 'resistor';   // resistor: a loja ja diz tudo

function filtrarCatalogo() {
  const t = C.texto.trim().toLowerCase(), chips = especDe(C.cat).chips;
  return Object.entries(C.dado?.pecas || {}).map(([codigo, e]) => ({ codigo, ...e }))
    .filter(e => (C.cat === 'tudo' || e.categoria === C.cat) && (!C.soEstoque || e.situacao === 'ok')
      && (!C.soConferidas || conferidaDe(e)) && (!C.soFuro || e.montagem === 'furo')
      && (C.chip === null || atrib(e, chips) === C.chip)
      && (!t || [e.nome, e.apelido, e.modelo, e.marca, e.codigo, e.tamanho, e.descricao, especDe(e.categoria).nome].join(' ').toLowerCase().includes(t)))
    .sort((a, b) => (!!C.dado.usos[b.codigo] - !!C.dado.usos[a.codigo]) || (conferidaDe(b) - conferidaDe(a))
      || ((numeroDe(atrib(a, chips)) ?? 0) - (numeroDe(atrib(b, chips)) ?? 0)) || ((b.estoque ?? 0) - (a.estoque ?? 0)));
}

function desenharCatalogo() {
  const main = $('#main');
  if (!C.dado) { main.innerHTML = '<p class="vazio">Lendo o catálogo…</p>'; return; }

    main.innerHTML = `<section class="inicio catalogo" aria-label="Peças"><div class="miolo largo">

      <div class="cat-corpo"><nav class="cat-lado" id="cat-lado" aria-label="Categorias"></nav>
        <div class="cat-miolo">
          <p class="cat-explica" id="cat-explica"></p>
          <div class="filtros"><input type="search" id="cat-texto" placeholder="Procurar: ESP32, 100nF, verde, 1N4007…" autocomplete="off">
            <label><input type="checkbox" data-cat-toggle="soEstoque"> com estoque</label>
            <label><input type="checkbox" data-cat-toggle="soFuro"> só de furo</label>
            <label><input type="checkbox" data-cat-toggle="soConferidas"> só conferidas</label></div>
          <div class="chips" id="cat-chips"></div>
          <div id="cat-recado"></div>
          <div class="opcoes grande" id="cat-cards"></div>
          <div class="links" id="cat-acoes"></div>
        </div></div>
    </div></section>`;
  }
  const todas = Object.values(C.dado.pecas), cats = C.dado.categorias;
  $('#cat-resumo').textContent = `${todas.length} peças em ${Object.keys(cats).length} categorias · ${todas.filter(conferidaDe).length} prontas pra placa (datasheet conferido) · ${new Set(todas.map(e => e.loja || 'LCSC')).size} lojas · a loja online é o double check`;
  const grupos = {};
  for (const [id, s] of Object.entries(cats)) (grupos[s.grupo] ||= []).push([id, s]);
  const conta = id => todas.filter(e => e.categoria === id).length;
  $('#cat-lado').innerHTML = `<button type="button" data-cat="tudo" aria-pressed="${C.cat === 'tudo'}">Tudo <span class="sub">${todas.length}</span></button>` +
    Object.entries(grupos).sort((a, b) => (C.dado.grupos || []).indexOf(a[0]) - (C.dado.grupos || []).indexOf(b[0])).map(([g, lista]) => `<span class="grupo">${esc(g)}</span>` +
      lista.sort((a, b) => a[1].nome.localeCompare(b[1].nome)).map(([id, s]) =>
        `<button type="button" data-cat="${esc(id)}" aria-pressed="${C.cat === id}">${esc(s.nome)} <span class="sub">${conta(id)}</span></button>`).join('')).join('');
  const spec = especDe(C.cat);
  $('#cat-explica').textContent = C.cat === 'tudo' ? 'Tudo que a gente já viu nas lojas. Escolha uma categoria do lado ou procure por nome, valor ou código.' : (spec.explica || '');
  document.querySelectorAll('[data-cat-toggle]').forEach(el => { el.checked = C[el.dataset.catToggle]; });
  let chips = '';
  if (spec.chips) {
    const valores = [...new Set(todas.filter(e => e.categoria === C.cat).map(e => atrib(e, spec.chips)).filter(Boolean))]
      .sort((a, b) => (numeroDe(a) ?? Infinity) - (numeroDe(b) ?? Infinity) || a.localeCompare(b));
    if (valores.length > 1) chips = `<button type="button" data-cat-chip="" aria-pressed="${C.chip === null}">todos</button>` +
      valores.map(v => `<button type="button" data-cat-chip="${esc(v)}" aria-pressed="${C.chip === v}">${esc(emPt(v, C.cat))}${spec.chips === 'Size' && /^[\d.]+$/.test(v) ? '″' : ''}</button>`).join('');
  }
  $('#cat-chips').innerHTML = chips;
  $('#cat-recado').innerHTML = C.recado ? `<p class="aviso">${esc(C.recado)}</p>` : '';
  const lista = filtrarCatalogo(), mostra = C.todas ? lista : lista.slice(0, 48);
  $('#cat-cards').innerHTML = mostra.map(e => cartaoPeca(e, { destaques: especDe(e.categoria).destaques, conferida: conferidaDe(e), usos: C.dado.usos[e.codigo],

    || '<span class="vazio-op sub">Nada no catálogo com esse filtro.</span>';
  const semente = spec.sementes?.[0]?.busca || '';
  const conferiveis = mostra.slice(0, 60);
  $('#cat-acoes').innerHTML = `${lista.length > mostra.length ? `<button type="button" data-cat-todas>Mostrar todas as ${lista.length}</button>` : ''}

    ${C.cat !== 'tudo' ? `<span class="procurar"><input type="search" id="cat-busca" value="${esc(semente)}" aria-label="Procurar na loja">
    <button type="button" data-buscar-loja ${C.ocupado ? 'disabled' : ''}>Procurar mais na loja</button></span>` : ''}`;
}

async function acaoCatalogo(caminho, corpo, durante) {
  C.ocupado = true; C.recado = durante; desenharCatalogo();
  const d = await postar(caminho, corpo);
  C.recado = d.erro ? d.erro : caminho.endsWith('checar')
    ? `Conferi ${d.conferidas} na loja agora${d.mudaram.length ? `: ${d.mudaram.length} mudaram de preço, estoque ou situação` : ', nada mudou'}.${d.ficaram ? ` ${d.ficaram} de lojas brasileiras ficaram pra depois (elas pedem 10 s entre páginas).` : ''}`
    : `A loja achou ${d.achadas} que servem; ${d.novas} eram novas e entraram no catálogo.`;
  await carregarCatalogo();
  C.ocupado = false; desenharCatalogo();
}

}

const pinoDoBloco = b => !b?.pino ? 'o pino' : `${b.pino}${b.no_cerebro?.serigrafia && b.no_cerebro.serigrafia !== b.pino ? ` (${b.no_cerebro.serigrafia})` : ''}`;

// o que falta conferir: sempre à vista, com o assunto na frente e o detalhe em letra pequena

function pendenteHTML(texto) {

// a linha do resistor do carrinho contra o da conta (igual à da lanterninha)
function bateHTML(c, peca, sugerido = c.padrao) {
  if (!peca || c.bate == null || !sugerido) return '';

    : `<span class="nao-bate">✗ o do carrinho é ${ohmsTxt(peca.valor)}: troque pelo de ${ohmsTxt(sugerido)}</span>`;

// o LED que passa da força do pino: o resistor desta conta reprova, então a linha nunca manda comprar ele

  if (!peca || c.bate == null || !c.padrao) return '';

    : `<span class="sub">O do carrinho é ${ohmsTxt(peca.valor)}. Não compre o de ${ohmsTxt(c.padrao)} desta conta: ele passa da força padrão do pino.</span>`;
}

    ${c.passa_do_pino ? `<span class="nao-bate">✗ ${esc(comMaiuscula(c.aviso || `passa da força padrão do pino (~${mA(c.i_pino)} mA)`))}.</span>`
      : c.pior ? `<span class="bate">✓ No pior caso (3V3 em ${mm(c.pior.v, 3)} V e o LED que acende com menos tensão) são ${mA(c.pior.i)} mA: abaixo da força padrão do pino (~${mA(c.i_pino)} mA).</span>` : ''}

}

    ${c.faixa ? `<span>Pra esse olho de luz servem de ${ohmsTxt(c.faixa.de)} a ${ohmsTxt(c.faixa.ate)} (o LDR do meio na faixa boa de 1 a 100 lux e, em 10 lux, os dois cantos também)${c.padrao ? `: <b>${ohmsTxt(c.padrao)}</b>` : ''}.</span>` : ''}
    ${c.origem && c.padrao ? `<span class="sub">Por que ${ohmsTxt(c.padrao)}: ${esc(c.origem)}.</span>` : ''}
    ${um && p1 ? `<span class="sub">Em 1 lux a conta dá o LDR de ${ohmsCurto(um.cantos.min.ohms)} a ${ohmsCurto(um.cantos.max.ohms)}; o gráfico do datasheet dá de ${ohmsCurto(p1.r_min)} a ${ohmsCurto(p1.r_max)} (a página está em "De onde vêm os números").</span>` : ''}
    ${c.aviso ? `<span class="aviso">${esc(comMaiuscula(c.aviso))}.</span>` : ''}
    ${bateHTML(c, peca)}
    ${rodapeDaConta({ ...c, fontes: { ...c.fontes, ...(p1?.fonte ? { ponto_1lux: [p1.fonte] } : {}) } })}
  </div>`;
}

// o som: pino → resistor → piezo → GND; o pico é a borda do apito, quando o piezo vira um fio por um instante
function contaDoPiezoHTML(c, peca, alvo) {
  return `<div class="conta">
    <span>${esc(pinoDoBloco(alvo))} → <b>${ohmsTxt(c.ohms)}</b> → ${esc(comApelido(alvo, c.para))} → GND. Parado, o piezo não deixa passar corrente; no instante em que o apito vira, ele é um fio e só o resistor e o pino seguram: pico de <span class="faixa-ma ${c.passa_do_pino ? 'passa' : 'ok'}">${mA(c.pico)} mA</span>.</span>
    <span class="${c.passa_do_pino ? 'nao-bate' : 'bate'}">${c.passa_do_pino ? '✗' : '✓'} No pior caso (3V3 em ${mm(c.pior.v, 3)} V) são ${mA(c.pior.i)} mA: ${c.passa_do_pino ? 'passa da' : 'abaixo da'} força padrão do pino (~${mA(c.i_pino)} mA).</span>
    <span>O fabricante pede de ${ohmsTxt(c.r_serie[0])} a ${ohmsTxt(c.r_serie[1])} em série com o pino: <b>${ohmsTxt(c.padrao)}</b>.</span>
    ${c.origem && c.origem !== c.nota ? `<span class="sub">Por que ${ohmsTxt(c.padrao)}: ${esc(c.origem)}.</span>` : c.nota ? `<span class="sub">${esc(comMaiuscula(c.nota))}.</span>` : ''}
    ${bateHTML(c, peca)}
    ${rodapeDaConta(c)}
  </div>`;
}

// o botão: GPIO (com o pull-up de dentro) → resistor → botão → GND
function contaDoBotaoHTML(c, peca, alvo) {
  return `<div class="conta">
    <span>${esc(pinoDoBloco(alvo))} → <b>${ohmsTxt(c.ohms)}</b> → ${esc(comApelido(alvo, c.para))} → GND. Solto, o pull-up de dentro do cérebro (${ohmsTxt(c.r_pull)}) segura o pino em 1; apertado, o botão puxa pro GND.</span>
    <span class="${c.le_zero ? 'bate' : 'nao-bate'}">${c.le_zero ? '✓' : '✗'} Apertado, o pino fica em ${mm(c.v_apertado, 2)} V: ${c.le_zero ? 'lê 0' : 'não chega a ler 0'} (até ${mm(c.vil, 2)} V o pino lê 0).</span>
    <span class="${c.passa_do_pino ? 'nao-bate' : 'bate'}">${c.passa_do_pino ? '✗' : '✓'} Se o pino virar saída em 1 com o botão apertado (um erro no programa ou uma ponte de solda), passam <span class="faixa-ma ${c.passa_do_pino ? 'passa' : 'ok'}">${mA(c.curto.i)} mA</span>: ${c.passa_do_pino ? 'passa da' : 'abaixo da'} força padrão do pino (~${mA(c.i_pino)} mA).</span>
    ${c.origem ? `<span>Por que <b>${ohmsTxt(c.padrao)}</b>: ${esc(c.origem)}.</span>`   // a origem já diz a faixa
      : `<span>Serve de ${ohmsTxt(Math.round(c.faixa.de))} a ${ohmsTxt(Math.round(c.faixa.ate))}: <b>${ohmsTxt(c.padrao)}</b>.</span>`}
    ${bateHTML(c, peca)}
    ${rodapeDaConta(c)}
  </div>`;
}

function fotoDa(peca) {
  if (/^https:\/\//.test(peca?.foto || '')) return `<img class="foto" src="${esc(peca.foto)}" alt="" loading="lazy">`;   // loja do Brasil: a foto da página dela
  if (peca?.foto) return `<img class="foto" src="${BASE}pecas/${encodeURIComponent(peca.foto)}" alt="" loading="lazy">`;
  return peca ? `<img class="foto" src="/api/foto?codigo=${encodeURIComponent(peca.codigo)}" alt="" loading="lazy">` : '<span class="sem-foto"></span>';
}

// a conta de cada resistor: o freio do LED (na pilha ou no pino do cérebro), o olho de luz, o som e o botão.
// alvo = o bloco que o resistor atende (o 'led' ou o 'para' dele)
function contaHTML(c, peca, alvo) {
  if (!c) return '';
  if (c.falta) return `<div class="conta"><span>Pra fazer a conta do resistor falta: ${esc(c.falta.join(', '))}.</span></div>`;
  if (c.fonte === 'pino') return contaDoLedHTML(c, peca, alvo);
  if (c.tipo === 'divisor') return contaDoDivisorHTML(c, peca, alvo);
  if (c.tipo === 'piezo') return contaDoPiezoHTML(c, peca, alvo);
  if (c.tipo === 'botao') return contaDoBotaoHTML(c, peca, alvo);
  if (c.impossivel) return `<div class="conta"><span class="nao-bate">Essa pilha não tem força pra esse brilho, nem sem resistor.</span></div>`;
  const resto = c.r_s + c.r_interna;
  const horas = c.mah && c.i_padrao > 0 ? c.mah / (c.i_padrao * 1000) : null;
  return `<div class="conta">
    <span>Você pediu luz <b>${esc(c.resposta === 'media' ? 'média' : c.resposta)}</b>: ${FRACAO[c.resposta]} brilho que o fabricante anuncia. Pela curva do LED, isso é ≈ ${mA(c.i)} mA.</span>
    <span class="mono">(pilha − LED) ÷ corrente = (${volts(c.v)} − ${mm(c.joelho)}) ÷ ${mA(c.i)} mA ≈ ${Math.round(c.ohms + resto)} Ω</span>
    <span>O LED e a pilha já freiam ${mm(resto, 1)} Ω sozinhos, então o resistor fica com ≈ ${Math.round(c.ohms)} Ω. O valor de loja mais perto é <b>${ohmsTxt(c.padrao)}</b>: dá ${mA(c.i_padrao)} mA, ≈ ${Math.round(c.brilho * 100)}% do brilho do anúncio${horas ? `, e a pilha dura no máximo ≈ ${horas.toFixed(0)} h com o botão apertado` : ''}.</span>
    ${c.i_testada && c.i_padrao > c.i_testada ? `<span class="aviso">Acima dos ${mA(c.i_testada)} mA que o fabricante da pilha testou: funciona, mas ela rende menos que isso.</span>` : ''}
    ${peca ? (c.bate ? `<span class="bate">✓ o resistor do carrinho é esse</span>` : `<span class="nao-bate">✗ o do carrinho é ${ohmsTxt(peca.valor)}: troque pelo de ${ohmsTxt(c.padrao)}</span>`) : ''}
  </div>`;
}

function opcoesHTML(ref) {

      <a href="./?pecas">Ver todas as peças →</a></div></div>`;
}

// ---- passo 2 com o cérebro: a estrela. O cérebro no meio e um ramo por bloco ligado num pino dele;
// o resistor (e o capacitor) entra no ramo do bloco que ele atende ('led' ou 'para')
const minusculo = n => n === n.toUpperCase() ? n : n[0].toLowerCase() + n.slice(1);   // 'Botão' → 'botão'; 'LED' fica
function ramosDa(pj) {
  const atende = b => b.bloco !== 'cerebro' && pj.blocos.some(x => x.ref === (b.led || b.para)) ? (b.led || b.para) : null;
  return pj.blocos.filter(b => b.bloco !== 'cerebro' && !atende(b)).map(b => ({ b, ajudantes: pj.blocos.filter(x => atende(x) === b.ref) }));
}
function caminhoDoRamo(b, ajudantes) {   // "GPIO32 (D32) → 130 Ω → LED → GND"
  if (b.bloco === 'resistor') return { txt: `falta dizer pra que serve o ${b.ref} ('led' ou 'para' no projeto.json)`, falta: true };
  if (!b.pino) return { txt: 'sem pino ainda: falta dizer em qual GPIO do cérebro ele liga', falta: true };
  const freio = ajudantes.filter(x => x.bloco === 'resistor')
    .map(x => x.peca?.valor ? ohmsTxt(x.peca.valor) : x.conta?.padrao ? ohmsTxt(x.conta.padrao) : `${x.ref} ${x.conta?.impossivel ? 'impossível' : 'sem conta'}`)
    .join(' + ') || 'sem resistor';
  const outros = ajudantes.filter(x => x.bloco !== 'resistor').map(x => `${minusculo(x.nome)} ${x.ref} colado no pino`);
  const ramo = b.bloco === 'ldr' ? `3V3 → ${freio} → ${pinoDoBloco(b)} → ${minusculo(b.nome)} → GND` : `${pinoDoBloco(b)} → ${freio} → ${minusculo(b.nome)} → GND`;
  return { txt: ramo + (outros.length ? ` · ${outros.join(', ')}` : '') };
}
function estrelaHTML(pj, corDe) {
  const cerebro = pj.blocos.find(b => b.bloco === 'cerebro'), ramos = ramosDa(pj);
  const nE = Math.max(Math.ceil(ramos.length / 2), 1), nD = ramos.length - Math.ceil(ramos.length / 2);
  const meias = 2 * nE, desce = nE - nD;   // em meias linhas; com número ímpar de ramos, os da direita descem meia linha
  const raios = [], cards = ramos.map(({ b, ajudantes }, i) => {
    const esq = i < nE, linha = 2 * (esq ? i : i - nE) + (esq ? 0 : desce) + 1;
    raios.push(`<line x1="50" y1="50" x2="${esq ? 15 : 85}" y2="${(100 * linha / meias).toFixed(2)}"/>`);
    const cam = caminhoDoRamo(b, ajudantes), cor = COR_DE_TELA[corDe(b.ref)];
    return `<div class="bloco ramo" style="grid-column:${esq ? 1 : 3};grid-row:${linha} / span 2">
      <span class="icone"${cor ? ` style="color:${cor}"` : ''}>${icone(b.bloco)}</span><span class="funcao">${esc(b.funcao)} · ${esc(b.ref)}</span>
      <b>${esc(b.apelido || b.nome)}</b><span class="caminho-ramo${cam.falta ? ' falta' : ''}">${esc(cam.txt)}</span></div>`;
  });
  return `<div class="estrela" style="grid-template-rows:repeat(${meias}, 1fr)">
      <svg class="raios" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${raios.join('')}</svg>
      <div class="bloco centro"><span class="icone">${icone('cerebro')}</span><span class="funcao">${esc(cerebro.funcao)} · ${esc(cerebro.ref)}</span>
        <b>${esc(cerebro.apelido || cerebro.nome)}</b><span class="por-que">${esc(cerebro.peca?.nome || 'falta escolher o DevKit')}</span></div>
      ${cards.join('')}</div>`;
}

// ---- passo 1 com o cérebro: a resposta de cada LED (o brilho geral pode ter ajuste por LED; a cor é sempre de um LED)
function brilhoPorLedHTML(q, pj, corDe) {
  const nome = id => q.opcoes.find(o => o.id === id)?.nome || id;
  const conta = ref => pj.blocos.find(b => b.bloco === 'resistor' && b.led === ref)?.conta || {};
  return `<ul class="por-led">${q.por_led.map(x => `<li><span class="mono">${esc(x.ref)}</span>${bolinha(corDe(x.ref))}<span>${esc(x.apelido || 'LED')}</span>
      ${x.resposta ? `<b>${esc(nome(x.resposta))}</b>` : '<span class="aviso">falta responder</span>'}<span class="sub">${x.do_led ? 'só dele' : 'a resposta geral'} · ${esc(quemDecidiu(x.quem))}</span>
      ${x.impossivel ? '<span class="nao-bate">impossível neste LED</span>' : conta(x.ref).passa_do_pino ? '<span class="nao-bate">passa da força padrão do pino</span>' : ''}</li>`).join('')}</ul>
    <span class="sub">Os botões mudam a resposta geral; o ajuste de um LED só (o "só dele") fica, e quem grava é o Claude: é só pedir.</span>`;
}
function corPorLedHTML(q) {

  return `<div class="pergunta"><span class="pergunta-txt">${esc(q.texto)}</span>
    <ul class="por-led">${(q.por_led || []).map(x => `<li><span class="mono">${esc(x.ref)}</span>${bolinha(x.resposta || x.da_peca)}<span>${esc(x.apelido || 'LED')}</span>
      ${x.resposta ? `<b>${esc(x.resposta)}</b><span class="sub">${esc(quemDecidiu(x.quem))}</span>` : '<span class="aviso">falta responder</span>'}
      ${x.bate === false ? `<span class="nao-bate">✗ a peça do carrinho é ${esc(x.da_peca)}: troque o LED ou a cor</span>`
        : x.bate ? `<span class="bate">✓ a peça do carrinho é ${esc(x.da_peca)}</span>`
        : x.da_peca ? `<span class="sub">a peça do carrinho é ${esc(x.da_peca)}</span>` : '<span class="sub">ainda sem peça</span>'}</li>`).join('')}</ul>
    <span class="sub">${conferidas.length ? `Cores com LED de datasheet conferido no catálogo: ${esc(conferidas.join(', '))}. ` : ''}A cor de cada LED, quem grava é o Claude: é só pedir.</span></div>`;
}

// ---- passo 3 com o cérebro: onde o bloco liga, o que vai junto com o DevKit e o total em R$ + US$
function noPinoTxt(b) {
  const p = b.no_cerebro;
  return p ? `no pino ${p.pino} do DevKit, onde está escrito ${p.serigrafia || b.pino} (${b.pino})${p.cuidado ? ` · ${p.cuidado}` : ''}` : `no ${b.pino} do cérebro`;
}
function acompanhaHTML(lista) {

  return `<div class="acompanha"><span class="sub">Vai junto (o DevKit encaixa nelas; não entram no placa.txt):</span>
    ${lista.map(a => {
      const alt = a.alternativa_peca;
      return `<span>${a.qtd || 1} × <b>${esc(a.nome || a.codigo)}</b></span>
      <span class="sub">${esc(a.codigo)} · ${a.preco != null ? `${preco(a.preco, a.moeda)} cada${a.minimo > 1 ? ` (mínimo ${a.minimo})` : ''} = ${preco(a.subtotal, a.moeda)}` : 'sem preço no catálogo'}${a.estoque != null ? ` · ${milhar(a.estoque)} em estoque` : ''}${a.conferido ? ' · ✓ desenho conferido' : ''}</span>
      ${a.situacao && a.situacao !== 'ok' ? `<span class="aviso">${esc(a.situacao)}</span>` : ''}
      ${a.no_catalogo === false ? pendenteHTML(`${a.codigo}: não está no catálogo, sem preço nem desenho conferido`) : a.conferido === false ? pendenteHTML(`${a.codigo}: o desenho da barra ainda não foi conferido`) : ''}
      ${links(link(a.link, `A barra ${naLoja(a.link)} ↗`), link(a.datasheet, 'Desenho da barra ↗'))}
      ${alt ? `<span class="sub">Se faltar: ${esc(alt.codigo)}${alt.nome ? ` (${esc(alt.nome)})` : ''}, ${alt.preco != null ? `${preco(alt.preco, alt.moeda)} cada` : 'sem preço'}${alt.situacao && alt.situacao !== 'ok' ? ` · ${esc(alt.situacao)}` : ''}</span>
      ${links(link(alt.link, `A outra barra ${naLoja(alt.link)} ↗`), link(alt.datasheet, 'Desenho da outra barra ↗'))}` : ''}`;
    }).join('')}</div>`;
}
function totalHTML(pj, extras) {
  const t = pj.totais || {};
  if (!(t.BRL > 0))   // tudo na LCSC (a lanterninha): igual a antes
    return `<span class="total">Peças: <b>${dolar(pj.total)}</b> (uma de cada, na LCSC, a loja irmã da JLCPCB)${extras.length ? ` + ${esc(extras.join(', '))}` : ''}. A fábrica entrega só a placa nua: as peças você solda em casa.</span>`;
