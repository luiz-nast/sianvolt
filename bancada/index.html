function preencherPainel(m, sim) {
  const q = sel => $('aside.painel ' + sel.replace(/="([^"]*)"/g, (_, v) => `="${CSS.escape(v)}"`));
  const pilhas = porModelo(m, 'pilha');
  const aj = S.ajustes, c = pinosDoCerebro(m), e3 = c?.u.eletrica;
  const com = v => simular(m, { ...ajustesDoSimular(m), pilha: Object.fromEntries(pilhas.map(p => [p.ref, p.eletrica[v]])) });
  // a faixa de cada LED: entre a pilha fraca e a nova; com o cérebro, a mesma da etapa 4 e do Carrinho: no 3V3 do meio, do
  // LED de vf mais alto (vf_max, a menor corrente) ao de vf mais baixo (vf_min, a maior); e o pior caso, com o 3V3 no máximo
  const [fraca, nova] = c ? [ouNada(() => simLigado(comVf(m, 'vf_max'))), ouNada(() => simLigado(comVf(m, 'vf_min')))] : [com('v_min'), com('v_max')];
  const pior = c && positivo(e3.vdd_max) ? ouNada(() => simLigado(comVf(m, 'vf_min'), e3.vdd_max)) : null;
  if (c) preencherPinos(m, c, sim, q);
  for (const p of pilhas) {
    const v = aj.pilha[p.ref] ?? p.eletrica.v;
    q(`[data-txt-pilha="${p.ref}"]`).textContent = `${volts(v)} V`;
    const r = q(`[data-pilha="${p.ref}"]`);
    if (+r.value !== v) r.value = v;
    const i = sim?.pecas[p.ref]?.i ?? 0;
    const horas = i > 1e-6 ? p.eletrica.mah / (i * 1000) : null;
    q(`[data-gasto="${p.ref}"]`).textContent = `${mA(i)} mA${horas && horas < 1e5 ? ` · dura no máximo ≈ ${horas < 100 ? horas.toFixed(0) : Math.round(horas / 24) + ' dias ou ' + horas.toFixed(0)} h assim` : ''}`;
  }
  for (const p of porModelo(m, 'chave')) {
    const b = q(`[data-chave="${p.ref}"]`), ap = !!aj.chave[p.ref];
    b.setAttribute('aria-pressed', ap);
    b.textContent = `Botão ${p.ref} · ${ap ? 'apertado' : 'solto'}`;
  }
  for (const p of porModelo(m, 'resistor')) {
    const ohms = aj.resistor[p.ref] ?? p.valor;
    q(`[data-txt-resistor="${p.ref}"]`).textContent = ohmsTxt(ohms);
    const r = q(`[data-resistor="${p.ref}"]`), lista = r.dataset.lista.split(',').map(Number);
    if (lista[+r.value] !== ohms) r.value = lista.indexOf(ohms);
    const pw = sim?.pecas[p.ref]?.p ?? 0, max = p.eletrica.potencia_max;
    const b = q(`[data-pot="${p.ref}"]`);
    b.textContent = `${mW(pw)} mW, aguenta ${mW(max)} mW${pw > max ? ' · QUEIMA' : ''}`;
    b.className = pw > max ? 'queima' : 'ok';
  }
  for (const p of porModelo(m, 'led')) {
    const r = sim?.pecas[p.ref], e = p.eletrica, topo = e.i_max * 1.15;
    const pct = i => `${Math.min(100, Math.max(0, i / topo * 100)).toFixed(1)}%`;
    const b = q(`[data-led="${p.ref}"]`);
    if (!r) { b.textContent = '?'; continue; }
    const est = estadoLed(r), brilho = brilhoDaCorrente(e, r.i);
    b.textContent = `${mA(r.i)} mA · ${TEXTO_LED[est]}${brilho !== null && r.i > 0 ? ` · ≈ ${Math.round(brilho * 100)}% do anúncio` : ''}`;
    b.className = est;
    const iF = fraca?.pecas[p.ref]?.i ?? 0, iN = nova?.pecas[p.ref]?.i ?? 0, de = Math.min(iF, iN), ate = Math.max(iF, iN);
    // a faixa: verde até o limite do LED; o pedaço que passa do limite, vermelho (e a legenda diz)
    const f = q(`[data-faixa="${p.ref}"]`), fq = q(`[data-faixa-q="${p.ref}"]`), corte = Math.min(ate, Math.max(de, e.i_max));
    f.style.left = pct(de); f.style.width = `calc(${pct(corte)} - ${pct(de)})`;
    fq.style.left = pct(corte); fq.style.width = `calc(${pct(ate)} - ${pct(corte)})`;
    q(`[data-marca="${p.ref}"]`).style.left = pct(r.i);
    q(`[data-teste="${p.ref}"]`).style.left = pct(e.i_teste);
    q(`[data-limite="${p.ref}"]`).style.left = pct(e.i_max);
    const faixa = ate < 1e-6 ? 'nenhuma agora, o LED está apagado'
      : c ? faixaNoPino(e, e3, iF, iN, pior?.pecas[p.ref]?.i) : `de ${mA(de)} a ${mA(ate)} mA entre pilha fraca e nova`;
    const passa = ate > e.i_max ? ` (o pedaço vermelho passa dos ${mA(e.i_max)} mA: queima)` : '';
    q(`[data-legenda="${p.ref}"]`).textContent = `faixa: ${faixa}${passa} · risquinho: ${mA(e.i_teste)} mA, onde o datasheet mediu · vermelho: ${mA(e.i_max)} mA, acima disso queima`;
  }
  // a conta, quando o circuito e o classico pilha + botao + resistor + LED em serie
  const leds = porModelo(m, 'led'), resistores = porModelo(m, 'resistor');
  const formula = q('[data-formula]');
  if (c) {   // com o cérebro: uma conta por LED, o pino no lugar da pilha
    const linhas = sim ? contasDosPinos(m, c, sim) : [];
    formula.replaceChildren(...linhas.map(t => Object.assign(document.createElement('span'), { className: 'linha', textContent: t })));
  } else if (pilhas.length === 1 && leds.length === 1 && resistores.length === 1 && sim) {
    const v = aj.pilha[pilhas[0].ref] ?? pilhas[0].eletrica.v, ohms = aj.resistor[resistores[0].ref] ?? resistores[0].valor;
    const r = sim.pecas[leds[0].ref], j = joelho(leds[0].eletrica);
    const rp = pilhas[0].eletrica.r_interna || 0;
    formula.textContent = r.acende
      ? `corrente = (pilha − LED) ÷ (resistor${rp ? ' + pilha' : ''}) = (${volts(v)} − ${mm(r.v)}) ÷ ${rp ? `(${ohms} + ${rp})` : ohms} = ${mA(r.i)} mA`
      : (v <= j ? `a pilha (${volts(v)} V) não passa dos ${volts(j)} V que o LED pede pra começar: ele fica apagado` : 'o circuito está aberto: a corrente não tem por onde passar');
  } else formula.textContent = '';
}

function alternarLigado() {
  const m = modeloVisto();
  if (!S.ligado && (!m || motivoSemSimulacao(m))) return;   // desligar pode sempre; ligar so quando da
  S.ligado = !S.ligado;
  if (S.ligado) { S.ajustes = novosAjustes(); S.sel = null; }
  desenhar();
}

// requisitos (do testes.json) que citam essa peca
function requisitosDa(ref) {
  return (S.testes?.objetivo?.itens || []).filter(i => i.pecas.includes(ref)).map(i => `${i.id} ${i.titulo}`).join(' · ');
}

// o que o inspetor mostra pra cada coisa clicada
function agoraDe(m, ref, sim) {
  const p = m.pecas.find(q => q.ref === ref), r = sim?.pecas[ref];
  if (p?.eletrica?.modelo === 'mcu' && sim) return `agora: o 3V3 entrega ${mA(soma3v3(sim))} mA`;
  if (!p?.eletrica || !r) return '';
  switch (p.eletrica.modelo) {
    case 'ldr': return `agora: ${ohmsCurto(r.ohms)} · ${mA(Math.abs(r.i))} mA passando`;
    case 'piezo': return `agora: ${r.fio ? `na virada do apito, ${mA(Math.abs(r.i))} mA` : 'parado, não passa corrente'}`;
    case 'led': return `agora: ${mA(r.i)} mA · ${TEXTO_LED[estadoLed(r)]}`;
    case 'resistor': return `agora: ${mA(Math.abs(r.i))} mA passando · esquenta ${mW(r.p)} mW, aguenta ${mW(p.eletrica.potencia_max)} mW`;
    case 'pilha': return `agora: ${volts(r.v)} V · entrega ${mA(r.i)} mA`;
    case 'chave': return `agora: ${r.apertada ? 'apertado, passando ' + mA(Math.abs(r.i)) + ' mA' : 'solto, não passa nada'}`;
  }
  return '';
}

function inspecionar(m, sel, sim) {
  if (sel.k === 'peca') {
    const p = m.pecas.find(q => q.ref === sel.ref);
    if (!p) return null;
    const outros = x => [...new Set(pinosDaNet(m, x.net).filter(n => n.split('.')[0] !== p.ref).map(n => nomePino(m, n)))];   // de outras pecas
    const usados = p.pinos.filter(x => x.net && outros(x).length);
    const rotulo = x => x.nome ? (p.pinos.filter(y => y.nome === x.nome).length > 1 ? `Lado ${x.nome}` : x.nome) : `Pino ${x.n}`;
    let linhas;
    if (p.pinos.length > 4) {
      linhas = [['Pinos', String(p.pinos.length)], ['Usados', String(usados.length)], ...usados.map(x => [rotulo(x), outros(x).join(', ')])];
    } else {
      const vistos = new Set();   // os dois pinos do mesmo lado do botao viram uma linha so
      linhas = p.pinos.filter(x => !vistos.has(rotulo(x)) && vistos.add(rotulo(x)))
        .map(x => [rotulo(x), outros(x).join(', ') || 'nada ainda']);
    }
    if (p.valor_txt) linhas.push(['Valor', ohmsTxt(+p.valor_txt)]);
    if (p.loja) linhas.push(['Tamanho', p.loja.tamanho || '—'], ['Preço', p.loja.preco != null ? `US$ ${String(p.loja.preco).replace('.', ',')} cada` : '—']);
    linhas.push(['Posição', `${mm(p.x, 1)}, ${mm(p.y, 1)} mm`]);
    if (p.exemplo) linhas.push(['Medidas', 'de exemplo, sem datasheet', true]);
    if (p.pendente?.length) linhas.push(['Falta conferir', p.pendente.join('; '), true]);
    const bloco = S.projeto?.blocos.find(b => b.ref === p.ref);
    return { tipo: `${p.ref}${bloco ? ' · ' + bloco.funcao : ''}`, titulo: p.nome, nomePeca: true, linhas, linha: p.linha,
      explica: p.explica, agora: agoraDe(m, p.ref, sim), loja: p.loja, compra: p.compra };
  }
  if (sel.k === 'pino') {
    const [ref, n] = sel.nome.split('.');
    const p = m.pecas.find(q => q.ref === ref), pino = pinoDe(m, sel.nome);
    if (!pino) return null;
    const outros = pinosDaNet(m, pino.net).filter(x => x !== sel.nome);
    const dentro = (p.juntos || []).filter(par => par.includes(n)).map(par => `${ref}.${par[0] === n ? par[1] : par[0]}`);
    const fora = [...new Set(outros.filter(x => !dentro.includes(x)).map(x => nomePino(m, x)))];
    const linhas = [['Ligado a', fora.join(', ') || 'nada ainda'], ['Net', pino.net || '—'],
      ['Furo', pino.furo ? `${mm(pino.furo)} mm (passante)` : 'não (superfície)'], ['Posição', `${mm(pino.x)}, ${mm(pino.y)} mm`]];
    const quem = { '+': 'o positivo', '−': 'o negativo' }[pino.nome];
    let explica = quem ? `É ${quem} de ${ref} (${p.nome}). ` : dentro.length ? `É o lado ${pino.nome} de ${ref} (${p.nome}). ` : `${nomePino(m, sel.nome)}, ${p.nome}. `;
    if (dentro.length) explica += `Os dois pinos do lado ${pino.nome} são ligados por dentro: contam como um só. `;
    if (pino.net === 'GND') explica += 'Está no GND, o terra: o 0 V de referência de todo o circuito.';
    else if (!fora.length) explica += dentro.length ? 'Por fora, ainda não vai pra lugar nenhum.' : 'Ainda não está ligado em nada.';
    else explica += `A trilha leva o sinal dele até ${fora.join(', ')}; tudo isso é a mesma net (${pino.net}).`;
    let agora = '';
    if (sim?.nets && pino.net in sim.nets) agora = `agora: ${volts(sim.nets[pino.net])} V neste pino`;
    return { tipo: `${p.nome} · pino ${n}`, titulo: nomePino(m, sel.nome), linhas, linha: p.linha, explica, agora };
  }
  if (sel.k === 'trilha') {
    const t = m.trilhas[sel.i];
    if (!t) return null;
    const comp = Math.hypot(t.x2 - t.x1, t.y2 - t.y1);
    const i_t = sim ? correnteNaTrilha(m, sim, t) : null;
    return { tipo: 'Trilha', titulo: `${nomePino(m, t.de)} → ${nomePino(m, t.ate)}`, linha: t.linha,
      linhas: [['Net', t.net], ['Lado', t.lado === 'baixo' ? 'embaixo da placa (azul)' : 'em cima'], ['Largura', `${mm(t.largura)} mm`], ['Comprimento', `${mm(comp, 1)} mm`]],
      explica: 'Um caminho de cobre na placa: é o fio que liga um pino no outro. Sai reto quando dá; quando outra coisa está no caminho, desvia, ou passa pro outro lado da placa por uma via (o furinho de cobre) e volta.',
      agora: i_t === null ? '' : (Math.abs(i_t) > 1e-6 ? `agora: ${mA(Math.abs(i_t))} mA passando` : 'agora: nada passando') };
  }
  if (sel.k === 'furo') {
    const f = m.furos[sel.i];
    if (!f) return null;
    const linhas = [['Diâmetro', `${mm(f.d, 1)} mm`], ['Posição', `${mm(f.x, 1)}, ${mm(f.y, 1)} mm`]];
    if (f.d >= 3.1 && f.d <= 3.4) linhas.splice(1, 0, ['Parafuso', 'M3']);
    return { tipo: 'Furo', titulo: 'Fixação', linhas, linha: f.linha,
      explica: 'Furo sem cobre pra prender a placa numa caixa ou base com parafuso.' };
  }
  return null;
}

// ---------- ▶ Programa: a régua do tempo (só lê; quem roda o programa é a etapa 8 ou o app) ----------
// O codigo/main.py rodou no gêmeo do ESP32 (o laboratório) e virou o saida/programa.json (o roteiro de teste, com as
// conferências) ou o saida/programa_livre.json (o do app, sem elas). O GET /api/programa devolve o mais novo dos dois,
// ou {rodando: true}. A régua vai de 0 ao tempo_ms; no instante t a placa mostra cada LED com a luz e a cor dele, e o
// painel, o que cada GPIO fazia, a serial até t, os avisos, o erro (com a linha do main.py) e as conferências
function novoPrograma() {
  // aindaNao: o GET disse que o programa ainda não rodou (o porquê olha a etapa 8: faltaDoPrograma)
  return { aberto: false, tem: null, temDe: null, dado: null, versao: 0, bruto: null, rodando: false, falta: '', aindaNao: false, lendo: false,
    proxima: 0, leu: 0, t: 0, tocando: false, vez: 0, vel: 1, main: null, desenhado: null, quando: 0,
    // Rodar de novo: o pedido (os chips), o POST indo, a espera do resultado novo e o recado (o erro do app, em português;
    // recadoSome: o recado que some quando chegar um resultado novo, o 409 e o 'não chegou')
    pedido: null, enviando: false, espera: null, recado: '', recadoSome: '', errado: null };
}
const FOLGA_T = 0.0005;   // ms: o mesmo instante (como no programa.py: o laboratório arredonda o t em 3 casas)
const emSeg = ms => `${mm(ms / 1000, 3)} s`;
const porCentoFino = x => !(x > 0) ? '0%' : x < 0.01 ? `${mm(x * 100, 2)}%` : x < 0.095 ? `${mm(x * 100, 1)}%` : `${Math.round(x * 100)}%`;
// o que o código do lab.py quer dizer (laboratorio/nucleo/contrato.py e ferramenta/programa.py)
const CODIGO_DO_PROGRAMA = { 0: 'rodou até o fim', 1: 'parou com erro no programa', 2: 'nem chegou a rodar (a placa, o roteiro ou as entradas têm erro)',
  3: 'travou', 4: 'rodou, mas uma conferência falhou', 5: 'não rodou: o gêmeo (laboratório e MicroPython) não está nesta máquina' };
// o rótulo de cada aviso do gêmeo, com as palavras da etapa 8 (testar.py): 'ruim' reprova a etapa 8 (o REPROVA, o
// flutuando, o sem circuito e o que para o programa no por_que_parou: travou, reset, wdt, sono e o gêmeo que quebrou,
// o 'motor', que é defeito do laboratório e não do main.py), 'atencao' não reprova
// mas merece o olho (o MOSTRA, e o roteiro forçando um pino: o 'curto' e o 'tensao' do contrato.py, que falam de
// queimar o pino da placa de verdade), 'info' é conversa do laboratório (a versão do MicroPython, o Wi-Fi de mentira)
const AVISO_RUIM = { queima: 'queima', corrente: 'corrente alta', boot: 'pino de boot', flash: 'pino da memória flash', travou: 'travou',
  reset: 'reiniciou', wdt: 'reiniciou', sono: 'dormiu', motor: 'gêmeo quebrou' };
const AVISO_ATENCAO = { entrada: 'leitura incerta', serial: 'pino da serial', psram: 'pino da psram', placa: 'pino fora do DevKit',
  pull: 'sem pull de dentro', rapido: 'troca rápido', indisponivel: 'sem o gêmeo', curto: 'curto no roteiro', tensao: 'tensão alta no roteiro' };
function tipoDoAviso(c, txt) {
  if (c === 'entrada' && /flutuando|aleatóri/.test(txt)) return ['flutuando', 'ruim'];
  if (c === 'circuito' && txt.startsWith('não deu pra ligar o circuito')) return ['sem circuito', 'ruim'];
  if (c === 'adc') return [/faixa boa/.test(txt) ? 'fora da faixa boa' : 'ADC', 'atencao'];
  if (AVISO_RUIM[c]) return [AVISO_RUIM[c], 'ruim'];
  if (AVISO_ATENCAO[c]) return [AVISO_ATENCAO[c], 'atencao'];
  return ['', 'info'];
}
const ICONE_TOCA = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>';
const ICONE_PAUSA = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';
const ICONE_VOLTA = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2.2v14H6zM19 5v14L9.5 12z"/></svg>';
const ICONE_VAI = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.8 5H18v14h-2.2zM5 5v14l9.5-7z"/></svg>';

// a cor de tela de um LED: a 'cor' da eletrica (do datasheet), a da peça escolhida no projeto (pergunta 'cor') ou a do
// nome dela ('LED vermelho 5 mm'); sem nenhuma, um branco neutro (nada de inventar um vermelho)
function corDoLed(p) {
  const daPeca = (S.projeto?.perguntas || []).find(q => q.id === 'cor')?.por_led?.find(x => x.ref === p.ref)?.da_peca;
  const nome = (p.nome || '').toLowerCase(), peloNome = Object.keys(COR_DE_TELA).sort((a, b) => b.length - a.length).find(c => nome.includes(c));
  return COR_DE_TELA[p.eletrica?.cor] || COR_DE_TELA[daPeca] || COR_DE_TELA[peloNome] || '#FFF3DC';
}
// o LED aceso no instante, como o aceso() do programa.py (a luz vem com 2 casas: 0,1% de PWM dá luz 0 e uns µA)
const ledAceso = l => !!l && (l.luz > 0 || l.mA > 0);
const BRILHO_MIN = 0.1;   // a opacidade do brilho de um LED aceso bem fraquinho: só pra ele não sumir do desenho

// a placa tem programa? A etapa 'Roda o programa' só existe com o codigo/main.py; sem os testes, a placa com o cérebro
// pode ter. Se o GET disse 'sem_programa' (falta o main.py), não tem até os testes rodarem de novo (o testes.json novo
// diz). A lanterna não tem: nem o botão aparece
function temPrograma(m) {
  const P = S.prog;
  if (P.tem === false && P.temDe === (S.testes?.inicio ?? null)) return false;
  if (P.dado) return true;
  if (S.testes?.etapas) return S.testes.etapas.some(e => /programa/i.test(e.nome));
  return !!m?.pecas.some(p => p.eletrica?.modelo === 'mcu');
}

// lê o programa: com o app, o GET /api/programa (o mais novo, ou 'rodando'); sem ele (python -m http.server), o
// saida/programa.json. Só com a régua aberta, a cada 2 s. 'Ainda não rodou' e 'falta o main.py' esperam 10 s pra
// perguntar de novo, menos com os testes rodando (o testes.json, lido a cada 1 s, diz): aí a etapa 8 vai rodar o
// programa, e a régua pergunta a cada 2 s pra mostrar o 'rodando…' e o resultado
async function lerPrograma(agora = false) {
  const P = S.prog, pressa = (!!S.testes?.rodando || !!P.espera) && Date.now() >= P.leu + (P.espera ? 1000 : 2000);
  if (!PLACA || P.lendo || (!agora && Date.now() < P.proxima && !pressa)) return;
  P.lendo = true;
  const pediu = Date.now();   // o Rodar de novo só conta a resposta de um GET feito depois do POST
  let txt = null, ok = false;
  try {
    if (S.api) {
      const r = await fetch(`/api/programa?placa=${encodeURIComponent(PLACA)}`, { cache: 'no-store' });
      [txt, ok] = [await r.text(), r.ok];
    } else { txt = await ler('saida/programa.json'); ok = txt !== null; }
  } catch { /* o app caiu: pergunta de novo daqui a pouco */ }
  P.lendo = false;
  P.leu = Date.now();
  P.proxima = P.leu + (ok ? 2000 : 10000);
  if (txt === null && !S.api && !P.dado) txt = '{"erro": "ainda não tem o saida/programa.json"}';
  // o Rodar de novo: depois do POST, o app diz 'rodando' até o processo acabar. Se o GET devolve o mesmo de antes do
  // POST, o programa acabou sem gravar resultado novo (caiu antes); sem resposta do app por 10 s, para de esperar
  const e = P.espera, depois = !!e && pediu >= e.desde;
  const semNovo = depois && (txt !== null && txt === e.bruto ? 'Não chegou resultado novo: o programa parou antes de gravar, e a régua continua com o de antes. Tente de novo; se repetir, rode os testes (a etapa 8 mostra o porquê).'
    : txt === null && P.leu - e.desde > 10000 ? 'Não chegou resultado novo: o app parou de responder (ele está aberto?). Tente de novo.' : '');
  if (semNovo) {   // o bruto do 'rodando' sai: a próxima leitura vale (o resto do estado é o de antes do POST)
    Object.assign(P, { espera: null, rodando: false, bruto: txt, recado: semNovo, recadoSome: semNovo });
    return desenhar();
  }
  if (txt === null || txt === P.bruto) return;
  let d;
  try { d = JSON.parse(txt); } catch { return; }   // pela metade: lê de novo na próxima
  P.bruto = txt;
  const vazio = !ok || !!d?.sem_programa || !!d?.ainda_nao_rodou;   // o app responde 200 com o porquê
  if (vazio) P.proxima = P.leu + 10000;
  if (d?.rodando !== true) {   // chegou o resultado novo (ou o erro dele): a espera acaba e o recado velho (409, sem resposta) some
    if (depois) P.espera = null;
    if (P.recadoSome && P.recado === P.recadoSome) P.recado = '';
  }
  if (d?.sem_programa) {   // a régua fica aberta com o porquê; o botão some quando fechar
    Object.assign(P, { tem: false, temDe: S.testes?.inicio ?? null, dado: null, rodando: false, aindaNao: false,
      falta: `${d.erro || 'esta placa não tem programa (falta o codigo/main.py)'}. Quando ele existir, rode os testes: a etapa 8 roda o programa no gêmeo` });
  } else if (d?.rodando === true) Object.assign(P, { tem: null, rodando: true });
  else if (ok && typeof d?.tempo_ms === 'number') {
    Object.assign(P, { tem: null, rodando: false, falta: '', aindaNao: false, main: null, dado: arrumarPrograma(d), versao: P.versao + 1 });
    P.t = Math.min(P.t, P.dado.total);
    P.pedido ??= pedidoDoPrograma(P.dado);   // os chips começam com o que o app mandou da última vez
  } else Object.assign(P, { tem: null, rodando: false, aindaNao: !!d?.ainda_nao_rodou,   // o porquê, com a etapa 8: faltaDoPrograma
    falta: d?.erro || 'não consegui ler o programa desta placa' });
  desenhar();
}

// o comando que instala o gêmeo (o MicroPython do PC): o que o aviso 'indisponivel' do laboratório diz ('Pra resolver:
// ...'), ou o do README
const INSTALAR_GEMEO = 'python3 laboratorio/lab.py instalar gemeo';
const comandoDoAviso = p => (p?.avisos || []).map(([, c, txt]) => c === 'indisponivel' && /python3? laboratorio\/lab\.py [\w -]*\w/.exec(txt)?.[0]).find(Boolean) || INSTALAR_GEMEO;
// a etapa 8 do testes.json (a que roda o programa), ou null
const etapaDoPrograma = () => S.testes?.etapas?.find(e => /programa/i.test(e.nome)) || null;

// por que a régua não tem programa pra mostrar. 'Ainda não rodou' olha a etapa 8: rodando, ela vai rodar; pulada porque
// o gêmeo não está nesta máquina, rodar os testes de novo não muda nada: o que resolve é instalar ele
function faltaDoPrograma() {
  const P = S.prog;
  if (!P.aindaNao) return P.falta;
  const e = etapaDoPrograma();
  if (S.testes?.rodando) return 'O programa ainda não rodou: os testes estão rodando agora, e a etapa 8 roda ele no gêmeo';
  if (e?.estado === 'pulou' && /laborat|gêmeo|micropython/i.test(e.detalhe || ''))
    return `O programa ainda não rodou: a etapa 8 pulou, porque o gêmeo (o laboratório e o MicroPython do PC) não está nesta máquina. Rodar os testes de novo não muda isso; pra instalar: ${INSTALAR_GEMEO}`;
  if (e?.estado === 'pulou') return `O programa ainda não rodou: a etapa 8 pulou (${e.detalhe || 'sem o porquê'})`;
  if (e?.estado === 'falhou') return `O programa ainda não rodou: a etapa 8 falhou (${e.detalhe || 'sem o porquê'}); a aba Testes mostra o resto`;
  return `${P.falta}. Rode os testes: a etapa 8 roda o programa no gêmeo`;
}

// o programa.json com as linhas do tempo em ordem (a busca do instante conta com isso), o fim da régua (total, em ms) e
// as paradas das setas: os instantes em que algo muda (o pino e o LED que ele acende mudam a 0,02 ms um do outro: as
// mudanças a menos de 1 ms viram uma parada só, no fim delas)
function arrumarPrograma(d) {
  const emOrdem = l => (Array.isArray(l) ? l : []).filter(x => Array.isArray(x) && typeof x[0] === 'number').sort((a, b) => a[0] - b[0]);
  const pinos = Object.fromEntries(Object.entries(d.pinos || {}).map(([g, x]) => [g,
    { ...x, modo: emOrdem(x.modo), nivel: emOrdem(x.nivel), pwm: emOrdem(x.pwm), volts: emOrdem(x.volts) }]));
  const leds = Object.fromEntries(Object.entries(d.leds || {}).map(([ref, l]) => [ref, emOrdem(l)]));
  const apertos = (d.entradas?.apertos || []).filter(a => typeof a.de === 'number' && typeof a.ate === 'number');
  const luz = (d.entradas?.luz || []).filter(x => typeof x.t === 'number').sort((a, b) => a.t - b.t);
  const p = { ...d, pinos, leds, serial: emOrdem(d.serial), avisos: emOrdem(d.avisos), entradas: { ...d.entradas, apertos, luz },
    conferencias: { ok: d.conferencias?.ok || [], falhas: d.conferencias?.falhas || [] }, pendentes: d.pendentes || [] };
  const ts = [...Object.values(pinos).flatMap(x => [...x.modo, ...x.nivel, ...x.pwm, ...x.volts]), ...Object.values(leds).flat(), ...p.serial]
    .map(x => x[0]).concat(apertos.flatMap(a => [a.de, a.ate]), luz.map(x => x.t), typeof p.erro?.t === 'number' ? [p.erro.t] : []);
  p.total = d.tempo_ms > 0 ? d.tempo_ms : ts.reduce((a, b) => Math.max(a, b), 1);   // o tempo de placa que rodou (sem ele, o último evento)
  p.paradas = [];
  for (const t of [0, ...ts.filter(t => t > 0 && t <= p.total)].sort((a, b) => a - b)) {
    if (p.paradas.length && t - p.paradas.at(-1) < 1) p.paradas[p.paradas.length - 1] = t;
    else p.paradas.push(t);
  }
  return p;
}

// quantas entradas da linha do tempo aconteceram até t (no mesmo instante, conta: como o no_instante do programa.py)
function ateOInstante(linha, t) {
  let a = 0, b = linha.length;
  while (a < b) { const k = (a + b) >> 1; if (linha[k][0] <= t + FOLGA_T) a = k + 1; else b = k; }
  return a;
}
const noInstante = (linha, t) => linha[ateOInstante(linha, t) - 1] ?? null;   // a última até t, ou null

// o que a placa fazia no instante t (ms): {t, luzes: {D1: {luz, mA, queima}}, pinos: {GPIO32: {modo, nivel, pwm, volts}},
// luz: {LDR1: a luz do quarto que valia}, apertados (os botões), sons (o que está num PWM ligado), serial e avisos
// (quantas linhas até t)}
function noPrograma(p, t) {
  const luzes = {}, pinos = {}, luz = {}, sons = new Set();
  for (const [ref, linha] of Object.entries(p.leds)) {
    const x = noInstante(linha, t);
    luzes[ref] = { luz: x?.[1] ?? 0, mA: x?.[2] ?? 0, queima: !!x?.[3] };
  }
  for (const [g, x] of Object.entries(p.pinos)) {
    const modo = noInstante(x.modo, t)?.[1] ?? null, pwm = noInstante(x.pwm, t);
    pinos[g] = { modo, nivel: noInstante(x.nivel, t)?.[1] ?? null, pwm, volts: noInstante(x.volts, t)?.[1] ?? null };
    if (modo === 'pwm' && pwm?.[1] > 0) for (const ref of (x.quem || '').split(', ')) if (ref) sons.add(ref);   // o desenho só usa no piezo
  }
  for (const x of p.entradas.luz) if (x.t <= t + FOLGA_T) luz[x.ref] = x;
  const apertados = new Set(p.entradas.apertos.filter(a => a.de <= t + FOLGA_T && t < a.ate - FOLGA_T).map(a => a.ref));
  return { t, luzes, pinos, luz, apertados, sons, serial: ateOInstante(p.serial, t), avisos: ateOInstante(p.avisos, t) };
}
// o que a placa e o painel mostram no instante (sem o t): se não mudou, a régua anda sem redesenhar nada
const chaveDoInstante = a => JSON.stringify([a.luzes, a.pinos, [...a.apertados], a.serial, a.avisos, Object.values(a.luz).map(x => x.t)]);

function alternarPrograma() {
  const P = S.prog;
  if (!P.aberto && !temPrograma(modeloVisto())) return;
  P.aberto = !P.aberto;
  if (P.aberto) { S.ligado = false; S.sel = null; lerPrograma(true); }   // um de cada vez com o ▶ Ligar
  else pararDeTocar();
  desenhar();
}
function fecharPrograma() { pararDeTocar(); S.prog.aberto = false; }   // sem desenhar: quem chama já está desenhando

// ▶/⏸: anda no tempo de placa (1× = o tempo de verdade; ¼× = 4 vezes mais devagar); no fim, começa de novo
function alternarTocar() {
  const P = S.prog;
  if (!P.dado) return;
  if (P.tocando) { pararDeTocar(); return mostrarInstante(true); }
  if (P.t >= P.dado.total - FOLGA_T) P.t = 0;
  const vez = ++P.vez;
  P.tocando = true;
  let antes = performance.now();
  const quadro = agora => {
    if (P.vez !== vez || !P.tocando) return;
    if (!P.aberto || !P.dado || S.aba !== 'projeto') { pararDeTocar(); return; }
    P.t = Math.min(P.dado.total, P.t + Math.min(agora - antes, 250) * P.vel);   // a aba escondida não pula o programa inteiro
    antes = agora;
    if (P.t >= P.dado.total) P.tocando = false;
    mostrarInstante(!P.tocando);
    if (P.tocando) requestAnimationFrame(quadro);
  };
  requestAnimationFrame(quadro);
  mostrarInstante(true);
}
function pararDeTocar() { S.prog.tocando = false; S.prog.vez++; }

// as setas: pro instante da mudança de antes ou da de depois (um pino, um LED, a serial, um aperto, a luz do quarto)
function pular(dir) {
  const P = S.prog, p = P.dado;
  if (!p) return;
  pararDeTocar();
  const t = dir > 0 ? p.paradas.find(x => x > P.t + FOLGA_T) : p.paradas.findLast(x => x < P.t - FOLGA_T);
  irParaInstante(t ?? P.t);
}
function irParaInstante(t) {
  const P = S.prog;
  if (!P.dado) return;
  P.t = Math.min(Math.max(Number(t) || 0, 0), P.dado.total);
  mostrarInstante(true);
}

// a régua andou: o tempo e a bolinha dela sempre; a placa e o painel só quando o que eles mostram mudou (tocando, no
// máximo umas 30 vezes por segundo)
function mostrarInstante(forcar = false) {
  const P = S.prog, r = $('.area .regua');
  if (r) preencherRegua(r);
  if (!P.dado || S.aba !== 'projeto') return;
  if (!forcar && performance.now() - P.quando < 33) return;
  if (forcar || chaveDoInstante(noPrograma(P.dado, P.t)) !== P.desenhado) desenhar();
}

// ▶ Programa: espaço toca e pausa, ← e → pulam pras mudanças (até com a régua na mão). Num campo, as teclas são dele;
// num botão (ou no resumo de um <details>) que ganhou o foco pelo Tab, o espaço aperta ele. O que ganhou o foco num
// clique (o ▶ Programa, o 1×, uma linha da serial...) não leva o espaço: ele toca, como o ▶ da régua promete
let focoDoClique = null;
document.addEventListener('pointerdown', e => { focoDoClique = e.target.closest?.('button, summary') ?? null; }, true);
document.addEventListener('focusin', e => { if (e.target !== focoDoClique) focoDoClique = null; });
function teclaDoPrograma(e) {
  if (!S.prog.aberto || !S.prog.dado || S.aba !== 'projeto' || e.ctrlKey || e.metaKey || e.altKey) return false;
  const el = e.target.closest?.('input, textarea, select, button, summary');
  if (el && !('regua' in el.dataset) && (!el.matches('button, summary') || (e.key === ' ' && el !== focoDoClique))) return false;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') pular(e.key === 'ArrowRight' ? 1 : -1);
  else if (e.key === ' ') alternarTocar();
  else return false;
  e.preventDefault();
  return true;
}

// a régua embaixo da placa (só com o ▶ Programa aberto): os comandos e as marcas mudam com o programa; o instante, sem
// refazer nada (preencherRegua). Devolve o que a placa fazia no instante dela, ou null (fechada ou sem programa)
function desenharRegua(area) {
  const P = S.prog;
  let r = area.querySelector('.regua');
  if (!P.aberto) { r?.remove(); area.classList.remove('com-regua'); return null; }
  area.classList.add('com-regua');
  if (!r) {
    r = Object.assign(document.createElement('div'), { className: 'regua' });
    r.setAttribute('role', 'group'); r.setAttribute('aria-label', 'Régua do tempo do programa');
    area.append(r);
  }
  const assinatura = `${P.versao}:${P.dado ? 'dado' : P.rodando ? 'rodando' : P.falta}:${JSON.stringify(P.pedido)}`;
  if (r.dataset.assinatura !== assinatura) { r.dataset.assinatura = assinatura; r.innerHTML = reguaHTML(P.dado); }
  preencherRegua(r);
  if (!P.dado) return null;
  const a = noPrograma(P.dado, P.t);
  P.desenhado = chaveDoInstante(a); P.quando = performance.now();
  return a;
}

// na régua: risquinho em cima = uma linha da serial; bolinha = aviso (vermelha reprova, amarela só avisa); traço vermelho
// = o erro; embaixo, barrinha azul = botão apertado e losango amarelo = a luz do quarto mudou (vazados: os chips do
// Rodar de novo que ainda não rodaram). Clicar numa marca vai pra ela
function reguaHTML(p) {
  if (!p) return '<span class="sub" data-sem-programa></span>';
  const pos = t => `${(100 * Math.min(Math.max(t, 0), p.total) / p.total).toFixed(3)}%`;
  const marca = (classe, t, titulo, largura = '') => `<button type="button" tabindex="-1" class="${classe}" style="left:${pos(t)}${largura}" data-ir="${t}" title="${esc(titulo)}" aria-label="${esc(titulo)}"></button>`;
  const marcas = [
    ...p.serial.map(([t, txt]) => marca('m-serial', t, `${emSeg(t)} · serial: ${txt}`)),
    ...p.avisos.map(([t, c, txt]) => [t, tipoDoAviso(c, txt), txt]).filter(([, [, nivel]]) => nivel !== 'info')
      .map(([t, [rotulo, nivel], txt]) => marca(`m-aviso ${nivel}`, t, `${emSeg(t)} · ${rotulo}: ${txt}`)),
    ...(typeof p.erro?.t === 'number' ? [marca('m-erro', p.erro.t, `${emSeg(p.erro.t)} · erro${p.erro.linha ? ` na linha ${p.erro.linha} do main.py` : ''}`)] : []),
    ...p.entradas.apertos.filter(a => a.de <= p.total).map(a => marca('m-aperto', a.de, `${a.ref} apertado de ${emSeg(a.de)} a ${emSeg(a.ate)}`,
      `;width:${(100 * (Math.min(a.ate, p.total) - a.de) / p.total).toFixed(3)}%`)),
    ...p.entradas.luz.filter(x => x.t <= p.total).map(x => marca('m-luz', x.t, `${emSeg(x.t)} · ${x.ref} com ${x.lux ? luxTxt(x.lux) : 'o quarto escuro'}${typeof x.volts === 'number' ? ` (${mm(x.volts, 2)} V no pino)` : ''}`)),
    ...chipsDoPedido().filter(x => !x.rodou && x.t <= p.total).map(x => marca(`${x.tipo === 'apertos' ? 'm-aperto' : 'm-luz'} pendente`, x.t,
      `${x.texto} (ainda não rodou: Rodar de novo)`, x.tipo === 'apertos' ? `;width:${(100 * (Math.min(x.ate, p.total) - x.t) / p.total).toFixed(3)}%` : '')),
  ];
  return `<div class="comandos">
      <button type="button" class="botao-r" data-tocar></button>
      <button type="button" class="botao-r" data-pular="-1" aria-label="Voltar pra mudança de antes (←)" title="Voltar pra mudança de antes (←)">${ICONE_VOLTA}</button>
      <button type="button" class="botao-r" data-pular="1" aria-label="Ir pra próxima mudança (→)" title="Ir pra próxima mudança (→)">${ICONE_VAI}</button>
      <div class="escolhas mini" role="group" aria-label="Velocidade">${[[1, '1×'], [0.25, '¼×']].map(([v, txt]) => `<button type="button" data-vel="${v}">${txt}</button>`).join('')}</div>
      <span class="agora-t" data-agora-t></span>
      <span class="selo rodando rodando-r" data-rodando-r hidden>rodando…</span>
    </div>
    <div class="trilho"><div class="marcas">${marcas.join('')}</div>
      <input type="range" data-regua min="0" max="${p.total}" step="any" value="0" aria-label="Instante do programa"></div>`;
}

function preencherRegua(r) {
  const P = S.prog, p = P.dado, sem = r.querySelector('[data-sem-programa]');
  if (sem) { sem.textContent = P.rodando ? 'rodando… quando o gêmeo acabar, a régua aparece aqui' : faltaDoPrograma() || 'lendo o programa…'; return; }
  if (!p) return;
  const t = Math.min(Math.max(P.t, 0), p.total), faixa = r.querySelector('[data-regua]');
  if (+faixa.value !== t) faixa.value = t;
  faixa.style.setProperty('--pos', `${(100 * t / p.total).toFixed(3)}%`);
  faixa.setAttribute('aria-valuetext', emSeg(t));
  r.querySelector('[data-agora-t]').innerHTML = `<b>${emSeg(t)}</b> de ${mm(p.total / 1000, 1)} s`;
  const em = $('aside.programa [data-em-p]');   // o painel só muda quando a placa muda; o instante dele anda com a régua
  if (em) em.textContent = `em ${emSeg(t)}`;
  for (const x of document.querySelectorAll('aside.programa [data-em-mexer]')) x.textContent = emSeg(t);   // onde o clique entra
  marcarLuzes(document, t);
  const tocar = r.querySelector('[data-tocar]'), estado = P.tocando ? 'pausa' : 'toca';
  if (tocar.dataset.estado !== estado) {
    tocar.dataset.estado = estado;
    tocar.innerHTML = P.tocando ? ICONE_PAUSA : ICONE_TOCA;
    tocar.title = P.tocando ? 'Pausar (espaço)' : 'Tocar (espaço)';
    tocar.setAttribute('aria-label', tocar.title);
  }
  for (const b of r.querySelectorAll('[data-vel]')) b.setAttribute('aria-pressed', +b.dataset.vel === P.vel);
  r.querySelector('[data-pular="-1"]').disabled = !p.paradas.some(x => x < t - FOLGA_T);
  r.querySelector('[data-pular="1"]').disabled = !p.paradas.some(x => x > t + FOLGA_T);
  r.querySelector('[data-rodando-r]').hidden = !P.rodando;
}

// os GPIOs do programa, na ordem das peças do placa.txt (como no ▶ Ligar), cada um com o nome de gente e as peças nele
function gpiosDoPrograma(m, c, p) {
  const lista = [];
  for (const g of c?.pinos || []) {
    if (!p.pinos[g.nome]) continue;
    const { quem, onde } = nomeDoGpio(m, c, g);
    lista.push({ nome: g.nome, quem, onde, g, refs: [...new Set([...g.ramo, ...(p.pinos[g.nome].quem || '').split(', ').filter(Boolean)])] });
  }
  for (const [nome, x] of Object.entries(p.pinos)) {   // o que o programa usou fora do circuito (o LED azul do DevKit...)
    if (lista.some(y => y.nome === nome)) continue;
    const q = c?.u.pinos.find(y => y.nome === nome), ser = q && c.u.serigrafia?.[q.n];
    lista.push({ nome, quem: x.nome ? `${x.nome}${x.quem ? ` (${x.quem})` : ''}` : x.quem || 'nada ligado nele na placa',
      onde: [ser && ser !== nome ? ser : null, nome].filter(Boolean).join(' · '), g: null, refs: (x.quem || '').split(', ').filter(Boolean) });
  }
  return lista;
}

// o que um GPIO fazia no instante: o valor da plaquinha (0, 1, PWM %, volts) e a frase de gente, com as peças dele (o LED
// com a luz, o botão apertado ou solto, o som apitando, o olho de luz com a luz do quarto)
function leituraDoGpio(m, u, x, a, serial = '') {
  const e = u?.eletrica || {}, pin = a.pinos[x.nome] || {}, de = k => x.refs.filter(r => modeloDaPeca(m, r) === k);
  const partes = [];
  let valor = '–', classe = '', aviso = '';
  if (pin.modo === 'saida') {
    const n = pin.nivel ?? 0;   // o pino de saída começa em 0, como no laboratório
    [valor, classe] = [String(n), n ? 'um' : ''];
    partes.push(`saída em ${n}${positivo(e.vdd) ? ` (${n ? volts(e.vdd) : '0'} V)` : ''}`);
  } else if (pin.modo === 'pwm') {
    const duty = pin.pwm?.[1] ?? 0, hz = pin.pwm?.[2];
    [valor, classe] = [porCentoFino(duty), duty > 0 ? 'pwm' : ''];
    partes.push(duty > 0 ? `PWM: ligado ${porCentoFino(duty)} do tempo${hz ? `, em ${milhar(Math.round(hz))} Hz` : ''}` : 'PWM parado (0%)');
    // a última linha da serial fala de outra porcentagem que, ao quadrado, dá este PWM (o main.py da luz noturna escreve
    // 'brilho 60%' e manda 60% × 60% = 36% pro PWM): diz que é a mesma coisa, com a conta. Só quando os números batem
    const pcts = [...serial.matchAll(/(\d+(?:[.,]\d+)?)\s*%/g)].map(k => [k[1], +k[1].replace(',', '.') / 100]);
    const quad = duty > 0 && pcts.find(([, b]) => b > 0 && b < 1 && Math.abs(b * b - duty) < 0.005 && Math.abs(b - duty) > 0.01);
    if (quad) partes.push(`os ${quad[0]}% da serial, ao quadrado, dão esse PWM (${quad[0]}% × ${quad[0]}% ≈ ${porCentoFino(duty)})`);
  } else if (pin.modo === 'adc') {
    const v = pin.volts;
    [valor, classe] = [v == null ? '?' : `${mm(v, 2)} V`, 'volts'];
    partes.push(v == null ? 'lê o ADC (ainda sem tensão no pino)' : `o ADC lê ${mm(v, 2)} V`);
    if (v != null && positivo(e.adc_min) && positivo(e.adc_max)) {
      const dentro = v >= e.adc_min && v <= e.adc_max, alto = v > e.adc_max, lado = u && ladoDoLdr({ u }, m, de('ldr'));
      const quer = lado ? `, e ${alto ? 'alto' : 'baixo'} aqui quer dizer ${alto === (lado === 'gnd') ? 'escuro' : 'claro'}` : '';
      partes.push(`${dentro ? 'dentro' : alto ? 'acima' : 'abaixo'} da faixa boa do ADC (${mm(e.adc_min, 2)} a ${mm(e.adc_max, 2)} V)${dentro ? '' : `: o número sai torto (menos exato), mas continua ${alto ? 'alto' : 'baixo'}${quer}`}`);
      aviso = dentro ? 'ok' : 'fora';
    }
  } else if (['pullup', 'pulldown', 'entrada'].includes(pin.modo)) {
    // o que o pino lê sai do circuito (o papel do pino, com a regra da etapa 4) e do botão naquele instante; o roteiro
    // pode forçar o nível (aí vale o dele). GPIO34 a 39 não têm pull de dentro
    const chaves = de('chave'), apertado = chaves.some(r => a.apertados.has(r)), papel = x.g?.papel;
    const comPull = !(e.so_entrada || []).includes(x.nome) && pin.modo;
    let le = pin.nivel;
    if (le == null && chaves.length) {
      if (papel === 'pulldown_fora') le = apertado ? 1 : 0;
      else if (papel === 'pullup' || papel === 'pullup_fora') le = apertado ? 0 : papel === 'pullup_fora' || comPull === 'pullup' ? 1 : comPull === 'pulldown' ? 0 : null;
    }
    [valor, classe] = [le == null ? '?' : String(le), le ? 'um' : ''];
    partes.push(`entrada${comPull === 'pullup' ? ' com o pull-up de dentro' : comPull === 'pulldown' ? ' com o pull-down de dentro' : ''}`);
    if (chaves.length) partes.push(chaves.map(r => `${r} ${a.apertados.has(r) ? 'apertado' : 'solto'}`).join(', '));
    if (le == null && chaves.length) { partes.push('o pino fica no ar: lê qualquer coisa'); aviso = 'fora'; }
    else if (le != null) partes.push(`lê ${le}`);
  } else if (pin.modo) partes.push(pin.modo);
  else partes.push('o programa ainda não mexeu neste pino');
  for (const r of x.refs.filter(r => r in a.luzes)) {   // a luz vem do gêmeo com 2 casas: em % inteiro
    const l = a.luzes[r], media = pin.modo === 'pwm' ? ' na média' : '';
    const ma = l.mA < 0.05 ? 'menos de 0,1 mA' : `${mm(l.mA, 1)} mA`;
    if (l.queima) { partes.push(`${r} QUEIMA (${mm(l.mA, 1)} mA)`); classe = aviso = 'queima'; }
    else if (!ledAceso(l)) partes.push(`${r} apagado`);
    else if (l.luz >= 0.005) partes.push(`${r} aceso: luz ${Math.round(l.luz * 100)}% do anúncio, ${ma}${media}`);
    else partes.push(`${r} aceso bem fraquinho: menos de 1% da luz do anúncio, ${ma}${media}`);
  }
  for (const r of de('piezo')) partes.push(a.sons.has(r) ? `${r} apitando` : `${r} quieto`);   // a frequência já está no PWM
  for (const r of de('ldr')) if (a.luz[r]) partes.push(a.luz[r].lux ? `${r} com ${luxTxt(a.luz[r].lux)} no quarto` : `${r} com o quarto escuro`);
  return { valor, classe, aviso, texto: partes.join(' · ') };
}

// "U1: porta USB: falta..." vira "U1 · porta USB: falta...": o assunto do selo pendente fica com a peça e o assunto
const pendenteDoPrograma = t => t.replace(/^([A-Z]+\d+): (?=[^:]+: )/, '$1 · ');

function erroDoProgramaHTML(p) {
  const e = p.erro, linhas = String(e.texto || '').split('\n').map(x => x.trim()).filter(Boolean);
  const codigo = e.linha ? S.prog.main?.[e.linha - 1] : null, temT = typeof e.t === 'number';
  return `<div class="erro-p"><b>✗ Erro${e.linha ? ` na linha ${e.linha} do main.py` : ''}${temT ? `, em ${emSeg(e.t)}` : ''}</b>
    <span>${esc(linhas.at(-1) || 'o laboratório não explicou')}</span>
    ${codigo != null ? `<code>${e.linha}  ${esc(codigo.trim())}</code>` : ''}
    ${temT ? `<button type="button" class="link" data-ir="${e.t}">Ir pro instante do erro →</button>` : ''}
    ${linhas.length > 1 ? `<details class="fontes"><summary>O que o MicroPython escreveu</summary><pre>${esc(e.texto)}</pre></details>` : ''}</div>`;
}

// o esqueleto do painel: muda com o programa; o que muda com o instante entra no preencherPrograma
function programaHTML(m, p, gpios) {
  const P = S.prog;
  const fechar = '<button type="button" class="fechar" data-programa aria-label="Fechar o programa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
  const cab = `<div class="cab"><div><div class="tipo">${!p ? 'O main.py no gêmeo' : p.livre ? 'Rodado pelo app' : 'Roteiro de teste'}</div><div class="titulo">Programa</div></div>${fechar}</div>`;
  const mexer = podeMexer() ? '<div class="bloco-p mexer-p" data-mexer></div>' : '';   // os chips e o Rodar de novo (preencherMexer)
  if (!p) return cab + `<p class="dica">${P.rodando ? '<span class="selo rodando">rodando…</span> O gêmeo está rodando o main.py desta placa. Quando acabar, a régua aparece aqui.' : esc(comMaiuscula(faltaDoPrograma() || 'lendo o programa…'))}</p>${mexer}`;
  const conf = p.conferencias, total = conf.ok.length + conf.falhas.length, quando = p.quando ? ` em ${dia(p.quando)} às ${hora(p.quando)}` : '';
  const leds = refs => refs.map(r => m.pecas.find(q => q.ref === r)).filter(q => q?.eletrica?.modelo === 'led')
    .map(q => `<span class="bolinha" style="background:${corDoLed(q)}" aria-hidden="true"></span>`).join('');
  // os avisos que pedem o olho (os que reprovam e os que só avisam) à vista; a conversa do laboratório (a versão do
  // MicroPython, o chip do gêmeo, o circuito ligado) fica fechada embaixo deles
  const aviso = ([t, c, txt], i) => {
    const [rotulo, nivel] = tipoDoAviso(c, txt);
    return [nivel, `<li data-i="${i}" hidden class="${nivel}"><button type="button" data-ir="${t}" title="Ir pra ${emSeg(t)}">${emSeg(t)}</button><span>${rotulo ? `<span class="selo ${nivel}">${esc(rotulo)}</span>` : ''}${esc(txt)}</span></li>`];
  };
  const todos = p.avisos.map(aviso), avisos = todos.filter(([n]) => n !== 'info').map(([, h]) => h).join(''), conversa = todos.filter(([n]) => n === 'info').map(([, h]) => h).join('');
  const naoRodou = p.codigo === 5, nemComecou = p.codigo === 2;   // sem o gêmeo / a placa, o roteiro ou as entradas com erro
  const dica = naoRodou ? `O main.py não rodou: o gêmeo (o laboratório e o MicroPython do PC) não está nesta máquina, então não tem pino, serial nem LED pra mostrar. Pra instalar: <code>${esc(comandoDoAviso(p))}</code>. Depois, rode de novo (ou rode os testes: a etapa 8 roda o programa).`
    : nemComecou ? 'O main.py não chegou a rodar no gêmeo: o porquê está logo abaixo.'
    : 'O main.py rodou no gêmeo do ESP32, sem a placa. Arraste a régua embaixo da placa, ou use os botões ⏮ ⏭ pra pular de uma mudança pra outra (no teclado, as setas ← →): os LEDs acendem com a luz que o gêmeo calculou, na cor de cada um. Na régua, os risquinhos de cima são a serial; os de baixo, os botões apertados e a luz do quarto.';
  const pwmComLed = gpios.some(x => p.pinos[x.nome]?.pwm?.length && x.refs.some(r => modeloDaPeca(m, r) === 'led'));
  return `${cab}
    <p class="dica">${dica}</p>
    <div class="estado-p">
      ${P.rodando ? '<span><span class="selo rodando">rodando…</span> o gêmeo está rodando de novo: quando acabar, a régua troca pelo resultado novo</span>' : ''}
      <span>${esc(comMaiuscula(CODIGO_DO_PROGRAMA[p.codigo] ?? `o laboratório saiu com o código ${p.codigo}`))}${naoRodou ? (quando ? ` (tentou${quando})` : '') : `: ${mm(p.tempo_ms / 1000, 1)} s de placa${quando}`}.</span>
      <span class="sub">${p.livre ? 'Rodado pelo app, só com os apertos e a luz que vieram de lá.' : 'O roteiro de teste da placa (codigo/roteiro.json e gemeo.roteiro), o mesmo da etapa 8.'}</span>
    </div>
    ${p.erro ? erroDoProgramaHTML(p) : ''}
    ${mexer}
    ${naoRodou ? '' : `<div class="bloco-p"><b>Os pinos <span class="sub" data-em-p></span></b>
      <div class="gpios">${gpios.map(x => `<div class="gpio"><span class="quem">${leds(x.refs)}<b>${esc(x.quem)}</b><span class="mono">· ${esc(x.onde)}</span></span>
        <span class="linha-p"><span class="valor-p" data-valor-p="${esc(x.nome)}"></span><span class="le" data-le-p="${esc(x.nome)}"></span></span></div>`).join('')
        || '<span class="sub">o programa não usou nenhum pino</span>'}</div>
      ${pwmComLed ? '<span class="sub">PWM: o pino liga e desliga muito rápido, e a porcentagem é a parte do tempo em que ele fica ligado. O LED nele dá, na média, só essa parte da luz que daria ligado direto: por isso a luz do LED é menor que o PWM. O número que o main.py escreve na serial é o dele (ele pode chamar de brilho outra conta).</span>' : ''}</div>
    <div class="bloco-p"><b>Serial <span class="sub" data-serial-conta></span></b>
      ${p.serial.length ? `<ol class="serial-p" data-serial-p>${p.serial.map(([t, txt], i) => `<li data-i="${i}" hidden><button type="button" data-ir="${t}" title="Ir pra ${emSeg(t)}">${emSeg(t)}</button><span>${esc(txt)}</span></li>`).join('')}</ol>`
        : '<span class="sub">o programa não escreveu nada na serial</span>'}</div>`}
    ${avisos || conversa ? `<div class="bloco-p"><b>Avisos do gêmeo <span class="sub" data-avisos-conta></span></b>
      ${avisos ? `<ul class="lista-p" data-avisos-p>${avisos}</ul>` : '<span class="sub">nenhum aviso que peça o olho</span>'}
      ${conversa ? `<details class="fontes"><summary>O que o laboratório contou <span data-info-conta></span></summary><ul class="lista-p" data-info-p>${conversa}</ul></details>` : ''}</div>` : ''}
    <div class="bloco-p"><b>Conferências${!p.livre && total ? ` <span class="sub">${conf.ok.length} de ${total} ok</span>` : ''}</b>
      ${p.livre ? '<span class="sub">Só no roteiro de teste: este programa rodou pelo app, e as conferências (codigo/roteiro.json e confere.json) ficam pra etapa 8.</span>'
        : !total ? '<span class="sub">nenhuma: o roteiro.json e o confere.json não conferem nada</span>'
        : `${conf.falhas.length ? `<ul class="lista-p">${conf.falhas.map(f => `<li class="falha">✗ ${esc(f)}</li>`).join('')}</ul>` : ''}
          ${conf.ok.length ? `<details class="fontes"><summary>✓ ${conf.ok.length} ${conf.ok.length === 1 ? 'passou' : 'passaram'}: ver ${conf.ok.length === 1 ? 'qual' : 'quais'}</summary><ul class="lista-p">${conf.ok.map(x => `<li class="ok">✓ ${esc(x)}</li>`).join('')}</ul></details>` : ''}`}
    </div>
    ${p.pendentes.length ? `<div class="pendentes">${p.pendentes.map(t => pendenteHTML(pendenteDoPrograma(t))).join('')}</div>` : ''}`;
}

// o painel no instante da régua: o valor e a frase de cada GPIO, a serial até t (a última em destaque) e os avisos até t
function preencherPrograma(m, c, p, gpios, a, painel) {
  const q = sel => painel.querySelector(sel);
  const em = q('[data-em-p]');
  if (em) em.textContent = `em ${emSeg(a.t)}`;
  const serial = p.serial[a.serial - 1]?.[1] || '';   // a última linha da serial até o instante
  for (const x of gpios) {
    const l = leituraDoGpio(m, c?.u, x, a, serial), v = q(`[data-valor-p="${CSS.escape(x.nome)}"]`), le = q(`[data-le-p="${CSS.escape(x.nome)}"]`);
    if (!v || !le) continue;
    v.textContent = l.valor; v.className = `valor-p ${l.classe}`;
    le.textContent = l.texto; le.className = `le ${l.aviso}`;
  }
  // a serial, os avisos que pedem o olho e a conversa do laboratório: cada lista mostra o que veio até o instante
  for (const [sel, n, conta, txt] of [['[data-serial-p]', a.serial, '[data-serial-conta]', 'linhas'], ['[data-avisos-p]', a.avisos, '[data-avisos-conta]', 'avisos'],
    ['[data-info-p]', a.avisos, '[data-info-conta]', 'recados']]) {
    const lista = q(sel);
    if (!lista) continue;
    let vistos = 0, ultima = null;
    for (const li of lista.children) { li.hidden = +li.dataset.i >= n; if (!li.hidden) { vistos++; ultima = li; } li.classList.remove('ultima'); }
    ultima?.classList.add('ultima');
    lista.scrollTop = lista.scrollHeight;   // a última até t fica à vista
    const cont = q(conta);
    if (cont) cont.textContent = `${vistos} de ${lista.children.length} ${txt} até aqui`;
  }
}

// o painel do lado da placa com o ▶ Programa aberto (o inspetor, se tiver peça escolhida, fica na frente)
function desenharPainelDoPrograma(main, m, painel, a) {
  const P = S.prog, p = P.dado;
  if (!painel) { painel = document.createElement('aside'); main.append(painel); }
  if (p?.erro?.linha && P.main === null) {   // a linha do main.py que deu erro, pra mostrar o código dela
    P.main = [];
    ler('codigo/main.py').then(txt => { P.main = txt === null ? [] : txt.split('\n'); desenhar(); });
  }
  const c = pinosDoCerebro(m), gpios = p ? gpiosDoPrograma(m, c, p) : [];
  const assinatura = `programa:${PLACA}:${m.versao}:${P.versao}:${P.rodando}:${faltaDoPrograma()}:${P.main?.length}:${podeMexer()}:${gpios.map(x => x.quem).join()}`;
  if (painel.dataset.assinatura !== assinatura) {
    painel.dataset.assinatura = assinatura;
    painel.className = 'inspetor painel programa';
    painel.setAttribute('aria-label', 'O programa da placa');
    painel.innerHTML = programaHTML(m, p, gpios);
  }
  preencherMexer(m, painel);
  if (p && a) preencherPrograma(m, c, p, gpios, a, painel);
}

// ---------- ▶ Programa: mexer e rodar de novo ----------
// O pedido são os chips: os apertos [{ref, de, ate}] e a luz do quarto [{ref, t, lux}], em segundos, do jeito que o
// POST /api/programa recebe (programa.validar_entradas). Clicar no botão desenhado aperta ele no instante da régua por
// 0,2 s; o 1, 10 ou 100 lux muda a luz do quarto no instante da régua. 'Rodar de novo ↻' manda o pedido: o app roda o
// main.py no gêmeo só com ele (sem nenhum chip, a placa roda sozinha), e a régua pergunta até o resultado novo chegar
const APERTO_MS = 200;                  // quanto tempo o clique segura o botão
const LUZES_DO_QUARTO = [0, 1, 10, 100];   // lux (0 = o escuro: o gêmeo aceita, e o LDR fica no r_escuro)
const luxTxt = lux => (lux ? `${milhar(lux)} lux` : 'escuro');   // o espaço não quebra

const podeMexer = () => S.api && S.prog.tem !== false;   // o POST é do app, e só na placa que tem programa
const pedidoAtual = () => (S.prog.pedido ??= { apertos: [], luz: [] });

// os chips de um programa que chegou: o que o app mandou da última vez (o roteiro de teste não é do app: vazio)
function pedidoDoPrograma(p) {
  const doApp = l => (p?.livre ? (l || []).filter(x => x.origem === 'app') : []);
  return { apertos: doApp(p?.entradas?.apertos).map(a => ({ ref: a.ref, de: a.de / 1000, ate: a.ate / 1000 })),
    luz: doApp(p?.entradas?.luz).map(x => ({ ref: x.ref, t: x.t / 1000, lux: x.lux })) };
}

// o chip já rodou? Está no programa da régua (o do app), com os mesmos tempos
function rodou(tipo, x) {
  const p = S.prog.dado, mesmo = (a, b) => Math.abs(a - b) <= FOLGA_T;
  if (!p?.livre) return false;
  if (tipo === 'apertos') return p.entradas.apertos.some(a => a.origem === 'app' && a.ref === x.ref && mesmo(a.de, x.de * 1000) && mesmo(a.ate, x.ate * 1000));
  return p.entradas.luz.some(a => a.origem === 'app' && a.ref === x.ref && mesmo(a.t, x.t * 1000) && a.lux === x.lux);
}

// os volts que essa luz dá no GPIO do LDR, pela conta do Sianvolt: o circuito inteiro com os GPIOs soltos e o LDR do
// meio (a mesma do programa.py, volts_da_luz), e a faixa como a etapa 4 (testar.faixa_do_ldr): o LDR nos cantos min e
// max e o 3V3 no vdd_min e no vdd_max (o pendente fica no vdd). {v, de, ate, com3v3, onde} ou {erro, onde} (número
// pendente); null se o LDR não está num GPIO
function voltsDaLuz(m, ref, lux) {
  const c = pinosDoCerebro(m), g = c?.pinos.find(x => x.ramo.includes(ref)), p = m.pecas.find(q => q.ref === ref);
  if (!g || !p) return null;
  const ser = c.u.serigrafia?.[g.n], onde = `${g.nome}${ser && ser !== g.nome ? ` (${ser})` : ''}`;
  const e = c.u.eletrica, vdds = ['vdd_min', 'vdd_max'].map(k => (positivo(e[k]) ? e[k] : null));
  const no = (canto, vdd) => simular(comPinos(m, {}, vdd), { ldr: { [ref]: ohmsDoLdr(p.eletrica, lux, canto, ref) } })?.nets[g.net];
  try {
    const v = no('meio', null), cantos = ['min', 'max'].flatMap(canto => vdds.map(vdd => no(canto, vdd)));
    return v == null ? null : { v, de: Math.min(...cantos), ate: Math.max(...cantos), com3v3: vdds.every(Boolean), onde };
  } catch (err) { return { erro: err.message, onde }; }
}

// o nome de gente da peça: o apelido do bloco no projeto e o nome na placa ('botão modo (SW1)'), ou o tipo ('botão SW1')
function nomeDeGente(m, ref) {
  const b = S.projeto?.blocos?.find(x => x.ref === ref && x.apelido);
  return b ? `${b.apelido} (${ref})` : `${(NOME_DO_MODELO[modeloDaPeca(m, ref)] || 'peça').toLowerCase()} ${ref}`;
}
// '2,38 V (1,80 a 2,84)': o pino com o LDR do meio e, entre parênteses, a faixa (como a etapa 4)
const voltsComFaixa = v => `${mm(v.v, 2)} V (${mm(v.de, 2)} a ${mm(v.ate, 2)})`;

// os chips em ordem de tempo: {tipo ('apertos' | 'luz'), i (a posição no pedido: o 'aperto 2' das frases do app), x, t e
// ate (ms), texto, volts (o que o pino do LDR lê, na linha de baixo do chip), rodou}. O espaço entre o número e a
// unidade não quebra (o 'V' não fica sozinho na outra linha)
function chipsDoPedido() {
  const pedido = S.prog.pedido || { apertos: [], luz: [] }, m = modeloVisto();
  const chips = [...pedido.apertos.map((a, i) => ({ tipo: 'apertos', i, x: a, t: a.de * 1000, ate: a.ate * 1000,
    texto: `aperta ${a.ref} de ${mm(a.de, 3)} a ${mm(a.ate, 3)} s` })),
  ...pedido.luz.map((x, i) => {
    const v = m && voltsDaLuz(m, x.ref, x.lux);
    return { tipo: 'luz', i, x, t: x.t * 1000, texto: `${x.ref} = ${luxTxt(x.lux)} em ${mm(x.t, 3)} s`,
      volts: v?.v != null ? `o pino lê ${voltsComFaixa(v)}` : '' };
  })];
  for (const c of chips) c.rodou = rodou(c.tipo, c.x);
  return chips.sort((a, b) => a.t - b.t || (a.tipo < b.tipo ? -1 : 1));
}

// clicar no botão desenhado com a régua aberta: aperta ele no instante da régua, por 0,2 s
function apertarNoInstante(ref) {
  const P = S.prog, de = Math.round(P.t), ate = de + APERTO_MS, pedido = pedidoAtual();
  const junto = pedido.apertos.find(a => a.ref === ref && a.de * 1000 < ate && de < a.ate * 1000);
  P.errado = null;
  if (junto) P.recado = `O ${ref} já está apertado nesse instante (de ${mm(junto.de, 3)} a ${mm(junto.ate, 3)} s). Pra mudar, tire esse no ✕.`;
  else {
    pedido.apertos = [...pedido.apertos, { ref, de: de / 1000, ate: ate / 1000 }].sort((a, b) => a.de - b.de);
    P.recado = '';
  }
  desenhar();
}

// a luz do quarto que o pedido deixa no LDR no instante t (ms): o último chip dele até t; antes de todos, a luz com que
// o gêmeo começa (o LUX_PADRAO, os 10 lux do LDR do meio: o aviso 'luz' do laboratório diz)
function luzDoPedido(ref, t) {
  const antes = (S.prog.pedido?.luz || []).filter(x => x.ref === ref && x.t * 1000 <= t + FOLGA_T);
  return antes.length ? antes.at(-1).lux : LUX_PADRAO;
}

// os botões da luz do quarto: marcado, o que vale no instante t (ms)
function marcarLuzes(raiz, t) {
  for (const b of raiz.querySelectorAll('[data-luz-quarto]'))
    b.setAttribute('aria-pressed', +b.dataset.luxQuarto === luzDoPedido(b.dataset.luzQuarto, t));
}

// a luz do quarto no LDR muda no instante da régua (no mesmo instante, a escolha nova fica no lugar da outra)
function luzNoInstante(ref, lux) {
  const t = Math.round(S.prog.t) / 1000, pedido = pedidoAtual();
  pedido.luz = [...pedido.luz.filter(x => !(x.ref === ref && x.t === t)), { ref, t, lux }].sort((a, b) => a.t - b.t);
  Object.assign(S.prog, { recado: '', errado: null });
  desenhar();
}

function tirarChip(tipo, i) {
  const pedido = pedidoAtual();
  if (!Array.isArray(pedido[tipo])) return;
  pedido[tipo] = pedido[tipo].filter((_, k) => k !== i);
  Object.assign(S.prog, { recado: '', errado: null });
  desenhar();
}

// manda o pedido pro app. Ele responde na hora ({rodando: true}) e o GET diz 'rodando' até o programa_livre.json novo
// chegar (lerPrograma pergunta a cada 1 s enquanto espera). 400 = o pedido tem erro (a frase do app diz qual chip),
// 409 = os testes ou outro programa estão rodando nesta placa
async function rodarDeNovo() {
  const P = S.prog;
  if (P.enviando || P.espera || P.rodando || !podeMexer()) return;
  Object.assign(P, { enviando: true, recado: '', errado: null });
  desenhar();
  let r = null, d = {};
  try {
    r = await fetch(`/api/programa?placa=${encodeURIComponent(PLACA)}`, { method: 'POST',
      headers: { 'X-Bancada': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(pedidoAtual()) });
    d = await r.json().catch(() => ({}));
  } catch { /* o app fechou */ }
  P.enviando = false;
  if (r?.ok && d.rodando) {
    Object.assign(P, { espera: { bruto: P.bruto, viu: false, desde: Date.now() }, rodando: true });
    lerPrograma(true);
  } else {
    P.recado = `Não rodou: ${!r ? 'sem resposta do app (ele está aberto?)' : d.erro || `o app não aceitou (resposta ${r.status})`}`;
    P.recadoSome = r?.status === 400 ? '' : P.recado;   // o 400 é dos chips e fica; o resto passa com o resultado novo
    const qual = /^(aperto|luz) (\d+):/.exec(d.erro || '');
    P.errado = qual ? { tipo: qual[1] === 'aperto' ? 'apertos' : 'luz', i: +qual[2] - 1 } : null;
  }
  desenhar();
}

// o bloco do Rodar de novo no painel: como mexer, a luz do quarto (com os volts de cada luz), os chips e o botão
function mexerHTML(m) {
  const P = S.prog, chaves = porModelo(m, 'chave').map(p => p.ref), ldrs = porModelo(m, 'ldr').map(p => p.ref);
  const ocupado = P.enviando || !!P.espera || P.rodando, agora = `<b class="mono" data-em-mexer>${emSeg(P.t)}</b>`;
  // apertar: o botão desenhado na placa ou o daqui (no celular, o desenhado fica pequeno pro dedo)
  const como = chaves.length ? `Clique no ${chaves.map(ref => esc(nomeDeGente(m, ref))).join(' ou no ')} desenhado na placa, ou aqui embaixo: ele fica apertado ${mm(APERTO_MS / 1000, 1)} s a partir de ${agora}, o instante da régua.` : '';
  const apertar = chaves.length ? `<div class="chips-p">${chaves.map(ref => `<button type="button" class="pilula" data-apertar="${esc(ref)}">Apertar ${esc(ref)}</button>`).join('')}</div>` : '';
  const luz = ldrs.map(ref => {   // o que o pino lê com cada luz, uma por linha, com a faixa (como a etapa 4)
    const vs = LUZES_DO_QUARTO.map(lux => [lux, voltsDaLuz(m, ref, lux)]), pend = vs.find(([, v]) => v?.erro)?.[1];
    const onde = vs.find(([, v]) => v)?.[1]?.onde, com3v3 = vs.every(([, v]) => v?.com3v3);
    const volts = pend ? `<span class="sub">Os volts ficam sem número: ${esc(pend.erro)}</span>` : onde ? `<div class="volts-p sub"><span>O ${esc(onde)} lê:</span>
      ${vs.map(([lux, v]) => `<span>${luxTxt(lux)}: ${v?.v != null ? esc(voltsComFaixa(v)) : '?'}</span>`).join('')}
      <span>Entre parênteses, com o LDR${com3v3 ? ' e o 3V3' : ''} nos cantos, como a etapa 4${com3v3 ? '' : ' (a faixa do 3V3 está pendente)'}; o programa roda com o LDR do meio.</span></div>` : '';
    return `<div class="luz-p"><span>Quanta luz chega no ${esc(nomeDeGente(m, ref))} a partir de ${agora} (marcada: a que vale nesse instante; sem mudar, o gêmeo começa com ${luxTxt(LUX_PADRAO)}):</span>
      <div class="escolhas mini" role="group" aria-label="Luz do quarto no ${esc(ref)}">${LUZES_DO_QUARTO.map(lux => `<button type="button" data-luz-quarto="${esc(ref)}" data-lux-quarto="${lux}">${luxTxt(lux)}</button>`).join('')}</div>
      ${volts}</div>`;
  }).join('');
  const chips = chipsDoPedido().map(c => {
    const erro = P.errado?.tipo === c.tipo && P.errado.i === c.i, tudo = c.volts ? `${c.texto} · ${c.volts}` : c.texto;
    return `<span class="chip-p${c.rodou ? '' : ' a-rodar'}${erro ? ' recusado' : ''}"><i class="${c.tipo}" aria-hidden="true"></i><button type="button" data-ir="${c.t}" title="Ir pra ${emSeg(c.t)} na régua">${esc(c.texto)}${c.volts ? `<span class="v">${esc(c.volts)}</span>` : ''}</button><button type="button" class="tirar" data-tirar="${c.tipo}:${c.i}" aria-label="Tirar: ${esc(tudo)}" title="Tirar">✕</button></span>`;
  });
  return `<b>Mexer e rodar de novo</b>
    ${como ? `<p class="dica">${como}</p>${apertar}` : ''}${luz}
    ${chips.length ? `<div class="chips-p">${chips.join('')}</div>${chips.some(c => c.includes(' a-rodar')) ? '<span class="sub">tracejado: ainda não rodou</span>' : ''}`
      : '<span class="sub">nenhum aperto nem luz: rodando de novo assim, a placa roda sozinha, sem ninguém mexer</span>'}
    <div class="rodar-p"><button type="button" class="pilula" data-rodar-prog ${ocupado ? 'disabled' : ''}>Rodar de novo ↻</button>
      ${ocupado ? '<span class="selo rodando">rodando…</span>' : '<span class="sub">roda o main.py no gêmeo só com isso</span>'}</div>
    ${P.recado ? `<p class="aviso" role="status">${esc(P.recado)}</p>` : ''}`;
}

function preencherMexer(m, painel) {
  const el = painel.querySelector('[data-mexer]'), P = S.prog;
  if (!el) return;
  const assinatura = JSON.stringify([m.versao, P.versao, P.pedido, P.enviando, !!P.espera, P.rodando, P.recado, P.errado]);
  if (el.dataset.assinatura === assinatura) return;
  el.dataset.assinatura = assinatura;
  el.innerHTML = mexerHTML(m);
  marcarLuzes(el, Math.min(Math.max(P.t, 0), P.dado?.total ?? P.t));
}

// ---------- zoom e arrasto (mexem so no viewBox) ----------
// as ferramentas em pé (uma coluna do lado da placa) ou deitadas (uma linha em cima dela, e o desenho começa embaixo):
// deitadas quando a coluna não cabe na altura (o ▶ Programa ficaria escondido) ou, na tela estreita, quando a placa
// fica maior assim. A altura da coluna em pé: os botões de 44 px, o 100% de 32, as linhas de 9 (4 de margem em cima e
// embaixo), 4 entre eles e 10 de borda e respiro (o CSS do .ferramentas)
function arrumarFerramentas(area, m) {
  const ferr = area.querySelector('.ferramentas');
  if (!ferr || !m) return;
  const itens = [...ferr.children].filter(x => !x.hidden);
  const emPe = itens.reduce((t, x) => t + (x.tagName === 'HR' ? 9 : x.classList.contains('zoom') ? 32 : 44), 0) + 4 * (itens.length - 1) + 10;
  const regua = area.classList.contains('com-regua') ? area.querySelector('.regua')?.offsetHeight || 0 : 0;
  const aviso = area.querySelector('.aviso-versao'), alto = aviso ? aviso.offsetHeight + 20 : 0;
  const w = area.clientWidth, h = area.clientHeight - regua;
  const naoCabe = emPe + 32 > h, estreita = matchMedia('(max-width: 720px)').matches;
  const linha = 12 + (estreita ? 50 : 54) + 8;   // a linha deitada, com o respiro embaixo
  const baseEmPe = Math.min((w - 150) / m.placa.w, (h - alto - 64) / m.placa.h);
  const baseDeitada = Math.min((w - 32) / m.placa.w, (h - linha - alto - 40) / m.placa.h);
  area.classList.toggle('ferr-deitadas', naoCabe || (estreita && baseDeitada > baseEmPe));
}

// o desenho começa embaixo do que fica em cima dele (--topo): o aviso da versão e as ferramentas deitadas.
// Devolve se as ferramentas estão deitadas (uma linha em cima) ou em pé (uma coluna do lado)
function arrumarTopo(area) {
  const ferr = area.querySelector('.ferramentas'), aviso = area.querySelector('.aviso-versao');
  const deitadas = area.classList.contains('ferr-deitadas');
  let topo = deitadas ? ferr.offsetTop + ferr.offsetHeight + 8 : 0;
  if (aviso) {
    const y = Math.max(topo, 12);
    aviso.style.top = `${y}px`;
    topo = y + aviso.offsetHeight + 8;
  }
  if (area.style.getPropertyValue('--topo') !== `${topo}px`) area.style.setProperty('--topo', `${topo}px`);
  return deitadas;
}

function areaInfo() {
  const area = $('.area'), m = modeloVisto();
  if (!area || !m) return null;
  const deitadas = arrumarTopo(area);
  const r = area.querySelector('.desenho').getBoundingClientRect();   // a área menos o topo e a régua do ▶ Programa
  // sobra espaço pras ferramentas: em pé, 150 px de largura; deitadas, elas já estão fora do desenho (sobra a margem)
  const base = Math.min((r.width - (deitadas ? 32 : 150)) / m.placa.w, (r.height - (deitadas ? 40 : 64)) / m.placa.h);
  return { area, r, base, m };
}

function centralizar() {
  const m = modeloVisto();
  S.zoom = 1; S.cx = m.placa.w / 2; S.cy = m.placa.h / 2;
}

function aplicarZoom() {
  const a = areaInfo();
  if (!a) return;
  const k = a.base * S.zoom, vw = a.r.width / k, vh = a.r.height / k;
  a.area.querySelector('.desenho').setAttribute('viewBox', `${S.cx - vw / 2} ${S.cy - vh / 2} ${vw} ${vh}`);
  a.area.querySelector('.zoom').textContent = Math.round(S.zoom * 100) + '%';
}

function zoomEm(fator, px, py) {
  const a = areaInfo();
  if (!a) return;
  if (px === undefined) { px = a.r.width / 2; py = a.r.height / 2; }
  const novo = Math.min(12, Math.max(0.4, S.zoom * fator));
  const k1 = a.base * S.zoom, k2 = a.base * novo;
  // o ponto embaixo do mouse continua no mesmo lugar
  S.cx += (px - a.r.width / 2) * (1 / k1 - 1 / k2);
  S.cy += (py - a.r.height / 2) * (1 / k1 - 1 / k2);
  S.zoom = novo;
  aplicarZoom();
}

function nomeDoAlvo(m, alvo, sim) {
  const [k, id] = alvo.split(':');
  if (k === 'peca') {
    const p = m.pecas.find(q => q.ref === id), agora = agoraDe(m, id, sim).replace('agora: ', '');
    const aperta = S.prog.aberto && podeMexer() && p?.eletrica?.modelo === 'chave' ? ` · clique: aperta em ${emSeg(Math.round(S.prog.t))}` : '';
    return `${id} · ${p?.nome ?? ''}${agora ? ' · ' + agora : ''}${aperta}`;
  }
  if (k === 'pino') {
    const pino = pinoDe(m, id), nome = nomePino(m, id);
    if (sim?.nets && pino?.net in sim.nets) return `${nome} · ${volts(sim.nets[pino.net])} V`;
    return pino?.net ? `${nome} · ${pino.net}` : nome;
  }
  if (k === 'trilha') {
    const t = m.trilhas[+id];
    if (!t) return 'trilha';
    const i_t = sim ? correnteNaTrilha(m, sim, t) : null;
    return `trilha ${nomePino(m, t.de)} → ${nomePino(m, t.ate)}${i_t !== null ? ` · ${mA(Math.abs(i_t))} mA` : ''}`;
  }
  if (k === 'furo') return 'Furo de fixação';
  return 'Placa';
}

function selecaoDoAlvo(alvo) {
  const [k, id] = alvo.split(':');
  if (k === 'peca') return { k, ref: id };
  if (k === 'pino') return { k, nome: id };
  if (k === 'trilha' || k === 'furo') return { k, i: +id };
  return null;
}

// ---------- tela inicial: os projetos ----------
async function lerDe(url) {
  try {
    const r = await fetch(url, { cache: 'no-store' });
    return r.ok ? await r.json() : null;
  } catch { return null; }
}

// a tela de projetos relê cada placa a cada 5 s: o arquivo que falta (a placa recém-copiada não tem o modelo nem o
// testes.json) só é perguntado de novo depois de 30 s, em vez de virar um 404 no console a cada volta
async function lerDoInicio(url) {
  if (FALTA_ATE[url] > Date.now()) return null;
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok || r.status === 204) { FALTA_ATE[url] = Date.now() + 30000; return null; }
    return await r.json();
  } catch { return null; }
}

async function listarPlacas() {
  const api = await lerDe('/api/placas');
  if (api) { S.api = true; return api.placas; }
  try {   // sem o app.py (python -m http.server): le a listagem da pasta
    const html = await (await fetch('../placas/', { cache: 'no-store' })).text();
    return [...html.matchAll(/href="([^"/?#]+)\/"/g)].map(x => decodeURIComponent(x[1]));
  } catch { return []; }
}

function miniatura(m, o = {}) {
  const pad = 4;
  return `<svg class="mini" viewBox="${-pad} ${-pad} ${m.placa.w + 2 * pad} ${m.placa.h + 2 * pad}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placa">${placaSVG(m, o)}</svg>`;
}

// a cotacao vale pra versao que foi pro site; se a placa mudou depois, e so historia
function cotacaoAntiga(c, m) { return !!(c?.versao && m?.versao && c.versao !== m.versao); }

function selosDe(t, m, cotacao) {
  let testes = '<span class="selo">sem testes</span>';
  if (t?.rodando) testes = '<span class="selo rodando">testes rodando…</span>';
  else if (t) {
    const falhas = t.etapas.filter(e => e.estado === 'falhou').length, nc = naoConferido(t);
    testes = falhas ? `<span class="selo falha">✗ ${falhas} etapa falhou</span>` : `<span class="selo ok">✓ testes ok</span>${nc.txt ? `<span class="selo pend">${esc(nc.txt)}</span>` : ''}`;
  }
  let fabrica = '';
  const passou = t && !t.rodando && !t.etapas.some(e => e.estado === 'falhou');
  if (cotacao && cotacaoAntiga(cotacao, m)) fabrica = `<span class="selo">fábrica: cotação da v${esc(cotacao.versao)}, a placa mudou</span>`;
  else if (cotacao) fabrica = `<span class="selo ok">fábrica: ${esc(cotacao.situacao || 'cotado')}</span>`;
  else if (m?.fabrica?.pronta && passou) fabrica = '<span class="selo">fabrica.zip pronto</span>';
  else if (m?.fabrica && !m.fabrica.pronta) fabrica = '<span class="selo">fabrica.zip travado</span>';
  return testes + fabrica;
}

async function desenharInicio() {
  document.querySelectorAll('#abas [data-inicio]').forEach(b => b.setAttribute('aria-pressed', b.dataset.inicio === S.inicio));
  if (S.inicio === 'pecas') { if ($('#main').dataset.aba !== 'pecas') { $('#main').innerHTML = ''; $('#main').dataset.aba = 'pecas'; S.brutos.inicio = null; } return desenharCatalogo(); }
  $('#main').dataset.aba = 'projetos';
  const nomes = await listarPlacas();
  if (S.inicio !== 'projetos') return;
  const placas = await Promise.all(nomes.map(async nome => {
    const base = `../placas/${encodeURIComponent(nome)}/`;
    const [modelo, testes, versoes, cotacao] = await Promise.all(
      ['saida/modelo.json', 'testes.json', 'versoes/versoes.json', 'fabrica.json'].map(c => lerDoInicio(base + c)));
    return { nome, modelo, testes, versoes: versoes || [], cotacao };
  }));
  placas.sort((a, b) => (b.versoes.at(-1)?.quando || '').localeCompare(a.versoes.at(-1)?.quando || ''));
  const cartoes = placas.map(p => {
    const v = p.versoes.at(-1);
    return `<a class="cartao" href="?placa=${encodeURIComponent(p.nome)}">
      ${p.modelo ? miniatura(p.modelo) : '<div class="sem-placa">ainda não foi gerada</div>'}
      <span class="titulo-cartao">${esc(p.testes?.objetivo?.titulo || p.nome)}</span>
      <span class="sub mono">placas/${esc(p.nome)}${v ? ` · v${v.v} · ${esc(v.quando)}` : ''}</span>
      <span class="selos">${selosDe(p.testes, p.modelo, p.cotacao)}</span>
    </a>`;
  }).join('');
  const cat = C.dado ? Object.values(C.dado.pecas) : null;
  const html = `<section class="inicio" aria-label="Projetos"><div class="miolo">
    <div><h1>Projetos</h1><span class="sub">${placas.length} ${placas.length === 1 ? 'placa' : 'placas'} em placas/</span></div>
    ${placas.length ? `<div class="cartoes">${cartoes}</div>` : '<p class="vazio">Nenhuma placa em <span class="mono">placas/</span> ainda.</p>'}
    ${cat ? `<button type="button" class="cartao catalogo-cartao" data-inicio="pecas"><span class="titulo-cartao">Peças →</span>
      <span class="sub">${cat.length} peças em ${Object.keys(C.dado.categorias).length} categorias · ${cat.filter(conferidaDe).length} prontas pra placa</span></button>` : ''}
  </div></section>`;
  if (html !== S.brutos.inicio) $('#main').innerHTML = S.brutos.inicio = html;   // so troca se mudou (nao engole clique)
}

// ---------- pecas: a lista de compras de sempre (ferramenta/catalogo/, um arquivo por categoria) ----------
const CORES_PT = { Red: 'vermelho', 'Orange Red': 'laranja-avermelhado', Orange: 'laranja', Yellow: 'amarelo', 'Yellow Green': 'verde-amarelado',
  Green: 'verde', 'Emerald Green': 'verde', Blue: 'azul', White: 'branco' };
const MONTAGEM = { furo: 'de furo', 'superfície': 'de superfície', 'módulo': 'módulo pronto', fio: 'vai no fio, não na placa', 'não informado': 'montagem não informada' };
// 'type|Type': o primeiro atributo que a peca tiver (a loja escreve o mesmo atributo de jeitos diferentes)
const atrib = (e, nome) => (nome || '').split('|').map(n => e.atributos?.[n]).find(v => v && v !== '-');
const emPt = (v, cat) => C.dado?.categorias?.[cat]?.traducoes?.[v] || C.dado?.traducoes?.[v] || CORES_PT[v] || v;   // a da categoria vale primeiro
const dia = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) : '?';
const preco = (v, moeda) => v == null ? '?' : `${moeda === 'BRL' ? 'R$' : 'US$'} ${v < 0.1 ? v.toFixed(4) : v.toFixed(2)}`.replace('.', ',');
const numeroDe = t => { const m = /^\s*([\d.]+)\s*([pnuµmkM]?)/.exec(t || ''); return m ? +m[1] * ({ p: 1e-12, n: 1e-9, u: 1e-6, 'µ': 1e-6, m: 1e-3, k: 1e3, M: 1e6 }[m[2]] || 1) : null; };

// o que se sabe do datasheet da peça, sem dizer mais do que foi feito: conferido no PDF; conferido em parte (o catálogo
// diz o que falta, como o PDF que não foi aberto); ou pronto pra placa pela ficha da loja (o resistor e o capacitor: a
// loja já diz o que a placa precisa, mas ninguém abriu o PDF). As opções do carrinho não trazem o conferido (só o
// 'conferida'): nelas, o resistor e o capacitor contam como da ficha da loja
function seloDoDatasheet(e, conferida) {
  const c = e.conferido, pend = [...(c?.eletrica?.pendentes || []), ...(c?.mecanica?.pendentes || []), ...(c?.pendentes || [])];
  if (c && pend.length) return { txt: 'conferido em parte: falta o que está pendente aqui embaixo', pend };
  if (c) return { txt: '✓ datasheet conferido', pend: [] };
  if (conferida && /^(resistor|capacitor)/.test(e.categoria || '')) return { txt: '✓ pronto pra placa pela ficha da loja (o PDF não foi aberto)', pend: [] };
  return { txt: conferida ? '✓ datasheet conferido' : 'datasheet ainda não conferido', pend: [] };
}

// um cartao de peca: o mesmo no carrinho e na aba Pecas
function cartaoPeca(e, o = {}) {
  const ruim = e.situacao && e.situacao !== 'ok', selo = seloDoDatasheet(e, o.conferida);
  const extra = (o.destaques || []).map(k => atrib(e, k)).filter(Boolean).map(v => emPt(v, e.categoria));
  const outras = (e.outras_lojas || []).filter(x => /^https:\/\//.test(x.link || ''));
  return `<div class="opcao${o.escolhida ? ' escolhida' : ''}${ruim ? ' ruim' : ''}">
      <img src="${e.foto && /^https:\/\//.test(e.foto) ? esc(e.foto) : `/api/foto?codigo=${encodeURIComponent(e.codigo)}`}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <b>${esc(e.apelido || e.nome)}</b><span class="sub">${esc(e.marca)} · ${esc(e.modelo)}${e.loja === 'LCSC' || !e.loja ? ` · ${esc(e.codigo)}` : ''}</span>
      <span>${esc(e.tamanho || '')}${e.montagem ? ` · ${esc(MONTAGEM[e.montagem] || e.montagem)}` : ''}${extra.length ? ` · ${esc(extra.join(' · '))}` : ''}</span>
      <span class="sub">${preco(e.preco, e.moeda)} na ${esc(e.loja || 'LCSC')} · ${ruim ? `<span class="aviso">${esc(e.situacao)}</span>` : e.estoque != null ? `${milhar(e.estoque)} em estoque` : 'estoque não informado'} · visto ${dia(e.visto)}</span>
      ${outras.length ? `<span class="sub">também em: ${outras.map(x => `<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.loja)}${x.preco != null ? ' ' + preco(x.preco, x.moeda) : ''} ↗</a>`).join(', ')}</span>` : ''}
      <span class="sub">${esc(selo.txt)}${/^https:\/\//.test(e.link || '') ? ` · <a href="${esc(e.link)}" target="_blank" rel="noopener">loja ↗</a>` : ''}</span>
      ${selo.pend.map(pendenteHTML).join('')}
      ${o.usos?.length ? `<span class="selo ok">em uso: ${esc(o.usos.join(', '))}</span>` : ''}
      ${o.acao || ''}
    </div>`;
}

async function postar(caminho, corpo) {
  try {
    const r = await fetch(caminho, { method: 'POST', headers: { 'X-Bancada': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
    const d = await r.json().catch(() => ({}));
    return r.ok ? d : { erro: d.erro || 'não deu certo' };
  } catch { return { erro: 'sem resposta do app (ele está aberto?)' }; }
}

const C = { dado: null, cat: 'tudo', texto: '', chip: null, soEstoque: true, soConferidas: false, soFuro: false, todas: false, recado: '', ocupado: false };

async function carregarCatalogo() {
  const d = await lerDe('/api/catalogo');
  if (d) C.dado = d;
  return C.dado;
}

const especDe = id => C.dado?.categorias?.[id] || {};
const conferidaDe = e => !!e.conferido || e.categoria === 'resistor';   // resistor: a loja ja diz tudo

function filtrarCatalogo() {
  const t = C.texto.trim().toLowerCase(), chips = especDe(C.cat).chips;
  return Object.entries(C.dado?.pecas || {}).map(([codigo, e]) => ({ codigo, ...e }))
    .filter(e => (C.cat === 'tudo' || e.categoria === C.cat) && (!C.soEstoque || e.situacao === 'ok')
      && (!C.soConferidas || conferidaDe(e)) && (!C.soFuro || e.montagem === 'furo')
      && (C.chip === null || atrib(e, chips) === C.chip)
      && (!t || [e.nome, e.apelido, e.modelo, e.marca, e.codigo, e.tamanho, e.descricao, especDe(e.categoria).nome].join(' ').toLowerCase().includes(t)))
    .sort((a, b) => (!!C.dado.usos[b.codigo] - !!C.dado.usos[a.codigo]) || (conferidaDe(b) - conferidaDe(a))
      || ((numeroDe(atrib(a, chips)) ?? 0) - (numeroDe(atrib(b, chips)) ?? 0)) || ((b.estoque ?? 0) - (a.estoque ?? 0)));
}

  $('#cat-select').innerHTML = `<option value="tudo"${C.cat === 'tudo' ? ' selected' : ''}>Tudo (${todas.length})</option>` +

      lista.map(([id, s]) => `<option value="${esc(id)}"${C.cat === id ? ' selected' : ''}>${esc(s.nome)} (${conta(id)})</option>`).join('') + '</optgroup>').join('');
